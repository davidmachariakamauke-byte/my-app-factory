// SYNTHESIZED ARCHITECTURE SOUND SYSTEM (Arcade Soundscapes, Micro-Wins & Squad Pings)
const playVoltSound = function(type, pitchModifier = 1.0) {
    try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();
        if (!ctx) return;
        
        const masterGain = ctx.createGain();
        masterGain.connect(ctx.destination);
        
        if (type === 'tick') {
            const osc = ctx.createOscillator();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(440 * pitchModifier, ctx.currentTime);
            masterGain.gain.setValueAtTime(0.02, ctx.currentTime);
            masterGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
            osc.connect(masterGain);
            osc.start();
            osc.stop(ctx.currentTime + 0.05);
        } else if (type === 'hit') {
            const osc = ctx.createOscillator();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(150 * pitchModifier, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800 * pitchModifier, ctx.currentTime + 0.15);
            masterGain.gain.setValueAtTime(0.08, ctx.currentTime);
            masterGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
            osc.connect(masterGain);
            osc.start();
            osc.stop(ctx.currentTime + 0.15);
        } else if (type === 'squad') {
            const chord = [329.63, 392.00, 523.25, 659.25]; // C Major high harmonics
            chord.forEach((freq, idx) => {
                const o = ctx.createOscillator();
                const g = ctx.createGain();
                o.connect(g);
                g.connect(masterGain);
                o.type = 'sine';
                o.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.05);
                g.gain.setValueAtTime(0.03, ctx.currentTime + idx * 0.05);
                g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.05 + 0.25);
                o.start(ctx.currentTime + idx * 0.05);
                o.stop(ctx.currentTime + idx * 0.05 + 0.25);
            });
        } else if (type === 'win') {
            const baseFreq = 523.25 * pitchModifier;
            const sequence = [baseFreq, baseFreq * 1.25, baseFreq * 1.5, baseFreq * 2.0];
            sequence.forEach((freq, idx) => {
                const o = ctx.createOscillator();
                const g = ctx.createGain();
                o.connect(g);
                g.connect(masterGain);
                o.type = 'triangle';
                o.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.08);
                g.gain.setValueAtTime(0.04, ctx.currentTime + idx * 0.08);
                g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.08 + 0.3);
                o.start(ctx.currentTime + idx * 0.08);
                o.stop(ctx.currentTime + idx * 0.08 + 0.3);
            });
        } else if (type === 'fail') {
            const osc = ctx.createOscillator();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(120, ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(60, ctx.currentTime + 0.3);
            masterGain.gain.setValueAtTime(0.06, ctx.currentTime);
            masterGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
            osc.connect(masterGain);
            osc.start();
            osc.stop(ctx.currentTime + 0.3);
        }
    } catch (e) {
        // Safe context rescue
    }
};

    const [flexCardData, setFlexCardData] = useState(null); // Generated SVG/WebGL Neon social asset share representation

    // Internal reference storage for high speed anim loops
    const animationFrameRef = useRef(null);
    const sweepProgressRef = useRef(0);
    const particlesRef = useRef([]);

    // Initialize HTML5 dynamic arcade timing canvas loop
    useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let width = canvas.width;
        let height = canvas.height;

        const resizeCanvas = () => {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = 360;
            width = canvas.width;
            height = canvas.height;
        };
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Core 60 FPS animation tick callback
        const renderLoop = () => {
            ctx.clearRect(0, 0, width, height);

            // Draw dynamic background matrix nodes
            ctx.fillStyle = '#060a17';
            ctx.fillRect(0, 0, width, height);
            
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 1;
            const gridSpacing = 24;
            for (let x = 0; x < width; x += gridSpacing) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
                ctx.stroke();
            }
            for (let y = 0; y < height; y += gridSpacing) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }

            // Render dynamic particle collision points
            particlesRef.current.forEach((p, idx) => {
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.02;
                if (p.alpha <= 0) {
                    particlesRef.current.splice(idx, 1);
                } else {
                    ctx.save();
                    ctx.globalAlpha = p.alpha;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = p.color;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            });

            // Handle dynamic speed sweep indicator based on current state
            if (gameState === "ACTIVE") {
                sweepProgressRef.current += 3.5;
                if (sweepProgressRef.current > width) {
                    sweepProgressRef.current = 0;
                }

                // Draw speed timing indicator bar with fuchsia glow
                ctx.save();
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#d946ef';
                ctx.strokeStyle = '#d946ef';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(sweepProgressRef.current, 0);
                ctx.lineTo(sweepProgressRef.current, height);
                ctx.stroke();
                ctx.restore();

                // Draw sweep neon glow shadow aura
                const gradient = ctx.createLinearGradient(sweepProgressRef.current - 50, 0, sweepProgressRef.current, 0);
                gradient.addColorStop(0, 'rgba(217, 70, 239, 0)');
                gradient.addColorStop(1, 'rgba(217, 70, 239, 0.15)');
                ctx.fillStyle = gradient;
                ctx.fillRect(sweepProgressRef.current - 50, 0, 50, height);

                // Update active multiplier scaling based on sweep metrics
                const dynamicVal = Math.sin(Date.now() / 200) * 4.5 + 5.5;
                setCurrentMultiplier(parseFloat(dynamicVal.toFixed(2)));
            }

            // Draw center anchor targets
            ctx.strokeStyle = 'rgba(20, 184, 166, 0.2)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(width / 2, height / 2, 80, 0, Math.PI * 2);
            ctx.stroke();

            // Draw current feedback text parameters inside timing area
            ctx.save();
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 13px "Share Tech Mono"';
            ctx.textAlign = 'center';
            if (gameState === "ACTIVE") {
                ctx.fillStyle = '#22d3ee';
                ctx.fillText(`SWEEP SIGNAL LOCK ACTIVE`, width / 2, height / 2 - 20);
                ctx.font = 'bold 38px "Share Tech Mono"';
                ctx.fillText(`${currentMultiplier.toFixed(2)}x`, width / 2, height / 2 + 15);
            } else if (gameState === "IMPACT_REACTION") {
                ctx.fillStyle = '#10b981';
                ctx.fillText(`IMPACT RESOLVED`, width / 2, height / 2 - 20);
                ctx.font = 'bold 38px "Share Tech Mono"';
                ctx.fillText(`${lastClaimMultiplier.toFixed(2)}x`, width / 2, height / 2 + 15);
            } else {
                ctx.fillStyle = '#64748b';
                ctx.fillText(`READY FOR INITIATION`, width / 2, height / 2 - 10);
                ctx.fillText(`Tap TRIGGER to fire sweep`, width / 2, height / 2 + 15);
            }
            ctx.restore();

            animationFrameRef.current = requestAnimationFrame(renderLoop);
        };
        animationFrameRef.current = requestAnimationFrame(renderLoop);

        return () => {
            window.removeEventListener('resize', resizeCanvas);
            cancelAnimationFrame(animationFrameRef.current);
        };
    }, [gameState, currentMultiplier]);

    // Handle high frequency reaction triggers
    const triggerTimingReactionCascade = () => {
        if (gameState === "IDLE") {
            setGameState("ACTIVE");
            playVoltSound('hit', 1.0);
            setNetworkActivityLogs(prev => [
                `[ARCADE ENGINE]: Wager processed. Initialized timing sweep. Capping pool limit matched at $${maxCap.toFixed(2)} USDT`,
                ...prev
            ]);
        } else if (gameState === "ACTIVE") {
            // Calculate final claim results
            setGameState("IMPACT_REACTION");
            const finalMult = currentMultiplier;
            setLastClaimMultiplier(finalMult);
            
            // Apply Dynamic Risk Ceiling Cap constraints
            const grossWin = wager * finalMult;
            const finalSafeWin = Math.min(grossWin, maxCap);
            const verifiedFinalMultiplier = finalSafeWin / wager;

            // Update user balance metrics
            const balanceDelta = finalSafeWin - wager;
            setUserBalance(prev => prev + balanceDelta);

            // Execute automated 80/20 platform ledger split protocol
            const houseSplit = wager * 0.80;
            const liquidityPoolInbound = wager * 0.20;
            setHouseRevenueVault(prev => prev + houseSplit);
            setEscrowVaultBalance(prev => prev + liquidityPoolInbound - (balanceDelta > 0 ? balanceDelta : 0));

            // Generate particle micro-explosion cascade matching target location
            for (let i = 0; i < 40; i++) {
                particlesRef.current.push({
                    x: sweepProgressRef.current || 200,
                    y: Math.random() * 360,
                    vx: (Math.random() - 0.5) * 12,
                    vy: (Math.random() - 0.5) * 12,
                    size: Math.random() * 4 + 2,
                    color: finalMult > 4.0 ? '#d946ef' : '#14b8a6',
                    alpha: 1
                });
            }

            if (finalMult > highestMultiplierStreak) {
                setHighestMultiplierStreak(finalMult);
            }

            // Play corresponding audio feedback pitch scaled
            if (finalMult > 1.0) {
                playVoltSound('win', finalMult / 4.0);
            } else {
                playVoltSound('fail', 1.0);
            }

            // Create WebGL / SVG neon share card asset data representation
            setFlexCardData({
                multiplier: finalMult,
                payout: finalSafeWin,
                timestamp: new Date().toLocaleTimeString(),
                hash: "0x" + Array.from({length: 40}, () => Math.floor(Math.random()*16).toString(16)).join('')
            });

            setNetworkActivityLogs(prev => [
                `[RISK SPLIT COMPLETE]: Routed $${houseSplit.toFixed(4)} to process.env.HOUSE_REVENUE_VAULT. Escrow balance verified.`,
                `[PROVABLE FAIR IMPACT]: Seed hash matching triggered. Earned ${finalMult.toFixed(2)}x multiplier (Payout: $${finalSafeWin.toFixed(2)} USDT)`,
                ...prev
            ]);
        }
    };

    const resetTimingSequenceState = () => {
        setGameState("IDLE");
        setFlexCardData(null);
        playVoltSound('tick', 0.8);
    };

    return (
        <div className="glass-panel p-5 rounded-2xl border-teal-500/10 space-y-5">
            
            {/* Real-time multiplier scoreboard */}
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                <div className="bg-slate-950 p-3 rounded-xl text-center border border-slate-900">
                    <span className="text-[10px] text-slate-500 block uppercase font-mono">WAGER BASIS</span>
                    <strong className="text-white text-base font-mono">${wager.toFixed(2)} USDT</strong>
                </div>
                <div className="bg-slate-950 p-3 rounded-xl text-center border border-slate-900">
                    <span className="text-[10px] text-slate-500 block uppercase font-mono">HIGHEST CASCADE</span>
                    <strong className="text-glow-fuchsia text-fuchsia-400 text-base font-mono">{highestMultiplierStreak.toFixed(2)}x</strong>
                </div>
                <div className="bg-slate-950 p-3 rounded-xl text-center border border-slate-900">
                    <span className="text-[10px] text-slate-500 block uppercase font-mono">LAST ATTEMPT</span>
                    <strong className="text-glow-cyan text-teal-400 text-base font-mono">{lastClaimMultiplier.toFixed(2)}x</strong>
                </div>
                <div className="bg-slate-950 p-3 rounded-xl text-center border border-slate-900">
                    <span className="text-[10px] text-slate-500 block uppercase font-mono">LIQUIDITY VAULT</span>
                    <strong className="text-emerald-400 text-base font-mono">${escrowVaultBalance.toLocaleString()}</strong>
                </div>
            </div>

            {/* Canvas viewport container */}
            <div className="relative rounded-2xl overflow-hidden border border-slate-900">
                <canvas 
                    ref={canvasRef}
                    onClick={triggerTimingReactionCascade}
                    className="w-full h-92 cursor-pointer block cyber-grid-canvas"
                />
            </div>

            {/* Interaction control triggers */}
            <div className="flex gap-4">
                {gameState === "IMPACT_REACTION" ? (
                    <button 
                        onClick={resetTimingSequenceState}
                        className="flex-1 bg-slate-900 hover:bg-slate-800 text-white font-grotesk font-black text-xs py-3 rounded-xl transition-all uppercase tracking-widest"
                    >
                        RESET CASCADE SIGNAL
                    </button>
                ) : (
                    <button 
                        onClick={triggerTimingReactionCascade}
                        className={`flex-1 font-grotesk font-black text-xs py-3 rounded-xl transition-all uppercase tracking-widest ${
                            gameState === "ACTIVE" 
                                ? "bg-gradient-to-r from-red-600 to-pink-600 text-white animate-pulse" 
                                : "bg-gradient-to-r from-teal-500 to-cyan-500 text-slate-950 hover:scale-[1.01] active:scale-95"
                        }`}
                    >
                        {gameState === "ACTIVE" ? "LOCK CASCADE TIMING IMPACT NOW" : "INITIATE SWEEP TRIGGER"}
                    </button>
                )}
            </div>

            {/* DYNAMIC SHARABLE NEON SOCIAL PROOF FLEX CARD (File 3 Component) */}
            {flexCardData && (
                <div className="bg-[#090e1a]/95 border-2 border-fuchsia-500/40 p-5 rounded-2xl flex flex-col md:flex-row items-center justify-between gap-6 animate-slideIn">
                    <div className="space-y-2">
                        <span className="bg-fuchsia-500/10 text-fuchsia-400 text-[9px] font-mono font-black px-2.5 py-0.5 rounded border border-fuchsia-500/20 tracking-wider">
                            WEBGL SHARABLE SOCIAL PROOF FLEX CARD
                        </span>
                        <h4 className="font-grotesk font-extrabold text-white text-base">
                            Generated High-Velocity Win Neon Graphic!
                        </h4>
                        <div className="font-mono text-xs text-slate-400 space-y-1">
                            <p>Cascade Multiplier: <strong className="text-teal-400">{flexCardData.multiplier.toFixed(2)}x</strong></p>
                            <p>USDT Reward: <strong className="text-emerald-400">${flexCardData.payout.toFixed(4)} USDT</strong></p>
                            <p>Escrow Proof Hash: <span className="text-[10px] text-fuchsia-300">{flexCardData.hash.slice(0, 24)}...</span></p>
                        </div>
                    </div>
                    
                    <button 
                        onClick={() => {
                            navigator.clipboard.writeText(`I locked in a ${flexCardData.multiplier.toFixed(2)}x multiplier on Voltx Protocol and made $${flexCardData.payout.toFixed(4)} USDT! Join my squad to earn passive splits! https://voltx.io/play/cascade`);
                            alert("Proof message matching dynamic parameters copied for Telegram, Whatsapp and X sharing!");
                            playVoltSound('win');
                        }}
                        className="bg-fuchsia-600 hover:bg-fuchsia-500 text-white font-grotesk font-bold text-xs px-5 py-3 rounded-xl transition-all flex items-center gap-2 shrink-0 tracking-wider"
                    >
                        {SVG_ICONS.share}
                        <span>1-CLICK SHARE WIN DISPATCH</span>
                    </button>
                </div>
            )}

        </div>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
