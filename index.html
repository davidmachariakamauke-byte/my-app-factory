// Audio synthesis for immersive Kenyan marketplace sound cues (M-Pesa chimes, site warning alarms, spade clinks)
const playSound = function(type) {
    try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'click') {
            // Light metal hammer tap
            osc.frequency.setValueAtTime(1000, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(150, ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.04, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
            osc.start();
            osc.stop(ctx.currentTime + 0.1);
        } else if (type === 'mpesa') {
            // Double upbeat chime resembling Safaricom signature sound
            osc.type = 'sine';
            const chord = [523.25, 659.25, 783.99, 1046.50]; // C Major
            chord.forEach(function(freq, idx) {
                const o = ctx.createOscillator();
                const g = ctx.createGain();
                o.connect(g);
                g.connect(ctx.destination);
                o.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.08);
                g.gain.setValueAtTime(0.03, ctx.currentTime + idx * 0.08);
                g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.08 + 0.3);
                o.start(ctx.currentTime + idx * 0.08);
                o.stop(ctx.currentTime + idx * 0.08 + 0.3);
            });
        } else if (type === 'horn') {
            // Boda/Truck dual-tone horn
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(320, ctx.currentTime);
            gain.gain.setValueAtTime(0.03, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
            osc.start();
            osc.stop(ctx.currentTime + 0.25);

            const osc2 = ctx.createOscillator();
            const gain2 = ctx.createGain();
            osc2.connect(gain2);
            gain2.connect(ctx.destination);
            osc2.type = 'sawtooth';
            osc2.frequency.setValueAtTime(380, ctx.currentTime);
            gain2.gain.setValueAtTime(0.03, ctx.currentTime);
            gain2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
            osc2.start();
            osc2.stop(ctx.currentTime + 0.25);
        } else if (type === 'shovel') {
            // Metal friction spade sound
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(200, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.02, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
            osc.start();
            osc.stop(ctx.currentTime + 0.15);
        }
    } catch (e) {
        // Ignored if user gesture restrictions apply
    }
};

    const [bidCoverLetter, setBidCoverLetter] = useState("");
    const [userProfileRole, setUserProfileRole] = useState("Fundi"); // "Fundi" or "Site Owner/Developer"

    // Material Estimator Calculator Inputs and State
    const [calcType, setCalcType] = useState("slab"); // slab, wall, plaster
    const [slabLength, setSlabLength] = useState("10"); // meters
    const [slabWidth, setSlabWidth] = useState("8"); // meters
    const [slabThickness, setSlabThickness] = useState("0.15"); // meters (150mm)
    const [wallLength, setWallLength] = useState("20");
    const [wallHeight, setWallHeight] = useState("3");
    const [plasterArea, setPlasterArea] = useState("100"); // sq meters

    // M-Pesa Interactive Escrow Engine Simulation
    const [mpesaModal, setMpesaModal] = useState(null); // active checkout target details
    const [mpesaPhoneNumber, setMpesaPhoneNumber] = useState("");
    const [mpesaStatus, setMpesaStatus] = useState("idle"); // idle, sending, prompt-shown, verified
    const [mpesaTxCode, setMpesaTxCode] = useState("");

    // Job Posting State for developers/site owners
    const [isPostingJob, setIsPostingJob] = useState(false);
    const [newJobTitle, setNewJobTitle] = useState("");
    const [newJobCategory, setNewJobCategory] = useState("Masonry");
    const [newJobLocation, setNewJobLocation] = useState("Nairobi County");
    const [newJobBudget, setNewJobBudget] = useState("");
    const [newJobDuration, setNewJobDuration] = useState("1 Day");
    const [newJobDescription, setNewJobDescription] = useState("");
    const [newJobRequirements, setNewJobRequirements] = useState("");

    // Chat Simulator with foremen/fundis
    const [chatTarget, setChatTarget] = useState(null);
    const [chatMessage, setChatMessage] = useState("");
    const [chatLogs, setChatLogs] = useState({
        "job-1": [
            { sender: "System", text: "Welcome to Secure Escrow Chat. Your deposits are protected via JengaEscrow till-no parameters.", time: "10:30 AM" },
            { sender: "Mugo Builders Ltd", text: "Sasa Fundi, can you begin on Monday morning 7:00 AM? We need active plastering works completed fast.", time: "10:32 AM" }
        ]
    });

    // Compute dynamic cart totals
    const cartTotal = useMemo(() => {
        return cart.reduce((total, item) => total + (item.price * item.quantity), 0);
    }, [cart]);

    const addToCart = function(material) {
        if (!mute) playSound('shovel');
        setCart(prevCart => {
            const existing = prevCart.find(item => item.id === material.id);
            if (existing) {
                return prevCart.map(item => item.id === material.id ? { ...item, quantity: item.quantity + 1 } : item);
            }
            return [...prevCart, { ...material, quantity: 1 }];
        });
        setIsCartOpen(true);
    };

    const removeFromCart = function(itemId) {
        if (!mute) playSound('click');
        setCart(prevCart => prevCart.filter(item => item.id !== itemId));
    };

    const handleApplyBid = function(e) {
        e.preventDefault();
        if (!bidAmount) {
            alert("Please input a standard daily wage bid!");
            return;
        }
        if (!mute) playSound('mpesa');
        
        // Append bid to the specific job
        setJobs(prevJobs => {
            return prevJobs.map(j => {
                if (j.id === selectedJobForBid.id) {
                    return { ...j, bidsCount: j.bidsCount + 1 };
                }
                return j;
            });
        });

        alert(`Bid of KES ${bidAmount} per day submitted securely! Mugo Builders will contact you via SMS or chat.`);
        setSelectedJobForBid(null);
        setBidAmount("");
        setBidCoverLetter("");
    };

    const handlePostNewJob = function(e) {
        e.preventDefault();
        if (!newJobTitle || !newJobBudget || !newJobDescription) {
            alert("Kindly fill in all the building project parameters!");
            return;
        }
        const createdJob = {
            id: "job-" + (jobs.length + 1),
            title: newJobTitle,
            category: newJobCategory,
            location: newJobLocation,
            budget: parseInt(newJobBudget),
            duration: newJobDuration,
            postedBy: "Your Project Site",
            verified: true,
            urgency: "Immediate",
            phone: "+254 700 000000",
            description: newJobDescription,
            bidsCount: 0,
            requirements: newJobRequirements.split(',').map(r => r.trim()).filter(Boolean)
        };
        setJobs([createdJob, ...jobs]);
        setIsPostingJob(false);
        setNewJobTitle("");
        setNewJobBudget("");
        setNewJobDescription("");
        setNewJobRequirements("");
        if (!mute) playSound('mpesa');
    };

    // Concrete & Brick estimation algorithms matching standard Kenyan building benchmarks
    const estimationResults = useMemo(() => {
        if (calcType === "slab") {
            const l = parseFloat(slabLength) || 0;
            const w = parseFloat(slabWidth) || 0;
            const t = parseFloat(slabThickness) || 0;
            const volume = l * w * t; // cubic meters
            
            // Standard Class 25 concrete mix ratio (1:2:4)
            // Approx 320kg (6.4 bags) cement per cubic meter
            // Approx 0.4 tonnes of river sand per cubic meter
            // Approx 0.8 tonnes of ballast per cubic meter
            const cementBags = Math.ceil(volume * 6.5);
            const sandTonnes = (volume * 0.45).toFixed(1);
            const ballastTonnes = (volume * 0.85).toFixed(1);
            const estimatedCost = (cementBags * 790) + (parseFloat(sandTonnes) * 3200) + (parseFloat(ballastTonnes) * 2800);

            return {
                volume: volume.toFixed(2),
                cement: cementBags,
                sand: sandTonnes,
                ballast: ballastTonnes,
                cost: estimatedCost
            };
        } else if (calcType === "wall") {
            const l = parseFloat(wallLength) || 0;
            const h = parseFloat(wallHeight) || 0;
            const area = l * h;
            
            // Assuming standard 9x4x3 inch quarry stone bricks
            // Approx 55 blocks/bricks per square meter of wall (inclusive of mortar joints)
            const brickCount = Math.ceil(area * 52);
            // Cement & sand for joint mortar
            const cementBags = Math.ceil(area * 0.4);
            const sandTonnes = (area * 0.05).toFixed(1);
            const estimatedCost = (brickCount * 45) + (cementBags * 790) + (parseFloat(sandTonnes) * 3200);

            return {
                area: area.toFixed(1),
                bricks: brickCount,
                cement: cementBags,
                sand: sandTonnes,
                cost: estimatedCost
            };
        } else {
            const area = parseFloat(plasterArea) || 0;
            // 15mm plaster thickness, ratio 1:4
            const cementBags = Math.ceil(area * 0.25);
            const sandTonnes = (area * 0.02).toFixed(1);
            const estimatedCost = (cementBags * 790) + (parseFloat(sandTonnes) * 3200);

            return {
                area: area.toFixed(1),
                cement: cementBags,
                sand: sandTonnes,
                cost: estimatedCost
            };
        }
    }, [calcType, slabLength, slabWidth, slabThickness, wallLength, wallHeight, plasterArea]);

    // Handle interactive M-Pesa simulated flow
    const triggerMpesaCheckout = function(payload) {
        if (!mute) playSound('click');
        setMpesaPhoneNumber("");
        setMpesaStatus("idle");
        setMpesaModal(payload);
    };

    const processMpesaEscrowSimulation = function() {
        if (!mpesaPhoneNumber.startsWith("07") && !mpesaPhoneNumber.startsWith("01") && !mpesaPhoneNumber.startsWith("+254")) {
            alert("Kindly enter a valid Safaricom phone number starting with 07 or 01!");
            return;
        }
        if (!mute) playSound('mpesa');
        setMpesaStatus("sending");

        setTimeout(() => {
            setMpesaStatus("prompt-shown");
        }, 1500);
    };

    const confirmMpesaPinInput = function() {
        setMpesaStatus("verifying");
        setTimeout(() => {
            // Generate valid simulated M-Pesa transaction ID
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
            let tx = "S";
            for(let i=0; i<9; i++) {
                tx += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            setMpesaTxCode(tx);
            setMpesaStatus("verified");
            if (!mute) playSound('mpesa');

            // If paying for materials, clear cart
            if (mpesaModal.type === "cart") {
                setCart([]);
            }
        }, 2000);
    };

    // Chat function
    const sendChatMessage = function(e) {
        e.preventDefault();
        if (!chatMessage.trim()) return;
        
        const targetId = chatTarget.id;
        const currentMsgs = chatLogs[targetId] || [];
        const newMsg = {
            sender: "You",
            text: chatMessage,
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })

                        React.createElement("button", {
                            onClick: () => setMpesaModal(null),

                    ),

                    mpesaStatus === "idle" && React.createElement("div", { className: "space-y-3" },
                        React.createElement("label", { className: "block text-[10px] font-mono text-slate-400" }, "SAFARICOM M-PESA PHONE NUMBER"),
                        React.createElement("input", {
                            type: "text",
                            placeholder: "e.g. 0712345678",
                            value: mpesaPhoneNumber,
                            onChange: (e) => setMpesaPhoneNumber(e.target.value),
                            className: "w-full p-2.5 rounded-lg font-mono text-sm"
                        }),
                        React.createElement("button", {
                            onClick: processMpesaEscrowSimulation,
                            className: "w-full py-2.5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-grotesk font-bold text-xs rounded-xl"
                        }, "Initialize STK Express Push")

                        React.createElement("span", { className: "text-2xl" }, "📱"),
                        React.createElement("p", { className: "text-xs text-white" }, `An STK push request of KES ${mpesaModal.price.toLocaleString()} has been dispatched to ${mpesaPhoneNumber}. Enter your PIN to lock funds in Escrow.`),
                        React.createElement("button", {
                            onClick: confirmMpesaPinInput,
                            className: "w-full py-2 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-grotesk font-extrabold text-xs rounded-lg uppercase tracking-wider"

                        React.createElement("div", { className: "w-6 h-6 border-2 border-amber-500 border-t-transparent rounded-full animate-spin mx-auto" }),
                        React.createElement("p", { className: "text-xs font-mono text-slate-400" }, "Awaiting network node transaction confirmation...")

                    mpesaStatus === "verified" && React.createElement("div", { className: "bg-emerald-950/20 border border-emerald-500/20 p-4 rounded-xl text-center space-y-2" },
                        React.createElement("span", { className: "text-2xl" }, "🛡️"),
                        React.createElement("h4", { className: "font-grotesk font-bold text-xs text-emerald-400" }, "PAYMENT SECURED IN JENGA ESCROW"),
                        React.createElement("p", { className: "text-[10px] font-mono text-slate-400 break-all" }, `M-Pesa Tx Ref: ${mpesaTxCode}`),
                        React.createElement("button", {
                            onClick: () => setMpesaModal(null),
                            className: "px-4 py-1.5 bg-slate-900 text-slate-300 text-xs font-grotesk font-semibold rounded border border-slate-800"

                chatTarget ? React.createElement("div", { className: "jenga-panel p-5 space-y-3 bg-[#121826] relative" },
                    React.createElement("div", { className: "flex items-center justify-between border-b border-slate-900 pb-2.5" },
                        React.createElement("div", { className: "flex items-center gap-2" },
                            React.createElement("span", { className: "w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse" }),
                            React.createElement("div", null,
                                React.createElement("h4", { className: "font-grotesk font-bold text-xs text-white" }, chatTarget.title || chatTarget.name),
                                React.createElement("span", { className: "text-[9px] text-amber-500 font-mono block" }, chatTarget.rating)
                            )
                        ),
                        React.createElement("button", {
                            onClick: () => setChatTarget(null),
                            className: "text-slate-500 hover:text-white font-mono text-xs"
                        }, "[ Close ]")
                    ),

                    // Chat messages viewport
                    React.createElement("div", { className: "h-48 overflow-y-auto space-y-2 pr-1" },
                        (chatLogs[chatTarget.id] || [
                            { sender: "System", text: "Escrow tunnel mapped. Standard daily milestones secure the payment schedule.", time: "10:30 AM" }

                            React.createElement("div", {
                                key: idx,
                                className: "p-2 rounded text-xs border max-w-[85%] " + (

                                    ? "bg-slate-950 border-slate-900 text-slate-500 mx-auto text-center" 
                                    : "bg-slate-900 border-slate-800 text-slate-300"
                                )
                            },
                                React.createElement("div", { className: "flex justify-between items-center text-[9px] text-slate-500 mb-0.5" },
                                    React.createElement("span", { className: "font-bold" }, msg.sender),
                                    React.createElement("span", null, msg.time)
                                ),
                                React.createElement("p", { className: "font-mono" }, msg.text)
                            ))
                        ))
                    ),

                    // Input Form
                    React.createElement("form", { onSubmit: sendChatMessage, className: "flex gap-2 pt-2 border-t border-slate-900" },
                        React.createElement("input", {
                            type: "text",
                            placeholder: "Type message to builder...",
                            value: chatMessage,
                            onChange: (e) => setChatMessage(e.target.value),
                            className: "flex-1 p-2 text-xs rounded-lg focus:outline-none"
                        }),
                        React.createElement("button", {
                            type: "submit",
                            className: "px-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-grotesk font-black text-xs rounded-lg uppercase"
                        }, "Send")
                    )
                ) : React.createElement("div", { className: "jenga-panel p-5 text-center text-slate-500 space-y-2" },
                    React.createElement("span", { className: "text-3xl block" }, "💬"),
                    React.createElement("p", { className: "text-xs font-grotesk" }, "Direct Messaging Hub"),
                    React.createElement("p", { className: "text-[10px] text-slate-600 font-mono leading-normal" }, "Click chat under any job listing or verified worker profile to map secure coordinates & confirm milestones.")
                )

        // FOOTER DETAILS
        React.createElement("footer", { className: "border-t border-slate-900 bg-[#070b13] py-8 mt-12 relative z-30 text-xs font-mono text-slate-500" },
            React.createElement("div", { className: "max-w-7xl mx-auto px-4 flex flex-col md:flex-row items-center justify-between gap-6" },
                React.createElement("div", { className: "space-y-1.5 text-center md:text-left" },
                    React.createElement("p", { className: "text-slate-400 font-grotesk font-bold text-sm" }, "© 2025 JengaKazi Kenya Ltd."),
                    React.createElement("p", null, "Safaricom Payment Gateway Integration Terminal: Till No. 902235")
                ),
                React.createElement("div", { className: "flex gap-4 flex-wrap justify-center text-[11px]" },
                    React.createElement("a", { href: "#", className: "hover:text-amber-500" }, "Vifaa vya Mjengo Yard Limits"),
                    React.createElement("span", null, "|"),
                    React.createElement("a", { href: "#", className: "hover:text-amber-500" }, "NITA Safety Standards"),
                    React.createElement("span", null, "|"),
                    React.createElement("a", { href: "#", className: "hover:text-amber-500" }, "Privacy Policy & Escrow Terms")
                )
            )
        )

    );
}
