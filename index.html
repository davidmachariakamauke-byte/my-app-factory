    // Material & Structural Cost Estimator engine
    const runEstimator = () => {
        const length = parseFloat(calcLength) || 0;
        const width = parseFloat(calcWidth) || 0;
        const thickness = parseFloat(calcThickness) || 0;

        if (calcType === 'concrete') {
            const volume = length * width * thickness;
            // Concrete Mix design (1:2:4 ratio approximation standard for housing concrete)
            const cementBags = Math.ceil(volume * 8.2); // approx bags per m3
            const sandTonnes = (volume * 0.65).toFixed(1);
            const ballastTonnes = (volume * 1.15).toFixed(1);
            setCalcResults({
                volume: volume.toFixed(2),
                cement: cementBags,
                sand: sandTonnes,
                ballast: ballastTonnes,
                totalCost: (cementBags * 645) + (parseFloat(sandTonnes) * 2500) + (parseFloat(ballastTonnes) * 2000)
            });
        } else {
            const area = length * width; // height acting as width for brick surface calculation
            const bricksRequired = Math.ceil(area * 55); // standard block estimate
            const cementForMortar = Math.ceil(bricksRequired * 0.022);
            setCalcResults({
                area: area.toFixed(1),
                bricks: bricksRequired,
                cement: cementForMortar,
                totalCost: (bricksRequired * 45) + (cementForMortar * 645)
            });
        }
    };
