    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Constants
        const TREASURY_ADDRESS = "0xe69aE274c4D814fDB312120d3db1C5c2BD63a071";
        
        // Helper for URL parameters
        const getUrlMatchId = () => {
            const params = new URLSearchParams(window.location.search);
            return params.get('match');
        };

        // Main App Component
        function App() {
            const [account, setAccount] = useState(null);
            const [provider, setProvider] = useState(null);
            const [matchId, setMatchId] = useState(getUrlMatchId());
            const [stakeAmount, setStakeAmount] = useState('0.05');
            const [matchState, setMatchState] = useState('IDLE'); // IDLE, CREATED, JOINED, LOCKED, SETTLED
            const [roomData, setRoomData] = useState(null);
            const [terminalLogs, setTerminalLogs] = useState([
                { time: new Date().toLocaleTimeString(), type: 'SYS', msg: 'System initialized. Aetheris V8 Core active.' },
                { time: new Date().toLocaleTimeString(), type: 'NET', msg: 'WebSocket tunnel ready. Awaiting neural handshake...' }
            ]);
            const wsRef = useRef(null);

            // Connect Wallet Function
            const connectWallet = async () => {
                if (window.ethereum) {
                    try {
                        const web3Provider = new ethers.BrowserProvider(window.ethereum);
                        const accounts = await web3Provider.send("eth_requestAccounts", []);
                        const userAddress = accounts[0];
                        setProvider(web3Provider);
                        setAccount(userAddress);
                        addLog('NET', `Wallet connected successfully: ${userAddress.substring(0,6)}...${userAddress.substring(38)}`);
                    } catch (err) {
                        addLog('ERR', `Wallet connection failed: ${err.message}`);
                    }
                } else {
                    alert("Please install MetaMask or another Web3 compatible browser wallet.");
                }
            };

            const addLog = (type, msg) => {
                setTerminalLogs(prev => [...prev, { time: new Date().toLocaleTimeString(), type, msg }]);
            };

            // WebSocket Connection management
            useEffect(() => {
                const currentMatchId = matchId || localStorage.getItem('aetheris_active_match');
                if (currentMatchId) {
                    if (!matchId) setMatchId(currentMatchId);
                    
                    // Simulate or connect to WS backend endpoint
                    const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                    const wsHost = window.location.host || 'localhost:8000';
                    const wsUrl = `${wsProtocol}//${wsHost}/ws/match/${currentMatchId}`;
                    
                    addLog('NET', `Connecting to match room telemetry: ${currentMatchId}`);
                    
                    // Fallback mock WebSocket simulation if backend isn't live locally
                    try {
                        wsRef.current = new WebSocket(wsUrl);
                        wsRef.current.onopen = () => {
                            addLog('NET', 'Secure WebSocket tunnel established.');
                        };
                        wsRef.current.onmessage = (event) => {
                            const data = JSON.parse(event.data);
                            handleWsMessage(data);
                        };
                        wsRef.current.onerror = () => {
                            addLog('ERR', 'WebSocket live server offline. Operating in simulation mode.');
                            setupMockWsSimulation(currentMatchId);
                        };
                    } catch (e) {
                        setupMockWsSimulation(currentMatchId);
                    }
                }
            }, [matchId]);

            const setupMockWsSimulation = (activeMatchId) => {
                setTimeout(() => {
                    addLog('AI', 'AI Referee telemetry buffer active. Scanning match parameters.');
                    setRoomData({
                        match_id: activeMatchId,
                        creator: '0x71C...392A',
                        challenger: matchId ? (account || '0x49F...881B') : null,
                        stake: '0.05 ETH',
                        status: matchId ? 'READY' : 'WAITING_FOR_CHALLENGER'
                    });
                    if(matchId) {
                        setMatchState('JOINED');
                    }
                }, 1000);
            };

            const handleWsMessage = (data) => {
                addLog(data.type || 'SYS', data.message || JSON.stringify(data));
                if(data.room_update) {
                    setRoomData(data.room_update);
                }
            };

            // Create Match (Creator Mode)
            const handleCreateMatch = async () => {
                if (!account) {
                    alert("Please connect your wallet first.");
                    return;
                }
                const newMatchId = 'aeth-' + Math.random().toString(36.25, 36).substring(2, 9);
                setMatchId(newMatchId);
                localStorage.setItem('aetheris_active_match', newMatchId);
                
                // Update URL without reload
                const newUrl = `${window.location.pathname}?match=${newMatchId}`;
                window.history.pushState({ path: newUrl }, '', newUrl);

                addLog('SEC', `Escrow contract initialized. Stake: ${stakeAmount} ETH locked.`);
                addLog('SYS', `Generated cryptographic match token: ${newMatchId}`);
                
                setMatchState('CREATED');
                setRoomData({
                    match_id: newMatchId,
                    creator: account,
                    challenger: null,
                    stake: `${stakeAmount} ETH`,
                    status: 'WAITING_FOR_CHALLENGER'
                });
            };

            // Join Match (Challenger Mode)
            const handleJoinMatch = async () => {
                if (!account) {
                    alert("Please connect your wallet first.");
                    return;
                }
                addLog('SEC', `Executing stake transfer & routing 2.5% protocol fee to ${TREASURY_ADDRESS}...`);
                
                // Simulate smart contract escrow deposit & fee split
                setTimeout(() => {
                    addLog('SEC', 'Smart Contract Escrow Funded. Both player stakes locked.');
                    addLog('AI', 'AI Referee initialized. Match arena parameters locked.');
                    setMatchState('LOCKED');
                    setRoomData(prev => ({
                        ...prev,
                        challenger: account,
                        status: 'MATCH_READY'
                    }));
                }, 1500);
            };

            return (
                <div className="flex-1 flex flex-col lg:flex-row p-6 gap-6 max-w-7xl mx-auto w-full">
                    
                    {/* Left Column: Interactive Cyber Console / Match Control */}
                    <div className="flex-1 flex flex-col space-y-6">
                        
                        {/* Hero / Mode Banner */}
                        <div className="glass-panel rounded-xl p-6 relative overflow-hidden cyber-border">
                            <div className="absolute -right-10 -bottom-10 w-40 h-40 bg-cyan-500/10 rounded-full blur-2xl pointer-events-none"></div>
                            
                            <div className="flex items-center justify-between mb-4">
                                <span className="px-3 py-1 rounded bg-cyan-500/10 text-cyan-400 font-mono text-xs border border-cyan-500/30">
                                    {matchId ? (account && roomData?.creator === account ? 'CREATOR MODE' : 'CHALLENGER MODE') : 'NEW MATCH CREATOR'}
                                </span>
                                <span className="text-xs font-mono text-slate-400">PROTOCOL v8.0</span>
                            </div>

                            <h2 className="text-2xl font-orbitron font-bold mb-2">
                                {matchId ? 'COMPETITIVE ESCROW ROOM' : 'INITIATE HIGH-STAKES DUEL'}
                            </h2>
                            <p className="text-slate-400 text-sm mb-6">
                                {matchId 
                                    ? 'A secure cryptographic channel has been established. Review telemetry below and lock your stake to begin.'
                                    : 'Set your match stake in native EVM tokens. Generate an immutable challenge link and dispatch it to your opponent.'}
                            </p>

                            {/* Conditional UI: Creator vs Challenger */}
                            {!matchId ? (
                                /* Creator Form */
                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-mono text-cyan-400 mb-2">STAKE AMOUNT (ETH / USDC)</label>
                                        <div className="flex items-center space-x-2">
                                            <input 
                                                type="number" 
                                                value={stakeAmount}
                                                onChange={(e) => setStakeAmount(e.target.value)}
                                                className="bg-slate-900 border border-slate-700 rounded px-4 py-2.5 text-white font-mono flex-1 focus:outline-none focus:border-cyan-500"
                                                placeholder="0.05"
                                            />
                                            <span className="font-mono text-slate-400 px-3 py-2.5 bg-slate-900 border border-slate-800 rounded">ETH</span>
                                        </div>
                                    </div>

                                    <div className="p-3 bg-slate-900/60 rounded border border-slate-800 text-xs font-mono text-slate-400 flex items-center justify-between">
                                        <span>Protocol Fee (Auto-routed):</span>
                                        <span className="text-emerald-400 font-bold">2.5% -&gt; Treasury</span>
                                    </div>

                                    <button 
                                        onClick={handleCreateMatch}
                                        disabled={!account}
                                        className={`w-full py-3.5 rounded font-orbitron font-bold tracking-wider text-sm transition-all duration-300 ${account ? 'bg-gradient-to-r from-cyan-500 to-emerald-500 text-slate-950 hover:opacity-90 cyber-glow-cyan cursor-pointer' : 'bg-slate-800 text-slate-500 cursor-not-allowed'}`}
                                    >
                                        {account ? 'GENERATE SECURE INVITE LINK' : 'CONNECT WALLET TO CONTINUE'}
                                    </button>
                                </div>
                            ) : (
                                /* Match Room Active UI */
                                <div className="space-y-6">
                                    <div className="p-4 rounded-lg bg-slate-900/80 border border-cyan-500/30 space-y-3">
                                        <div className="flex justify-between items-center text-xs font-mono">
                                            <span className="text-slate-400">MATCH ID:</span>
                                            <span className="text-cyan-400">{matchId}</span>
                                        </div>
                                        <div className="flex justify-between items-center text-xs font-mono">
                                            <span className="text-slate-400">STAKE LOCKED:</span>
                                            <span className="text-emerald-400">{roomData?.stake || `${stakeAmount} ETH`}</span>
                                        </div>
                                        <div className="flex justify-between items-center text-xs font-mono">
                                            <span className="text-slate-400">STATUS:</span>
                                            <span className="text-cyan-400 uppercase animate-pulse">{roomData?.status || 'WAITING'}</span>
                                        </div>
                                    </div>

                                    {/* Shareable Link Box */}
                                    <div className="space-y-2">
                                        <label className="block text-xs font-mono text-cyan-400">SHAREABLE CHALLENGE URL</label>
                                        <div className="flex items-center space-x-2">
                                            <input 
                                                type="text" 
                                                readOnly
                                                value={window.location.href}
                                                className="bg-slate-900 border border-slate-700 rounded px-3 py-2 text-xs text-slate-300 font-mono flex-1 focus:outline-none"
                                            />

                                                    navigator.clipboard.writeText(window.location.href);

                                            >
                                                COPY
                                            </button>
                                        </div>
                                    </div>

                                    {/* Challenger Join Action if loaded via link */}
                                    {matchState !== 'LOCKED' && (
                                        <button 
                                            onClick={handleJoinMatch}
                                            disabled={!account}
                                            className={`w-full py-3.5 rounded font-orbitron font-bold tracking-wider text-sm transition-all duration-300 ${account ? 'bg-gradient-to-r from-emerald-500 to-cyan-500 text-slate-950 hover:opacity-90 cyber-glow-green cursor-pointer' : 'bg-slate-800 text-slate-500 cursor-not-allowed'}`}
                                        >
                                            {account ? 'MATCH STAKE & JOIN DUEL' : 'CONNECT WALLET TO JOIN'}

                                    )}

                                            <p className="text-xs font-mono text-slate-300">AI Referee telemetry active. Game servers initiating...</p>
                                        </div>
                                    )}
                                </div>
                            )}

                        </div>

                        {/* Live Telemetry Visualizer (AI Radar) */}
                        <div className="glass-panel rounded-xl p-6 cyber-border relative flex flex-col items-center justify-center min-h-[220px]">
                            <div className="absolute top-4 left-4 flex items-center space-x-2">
                                <span className="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
                                <span className="text-xs font-mono text-cyan-400">AI MEMORY BUFFER & TELEMETRY</span>
                            </div>

                            {/* Radar Scanning Visual */}
                            <div className="relative w-36 h-36 rounded-full border border-cyan-500/30 flex items-center justify-center mt-6">
                                <div className="absolute inset-0 rounded-full border border-cyan-500/10 scale-75"></div>

                                <div className="w-3 h-3 bg-cyan-400 rounded-full cyber-glow-cyan animate-pulse"></div>
                            </div>
                            <div className="mt-4 text-center font-mono text-xs text-slate-400">
                                SCANNING STATUS: <span className="text-emerald-400">SECURE [0 ANOMALIES]</span>
                            </div>
                        </div>

                    </div>

                    {/* Right Column: Neural Console Terminal */}
                    <div className="w-full lg:w-96 flex flex-col space-y-6">
                        <div className="glass-panel rounded-xl p-5 cyber-border flex-1 flex flex-col min-h-[450px]">
                            <div className="flex items-center justify-between pb-3 border-b border-slate-800 mb-3">
                                <div className="flex items-center space-x-2">
                                    <div className="w-2.5 h-2.5 rounded-full bg-cyan-400"></div>
                                    <span className="font-orbitron text-xs font-bold tracking-wider text-slate-200">NEURAL CONSOLE</span>
                                </div>
                                <span className="text-[10px] font-mono text-slate-500">WEBSOCKET v8.0</span>

                            <div className="flex-1 bg-slate-950/80 rounded border border-slate-900 p-3 font-mono text-xs overflow-y-auto max-h-[400px] space-y-2">
                                {terminalLogs.map((log, index) => (
                                    <div key={index} className="leading-relaxed">

                                            [{log.type}]
                                        </span>{' '}
                                        <span className="text-slate-300">{log.msg}</span>
                                    </div>
                                ))}
                            </div>

                            {/* Protocol Treasury Reminder */}
                            <div className="mt-4 pt-3 border-t border-slate-800/80 text-[11px] font-mono text-slate-400 space-y-1">
                                <div className="flex justify-between">
                                    <span className="text-slate-500">ROUTING TARGET:</span>
                                    <span className="text-cyan-400 font-bold truncate max-w-[180px]">0xe69aE...071</span>
                                </div>
                                <div className="flex justify-between">
                                    <span className="text-slate-500">STATE SYNC:</span>
                                    <span className="text-emerald-400">REALTIME WSS</span>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            );
        }

        // Wallet Component rendered in header
        function WalletButton() {

                            CONNECT WALLET

                    )}
                </div>
            );
        }

        // Render React components
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
        ReactDOM.createRoot(document.getElementById('wallet-root')).render(<WalletButton />);
    </script>

      ```python
      import os
      from fastapi import FastAPI, WebSocket, WebSocketDisconnect, HTTPException
      from fastapi.middleware.cors import CORSMiddleware
      from pydantic import BaseModel
      import uuid
      from typing import Dict, List
      from .services.web3_rail import Web3RailService

      app = FastAPI(title="Aetheris V8 Protocol Engine", version="8.0.4")

      app.add_middleware(
          CORSMiddleware,
          allow_origins=["*"],
          allow_credentials=True,
          allow_methods=["*"],
          allow_headers=["*"],
      )

      web3_rail = Web3RailService()

      # In-memory match room manager
      class ConnectionManager:
          def __init__(self):
              self.active_connections: Dict[str, List[WebSocket]] = {}

          async def connect(self, match_id: str, websocket: WebSocket):
              await websocket.accept()
              if match_id not in self.active_connections:
                  self.active_connections[match_id] = []
              self.active_connections[match_id].append(websocket)

          def disconnect(self, match_id: str, websocket: WebSocket):
              if match_id in self.active_connections:
                  self.active_connections[match_id].remove(websocket)
                  if not self.active_connections[match_id]:
                      del self.active_connections[match_id]

          async def broadcast(self, match_id: str, message: dict):
              if match_id in self.active_connections:
                  for connection in self.active_connections[match_id]:
                      await connection.send_json(message)

      manager = ConnectionManager()

      class MatchCreateRequest(BaseModel.
