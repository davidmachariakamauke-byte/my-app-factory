const injectStylesAndFonts = () => {
    const link1 = document.createElement('link');
    link1.rel = 'preconnect';
    link1.href = 'https://fonts.googleapis.com';
    document.head.appendChild(link1);

    const link2 = document.createElement('link');
    link2.rel = 'preconnect';
    link2.href = 'https://fonts.gstatic.com';
    link2.crossOrigin = 'anonymous';
    document.head.appendChild(link2);

    const link3 = document.createElement('link');
    link3.href = 'https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap';
    link3.rel = 'stylesheet';
    document.head.appendChild(link3);

    const style = document.createElement('style');
    style.innerHTML = `
        body {
            background-color: #f8fafc;
            color: #0f172a;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .heading-font {
            font-family: 'Sora', sans-serif;
        }
        .bg-construction-pattern {
            background-color: #0f172a;
            background-image: 
                radial-gradient(rgba(245, 158, 11, 0.1) 1px, transparent 0),
                radial-gradient(rgba(245, 158, 11, 0.1) 1px, transparent 0);
            background-size: 24px 24px;
            background-position: 0 0, 12px 12px;

        .yellow-glow {
            box-shadow: 0 4px 20px -2px rgba(245, 158, 11, 0.3);

    `;
    document.head.appendChild(style);
};

    const calculations = useMemo(() => {
        const area = calcWallLength * calcWallHeight;

        if (calcThickness === "9inch") {

            stonesCount = Math.ceil(area * 12.5);
            // Rough estimation rules for mortar and laying
            cementBags = Math.ceil(area * 0.45);

                                            value={calcWallHeight} 
                                            onChange={(e) => setCalcWallHeight(Math.max(1, parseInt(e.target.value) || 0))}
                                            className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 font-mono text-sm focus:outline-none focus:border-amber-500 focus:bg-white"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1.5">Unene wa Mawe (Stone Thickness)</label>
                                        <div className="grid grid-cols-2 gap-2">
                                            {["9inch", "6inch"].map(t => (
                                                <button
                                                    key={t}
                                                    onClick={() => setCalcThickness(t)}
                                                    className={`py-2 rounded-lg text-xs font-bold transition-all border ${
                                                        calcThickness === t 
                                                        ? "bg-amber-50 border-amber-500 text-amber-700 shadow-sm" 
                                                        : "bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100"
                                                    }`}
                                                >
                                                    {t === "9inch" ? "9x9 Inch Wall" : "6x9 Inch Wall"}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                </div>

                                {/* Calculated output fields */}
                                <div className="bg-slate-50 rounded-2xl p-5 border border-slate-200 space-y-4 md:col-span-2">
                                    <h4 className="heading-font font-bold text-sm text-slate-950 uppercase tracking-wider text-slate-700">2. Makadirio ya Vifaa Yanayohitajika</h4>
                                    
                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                        
                                        <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                                            <span className="text-[10px] text-slate-400 font-bold uppercase block">Matofali ya Quarry (Stones)</span>
                                            <span className="text-2xl font-black text-slate-950 font-mono mt-1 block">
                                                {calculations.stonesCount.toLocaleString()} <span className="text-xs font-normal text-slate-500">pcs</span>
                                            </span>
                                            <span className="text-[10px] text-slate-400 mt-2 block">Avg cost: KES {(calculations.stonesCount * 35).toLocaleString()}</span>
                                        </div>

                                        <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                                            <span className="text-[10px] text-slate-400 font-bold uppercase block">Simiti (Bamburi Cement)</span>
                                            <span className="text-2xl font-black text-slate-950 font-mono mt-1 block">
                                                {calculations.cementBags} <span className="text-xs font-normal text-slate-500">bags</span>
                                            </span>
                                            <span className="text-[10px] text-slate-400 mt-2 block">Avg cost: KES {(calculations.cementBags * 820).toLocaleString()}</span>
                                        </div>

                                        <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                                            <span className="text-[10px] text-slate-400 font-bold uppercase block">Mchanga (River Sand)</span>
                                            <span className="text-2xl font-black text-slate-950 font-mono mt-1 block">
                                                {calculations.sandTons} <span className="text-xs font-normal text-slate-500">Tons</span>
                                            </span>
                                            <span className="text-[10px] text-slate-400 mt-2 block">Avg cost: KES {Math.ceil(calculations.sandTons * 3600).toLocaleString()}</span>
                                        </div>

                                    </div>

                                    <div className="mt-4 pt-4 border-t border-slate-200 flex flex-col sm:flex-row items-center justify-between gap-4">
                                        <div>
                                            <span className="text-[10px] text-slate-500 uppercase tracking-wider block font-bold">TOTAL ESTIMATED MATERIAL COST</span>
                                            <span className="text-2xl font-black text-amber-600 font-mono">KES {calculations.totalCost.toLocaleString()}</span>
                                        </div>
                                        <button 
                                            onClick={() => {
                                                triggerToast("Estimations exported! Added items to your Cart.");
                                                setCart([
                                                    ...cart, 
                                                    { name: `Quarry Stones (${calculations.stonesCount} pcs)`, price: calculations.stonesCount * 35, unit: "Pcs", itemType: "material" },
                                                    { name: `Bamburi Cement (${calculations.cementBags} Bags)`, price: calculations.cementBags * 820, unit: "Bags", itemType: "material" }
                                                ]);
                                            }}
                                            className="bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold text-xs px-5 py-3 rounded-xl transition-all shadow-md flex items-center space-x-1.5"
                                        >
                                            <span>Add Materials to Site Sheet</span>
                                            <Icons.ArrowRight className="w-4 h-4" />
                                        </button>
                                    </div>
                                </div>

                            </div>
                        </div>
                    )}

                </div>

                {/* RIGHT COLUMN - LIVE ORDER SHEET & LOCAL INSIGHTS (Col Span 3) */}
                <div className="lg:col-span-3 space-y-6">
                    
                    {/* Live Order Sheet / Quick Quote Calculator */}
                    <div className="bg-slate-900 text-white rounded-3xl p-5 shadow-xl border border-slate-800 relative overflow-hidden bg-construction-pattern">
                        <h3 className="heading-font font-extrabold text-sm tracking-wider uppercase text-amber-400 pb-3 border-b border-slate-800 mb-4 flex items-center space-x-2">
                            <Icons.Briefcase />
                            <span>Kikapu cha Leo (Order Sheet)</span>
                        </h3>

                        {cart.length === 0 ? (
                            <div className="text-center py-8 text-slate-400">
                                <p className="text-xs font-semibold">Your site basket is empty.</p>
                                <p className="text-[10px] text-slate-500 mt-1">Select materials, rental tools, or logistics options on the left to add them here.</p>
                            </div>
                        ) : (
                            <div className="space-y-3">
                                <div className="max-h-60 overflow-y-auto space-y-2 pr-1">
                                    {cart.map((item, idx) => (
                                        <div key={idx} className="bg-slate-800/60 p-2.5 rounded-xl border border-slate-700 flex justify-between items-center text-xs">
                                            <div>
                                                <span className="font-bold block truncate max-w-[140px]">{item.name || item.vehicleType}</span>
                                                <span className="text-[10px] text-slate-400">{item.itemType}</span>
                                            </div>
                                            <span className="font-mono font-bold text-amber-400">KES {item.price ? item.price.toLocaleString() : item.baseRate.toLocaleString()}</span>
                                        </div>
                                    ))}
                                </div>

                                <div className="border-t border-slate-800 pt-3 mt-3 space-y-2">
                                    <div className="flex justify-between text-xs text-slate-400">
                                        <span>Items count:</span>
                                        <span className="font-bold text-white">{cart.length}</span>
                                    </div>
                                    <div className="flex justify-between text-sm">
                                        <span className="font-bold text-amber-400">Total Price:</span>
                                        <span className="font-mono font-black text-white">
                                            KES {cart.reduce((acc, curr) => acc + (curr.price || curr.baseRate), 0).toLocaleString()}
                                        </span>
                                    </div>
                                </div>

                                <button 
                                    onClick={() => {
                                        const total = cart.reduce((acc, curr) => acc + (curr.price || curr.baseRate), 0);
                                        if (mpesaWallet < total) {
                                            triggerToast("M-Pesa balance is too low! Please top up first.");
                                        } else {
                                            setMpesaWallet(prev => prev - total);
                                            setCart([]);
                                            triggerToast("Order placed successfully! M-Pesa transaction complete. Driver/Supplier has been booked.");
                                        }
                                    }}
                                    className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-xs py-3 rounded-xl transition-all mt-4 flex items-center justify-center space-x-1"
                                >
                                    <span>Pay with M-Pesa</span>
                                </button>
                                
                                <button 
                                    onClick={() => setCart([])}
                                    className="w-full text-center text-[10px] text-slate-400 hover:text-white mt-1"
                                >
                                    Clear Sheet
                                </button>
                            </div>
                        )}
                    </div>

                    {/* Local Kenyan Regulatory Advisory */}
                    <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm space-y-3">
                        <h4 className="heading-font font-bold text-xs text-slate-900 uppercase tracking-widest flex items-center space-x-1.5">
                            <Icons.HardHat className="text-amber-500" />
                            <span>Sheria na Kibali (Compliance)</span>
                        </h4>
                        <div className="space-y-2.5 text-xs text-slate-600">
                            <div className="p-2.5 bg-slate-50 rounded-lg">
                                <span className="font-bold block text-[11px] text-slate-800">NCA Registration</span>
                                <p className="text-[10px] text-slate-500 mt-0.5">All structural builders & Fundis should check registration mandates with National Construction Authority (NCA) of Kenya.</p>
                            </div>
                            <div className="p-2.5 bg-slate-50 rounded-lg">
                                <span className="font-bold block text-[11px] text-slate-800">NEMA Permit Checks</span>
                                <p className="text-[10px] text-slate-500 mt-0.5">Sand & heavy concrete machinery operations near river beds require environmental audits from NEMA.</p>
                            </div>
                        </div>
                    </div>

                </div>

            </main>

            {/* SIMULATED POST JOB MODAL */}
            {showPostJobModal && (
                <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div className="bg-white rounded-3xl max-w-lg w-full p-6 sm:p-8 space-y-5 shadow-2xl border border-slate-100">
                        <div className="flex justify-between items-start">
                            <div>
                                <h3 className="heading-font font-extrabold text-xl text-slate-950">Tangaza Kazi Mpya ya Mjengo</h3>
                                <p className="text-xs text-slate-500">Post a new gig to thousands of Kenyan construction workers instantly.</p>
                            </div>
                            <button 
                                onClick={() => setShowPostJobModal(false)}
                                className="p-1 rounded-lg hover:bg-slate-100 text-slate-400 hover:text-slate-950"
                            >
                                ✕
                            </button>
                        </div>

                        <form onSubmit={handleCreateJob} className="space-y-4">
                            <div>
                                <label className="block text-xs font-bold text-slate-700 mb-1">Kichwa cha Kazi (Job Title)</label>
                                <input 
                                    type="text" 
                                    placeholder="e.g., Fundi wa Mabati au Plumber needed"
                                    value={newJobTitle}
                                    onChange={(e) => setNewJobTitle(e.target.value)}
                                    className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-amber-500 focus:bg-white"
                                />
                            </div>

                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-xs font-bold text-slate-700 mb-1">Eneo (Location / Road)</label>
                                    <input 
                                        type="text" 
                                        placeholder="e.g., Ruiru Stage, Thika Road"
                                        value={newJobLocation}
                                        onChange={(e) => setNewJobLocation(e.target.value)}
                                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-amber-500 focus:bg-white"
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-700 mb-1">Mkoa (County)</label>
                                    <select 
                                        value={newJobCounty}
                                        onChange={(e) => setNewJobCounty(e.target.value)}
                                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-amber-500 focus:bg-white"
                                    >
                                        {counties.map(c => (
                                            <option key={c} value={c}>{c}</option>
                                        ))}
                                    </select>
                                </div>
                            </div>

                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-xs font-bold text-slate-700 mb-1">Malipo kwa Siku (Wage per Day KES)</label>
                                    <input 
                                        type="number" 
                                        placeholder="e.g., 1500"
                                        value={newJobBudget}
                                        onChange={(e) => setNewJobBudget(e.target.value)}
                                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-amber-500 focus:bg-white font-mono"
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-700 mb-1">Ujuzi Unaohitajika (Comma separated)</label>
                                    <input 
                                        type="text" 
                                        placeholder="Masonry, Plastering, Wood"
                                        value={newJobSkills}
                                        onChange={(e) => setNewJobSkills(e.target.value)}
                                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-amber-500 focus:bg-white"
                                    />
                                </div>
                            </div>

                            <button 
                                type="submit"
                                className="w-full bg-amber-500 hover:bg-amber-400 text-slate-900 font-extrabold text-sm py-3 rounded-xl transition-all shadow-md yellow-glow"
                            >
                                Tuma Tangazo la Kazi (Publish Job)
                            </button>
                        </form>
                    </div>
                </div>
            )}

            {/* DYNAMIC TOAST NOTIFICATION */}
            {showToast && (
                <div className="fixed bottom-5 right-5 bg-slate-900 text-white px-5 py-4 rounded-2xl border border-amber-500/30 shadow-2xl z-50 max-w-sm animate-bounce flex items-start space-x-3">
                    <span className="p-1 rounded-full bg-amber-500 text-slate-950">
                        <Icons.Check className="w-4 h-4" />
                    </span>
                    <div>
                        <p className="text-xs font-bold text-slate-100">{toastMessage}</p>
                        <span className="text-[10px] text-slate-400 font-mono">Just now • JengaLink Notification</span>
                    </div>
                </div>
            )}

            {/* PLATFORM FOOTER */}
            <footer className="bg-slate-900 text-slate-400 border-t border-slate-800 py-12 mt-12">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 grid grid-cols-1 md:grid-cols-4 gap-8">
                    
                    <div className="space-y-4">
                        <div className="flex items-center space-x-2">
                            <div className="w-8 h-8 rounded-lg bg-amber-500 flex items-center justify-center text-slate-900">
                                <Icons.HardHat className="w-4 h-4" />
                            </div>
                            <h2 className="heading-font font-bold text-lg text-white">JengaLink Kenya</h2>
                        </div>
                        <p className="text-xs leading-relaxed text-slate-400">
                            Connecting all construction fundis, material suppliers, tool rental dealers, and truckers in Kenya. Raising the standards of Mjengo builders.
                        </p>
                    </div>

                    <div>
                        <h4 className="heading-font font-bold text-sm text-white mb-3 uppercase tracking-wider">Quick Links</h4>
                        <ul className="space-y-2 text-xs">
                            <li><button onClick={() => setActiveTab("kazi")} className="hover:text-amber-400 transition-colors">Vibarua na Kazi Zilizopo</button></li>
                            <li><button onClick={() => setActiveTab("vifaa")} className="hover:text-amber-400 transition-colors font-medium">Soko la Vifaa vya Mjengo</button></li>
                            <li><button onClick={() => setActiveTab("vifaaRent")} className="hover:text-amber-400 transition-colors">Kukodisha Mixer na Scaffold</button></li>
                            <li><button onClick={() => setActiveTab("estimator")} className="hover:text-amber-400 transition-colors">Mjengo Material Calculator</button></li>
                        </ul>
                    </div>

                    <div>
                        <h4 className="heading-font font-bold text-sm text-white mb-3 uppercase tracking-wider">Major Hubs Covered</h4>
                        <ul className="space-y-1.5 text-xs">
                            <li>• Gikomba & Kamukunji Hardwares</li>
                            <li>• Ruiru & Juja Stone Quarries</li>
                            <li>• Machakos Sand Aggregates</li>
                            <li>• Mombasa Cement Distributors</li>
                        </ul>
                    </div>

                    <div>
                        <h4 className="heading-font font-bold text-sm text-white mb-3 uppercase tracking-wider">Hotlines / Support</h4>
                        <p className="text-xs text-slate-400 leading-relaxed mb-3">Reach out to our JengaLink County administrators for dispute resolutions or bulk materials procurement.</p>
                        <span className="inline-flex items-center space-x-1.5 bg-slate-800 text-amber-400 px-3 py-1.5 rounded-lg text-xs font-bold">
                            <Icons.Phone className="w-3.5 h-3.5" />
                            <span>0700-JENGA-LINK</span>
                        </span>
                    </div>

                </div>

                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 border-t border-slate-800 mt-8 pt-8 flex flex-col sm:flex-row items-center justify-between text-xs text-slate-500">
                    <p>© {new Date().getFullYear()} JengaLink Kenya (Soko la Mjengo). Under National Construction Authority Regulatory Audits.</p>
                    <p className="mt-2 sm:mt-0 font-mono text-amber-500">Built with pride for local Kenyan Fundis & Contractors</p>
                </div>
            </footer>

        </div>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
