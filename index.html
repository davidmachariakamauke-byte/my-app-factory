<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KaziConnect</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { background-color: #f8fafc; font-family: ui-sans-serif, system-ui, sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
const { useState, useMemo, useEffect, useRef } = React;

// Dynamically inject Cyberpunk Fonts and Styles into the Document Head
const injectStylesAndFonts = () => {
    // Add Google Fonts
    const link1 = document.createElement('link');
    link1.rel = 'preconnect';
    link1.href = 'https://fonts.googleapis.com';
    document.head.appendChild(link1);

    const link2 = document.createElement('link');
    link2.rel = 'preconnect';
    link2.href = 'https://fonts.gstatic.com';
    link2.crossOrigin = 'anonymous';
    document.head.appendChild(link2);

    const link3 = document.createElement('link');
    link3.href = 'https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap';
    link3.rel = 'stylesheet';
    document.head.appendChild(link3);

    // CSS Keyframes & Overrides
    const style = document.createElement('style');
    style.innerHTML = `
        body {
            background-color: #030712;
            color: #f3f4f6;
            font-family: 'Rajdhani', sans-serif;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(6, 182, 212, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 0% 100%, rgba(16, 185, 129, 0.05) 0%, transparent 40%);
            overflow-x: hidden;
        }
        .cyber-font {
            font-family: 'Orbitron', sans-serif;
        }
        @keyframes radar-pulse {
            0% { transform: scale(0.2); opacity: 0.8; }
            100% { transform: scale(1.1); opacity: 0; }
        }
        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
        @keyframes glitch {
            0% { clip-path: inset(40% 0 61% 0); }
            20% { clip-path: inset(92% 0 1% 0); }
            40% { clip-path: inset(25% 0 58% 0); }
            60% { clip-path: inset(75% 0 5% 0); }
            80% { clip-path: inset(54% 0 21% 0); }
            100% { clip-path: inset(11% 0 85% 0); }
        }
        .animate-radar {
            animation: radar-pulse 3s cubic-bezier(0.21, 0.6, 0.35, 1) infinite;
        }
        .cyber-grid {
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(6, 182, 212, 0.04) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(6, 182, 212, 0.04) 1px, transparent 1px);
        }
        .cyber-scanline {
            background: linear-gradient(to bottom, rgba(6, 182, 212, 0) 0%, rgba(6, 182, 212, 0.15) 10%, rgba(6, 182, 212, 0) 20%);
            animation: scanline 8s linear infinite;
        }
        .cyber-glow {
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.15);
        }
        .cyber-glow-green {
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
        }
        /* Hide scrollbars for slick terminal feel */
        .terminal-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .terminal-scroll::-webkit-scrollbar-track {
            background: rgba(3, 7, 18, 0.5);
        }
        .terminal-scroll::-webkit-scrollbar-thumb {
            background: rgba(6, 182, 212, 0.3);
            border-radius: 2px;
        }
    `;
    document.head.appendChild(style);
};

// Elegant, precise Custom SVGs matching the cyberpunk aesthetics
const Icons = {
    Cpu: () => (
        <svg className="w-5 h-5 text-cyan-400" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
            <rect x="4" y="4" width="16" height="16" rx="2" />
            <path d="M9 9h6v6H9zM9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 15h3M1 9h3M1 15h3" />
        </svg>
    ),
    Shield: () => (
        <svg className="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
        </svg>
    ),
    Terminal: () => (
        <svg className="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
            <polyline points="4 17 10 11 4 5" />
            <line x1="12" y1="19" x2="20" y2="19" />
        </svg>
    ),
    Wallet: () => (
        <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
            <path d="M21 5v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
        </svg>
    ),
    Activity: () => (
        <svg className="w-5 h-5 text-cyan-400" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
        </svg>
    ),
    Lock: () => (
        <svg className="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
        </svg>
    ),
    Share: () => (
        <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
            <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13" />
        </svg>
    ),
    AlertTriangle: () => (
        <svg className="w-5 h-5 text-rose-500" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" />
            <line x1="12" y1="9" x2="12" y2="13" />
            <line x1="12" y1="17" x2="12.01" y2="17" />
        </svg>
    ),
    Users: () => (
        <svg className="w-5 h-5 text-cyan-400" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
            <circle cx="9" cy="7" r="4" />
            <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
            <path d="M16 3.13a4 4 0 0 1 0 7.75" />
        </svg>
    ),
    Refresh: () => (
        <svg className="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67" />
        </svg>
    )
};

function App() {
    // Inject custom styling & custom google fonts during initial load
    useEffect(() => {
        injectStylesAndFonts();
    }, []);

    // Master configuration variables
    const PROTOCOL_TREASURY = "0xe69aE274c4D814fDB312120d3db1C5c2BD63a071";
    const PLATFORM_FEE_PCT = 2.5; // 2.5% protocol fee dynamically routed

    // Core Web3 wallet variables
    const [provider, setProvider] = useState(null);
    const [signer, setSigner] = useState(null);
    const [walletAddress, setWalletAddress] = useState("");
    const [walletBalance, setWalletBalance] = useState("0.00");
    const [networkName, setNetworkName] = useState("Unknown");
    const [isConnecting, setIsConnecting] = useState(false);

    // ESCROW Platform states
    const [matchId, setMatchId] = useState("");
    const [isChallengerMode, setIsChallengerMode] = useState(false);
    const [stakeAmount, setStakeAmount] = useState("0.05");
    const [selectedToken, setSelectedToken] = useState("ETH");
    const [creatorLocked, setCreatorLocked] = useState(false);
    const [challengerLocked, setChallengerLocked] = useState(false);
    const [inviteUrl, setInviteUrl] = useState("");
    const [activeMatchState, setActiveMatchState] = useState("IDLE"); // IDLE, LOCKING, DISPATCHED, ACTIVE, ANALYZING, WINNER_DECIDED, COMPLETED
    const [winnerAddress, setWinnerAddress] = useState("");
    
    // Multi-player State Sync (Mocked Websocket syncing combined with standard real-time variables)
    const [player1Address, setPlayer1Address] = useState("");
    const [player2Address, setPlayer2Address] = useState("");
    const [player1Ready, setPlayer1Ready] = useState(false);
    const [player2Ready, setPlayer2Ready] = useState(false);
    
    // Terminal Log messages
    const [terminalLogs, setTerminalLogs] = useState([]);
    const terminalEndRef = useRef(null);

    // AI Telemetry Stream data variables
    const [telemetryAps, setTelemetryAps] = useState(132);
    const [telemetryPing, setTelemetryPing] = useState(12);
    const [telemetryFps, setTelemetryFps] = useState(144);
    const [antiCheatConfidence, setAntiCheatConfidence] = useState(99.98);
    const [telemetryLogs, setTelemetryLogs] = useState([]);
    const [telemetryStatus, setTelemetryStatus] = useState("OFFLINE");

    // Dynamic generation of UUID for dynamic invite matching
    const generateUUID = () => {
        return 'aeth-' + Math.random().toString(36).substring(2, 10).toUpperCase() + '-' + Math.floor(1000 + Math.random() * 9000);
    };

    // Console logging utility to drive the neural terminal console interface
    const logToTerminal = (text, type = "SYSTEM") => {
        const time = new Date().toLocaleTimeString();
        const colors = {
            SYSTEM: "text-cyan-400 font-bold",
            WARNING: "text-amber-400 font-bold",
            ESCROW: "text-emerald-400 font-black",
            FAILURE: "text-rose-500 font-bold",
            SUCCESS: "text-green-400 font-bold"
        };
        const log = { id: Math.random(), text, type: type, time, color: colors[type] || "text-gray-300" };
        setTerminalLogs((prev) => [...prev, log]);
    };

    // Auto Scroll Terminal to the absolute bottom on updates
    useEffect(() => {
        if (terminalEndRef.current) {
            terminalEndRef.current.scrollIntoView({ behavior: 'smooth' });
        }
    }, [terminalLogs]);

    // Track dynamic query variables inside load to launch Creator vs Challenger workflows
    useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const match = params.get('match');
        if (match) {
            setMatchId(match);
            setIsChallengerMode(true);
            setActiveMatchState("LOCKING");
            setPlayer2Ready(true);
            logToTerminal(`[AETHERIS REDIRECT] Dynamic Match Invite Detected. Match ID: ${match}`, "SYSTEM");
            logToTerminal(`[CHALLENGER_MODE] Loaded directly into Challenger portal. Awaiting hyper-wallet alignment.`, "WARNING");
        } else {
            logToTerminal("System operational. Mode: Creator Initialization Platform ready.", "SYSTEM");
        }
    }, []);

    // Telemetry and Anti-Cheat data simulation engine running periodically
    useEffect(() => {
        const timer = setInterval(() => {
            if (activeMatchState === "ACTIVE" || activeMatchState === "ANALYZING") {
                setTelemetryAps(Math.floor(120 + Math.random() * 30));
                setTelemetryPing(Math.floor(8 + Math.random() * 8));
                setTelemetryFps(Math.floor(140 + Math.random() * 10));
                setAntiCheatConfidence(parseFloat((99.8 + Math.random() * 0.19).toFixed(2)));
                
                // Random game event stream diagnostics
                const triggers = [
                    "AI Ref verifying input packets... Cleared.",
                    "Latency thresholds confirmed. Stable route locked.",
                    "Memory scan validation checks running... 0 hooks found.",
                    "Integrity check signature matches EVM ledger perfectly.",
                    "Analyzing frame timings... No timing anomalies detected."
                ];
                const item = triggers[Math.floor(Math.random() * triggers.length)];
                setTelemetryLogs((prev) => [item, ...prev.slice(0, 5)]);
            }
        }, 3000);
        return () => clearInterval(timer);
    }, [activeMatchState]);

    // Handle MetaMask / EVM browser connection standard Ethers setup
    const handleConnectWallet = async () => {
        setIsConnecting(true);
        logToTerminal("Initializing Handshake with Web3 Provider...", "SYSTEM");
        
        if (typeof window.ethereum === "undefined") {
            logToTerminal("No EVM-compatible browser wallet located. Please install MetaMask.", "FAILURE");
            setIsConnecting(false);
            return;
        }

        try {
            // Ethers.js v6 standard initiation
            const web3Provider = new ethers.BrowserProvider(window.ethereum);
            const signerResult = await web3Provider.getSigner();
            const currentAddress = await signerResult.getAddress();
            const network = await web3Provider.getNetwork();
            const nativeBalance = await web3Provider.getBalance(currentAddress);

            setProvider(web3Provider);
            setSigner(signerResult);
            setWalletAddress(currentAddress);
            setWalletBalance(parseFloat(ethers.formatEther(nativeBalance)).toFixed(4));
            setNetworkName(network.name === "unknown" ? "Mainnet" : network.name);

            logToTerminal(`Wallet Synced. Node Address: ${currentAddress.substring(0, 8)}...${currentAddress.substring(34)}`, "SUCCESS");
            logToTerminal(`Chain: ${network.name.toUpperCase()} | Engine Balance: ${ethers.formatEther(nativeBalance)} ETH`, "SYSTEM");

            // Setup players dynamically based on workspace modes
            if (isChallengerMode) {
                setPlayer2Address(currentAddress);
                setPlayer1Address("0x71C...3E12"); // Simulated remote host address
                setPlayer1Ready(true);
            } else {
                setPlayer1Address(currentAddress);
                setPlayer1Ready(true);
            }
        } catch (error) {
            console.error(error);
            logToTerminal(`Handshake failed: ${error.message}`, "FAILURE");
        } finally {
            setIsConnecting(false);
        }
    };

    // CREATOR: Generate custom invite link trigger
    const handleGenerateInvite = async () => {
        if (!walletAddress) {
            logToTerminal("CRITICAL: You must link your dynamic wallet node to launch a workspace.", "WARNING");
            return;
        }

        const id = generateUUID();
        setMatchId(id);
        const dynamicUrl = `${window.location.origin}${window.location.pathname}?match=${id}`;
        setInviteUrl(dynamicUrl);
        setCreatorLocked(true);
        setPlayer1Ready(true);
        setActiveMatchState("LOCKING");
        
        logToTerminal(`[ESCROW_INITIATED] Generated match hash ${id}`, "ESCROW");
        logToTerminal(`Stake set to: ${stakeAmount} ${selectedToken}`, "SYSTEM");
        logToTerminal(`Invite payload deployed. Route available.`, "SUCCESS");

        // Simulate real-time websocket handshaking behavior to wait for a challenger
        setTimeout(() => {
            logToTerminal(`[SOCKETS] Connected to ws://localhost:8000/ws/match/${id}`, "SYSTEM");
            logToTerminal(`[AETHERIS_WS] Matchroom open. Ready for Player 2 payload connect...`, "WARNING");
        }, 1000);
    };

    // CHALLENGER: Locks their wager stake in response to dynamic link
    const handleChallengerJoin = async () => {
        if (!walletAddress) {
            logToTerminal("ERROR: Connect Web3 nodes before matching the wager.", "WARNING");
            return;
        }

        logToTerminal(`Validating locked credentials for Matchroom: ${matchId}`, "SYSTEM");
        logToTerminal(`Staking required balance: ${stakeAmount} ${selectedToken}...`, "ESCROW");
        
        try {
            // Simulated transaction execution targeting protocol fees & smart contract deposit
            setIsConnecting(true);
            logToTerminal(`Disbursing 2.5% protocol fee (${(parseFloat(stakeAmount) * 0.025).toFixed(5)} ${selectedToken}) to core treasury: ${PROTOCOL_TREASURY.substring(0, 10)}...`, "ESCROW");
            
            // Artificial smart contract call delay to simulate actual blockchain network confirmation
            setTimeout(() => {
                setChallengerLocked(true);
                setPlayer2Ready(true);
                setActiveMatchState("ACTIVE");
                setTelemetryStatus("LIVE TELEMETRY BROADCASTING");
                logToTerminal(`Block confirmed. Challenge accepted. Matchroom state updated to ACTIVE.`, "SUCCESS");
                logToTerminal(`[ANTI_CHEAT] Neural referee telemetry is now auditing live matches. No hacks permitted.`, "WARNING");
            }, 2500);
        } catch (error) {
            logToTerminal(`Transaction rejected by user wallet provider.`, "FAILURE");
            setIsConnecting(false);
        }
    };

    // Simulation trigger representing dynamic game completion verified by AI referee checks
    const runCheatScannerAndSettle = (winnerSelection) => {
        setActiveMatchState("ANALYZING");
        logToTerminal("[AI_REFEREE] Halting game engine telemetry. Parsing match metrics...", "WARNING");
        logToTerminal("[AI_REFEREE] Checking frame rates, inputs per minute, and memory hooks...", "SYSTEM");

        setTimeout(() => {
            const targetWinner = winnerSelection === 1 ? player1Address : player2Address;
            setWinnerAddress(targetWinner);
            setActiveMatchState("WINNER_DECIDED");
            
            logToTerminal(`[AI_DECISION] Zero anomalies detected in biometrics. Decision finalized.`, "SUCCESS");
            logToTerminal(`[WINNER] Target node ${targetWinner.substring(0, 8)}... declared victorious.`, "SUCCESS");
        }, 3000);
    };

    // Final transfer routing both the winning payout and fee collections to Aetheris Protocol Wallets
    const handleFinalizePayout = async () => {
        if (!signer) {
            logToTerminal("No connected provider to dispatch payouts. Align Hyper-Wallet.", "FAILURE");
            return;
        }

        logToTerminal("Routing multi-signature transactions to treasury ledger...", "SYSTEM");
        const totalPrize = parseFloat(stakeAmount) * 2;
        const netWinnings = totalPrize * (1 - (PLATFORM_FEE_PCT / 100));
        const finalPlatformFee = totalPrize * (PLATFORM_FEE_PCT / 100);

        logToTerminal(`Platform rake collection of ${finalPlatformFee.toFixed(5)} ${selectedToken} dispatched automatically to Protocol Treasury: ${PROTOCOL_TREASURY}`, "ESCROW");
        logToTerminal(`Net winning jackpot of ${netWinnings.toFixed(5)} ${selectedToken} delivered to verified winner node.`, "SUCCESS");

        setActiveMatchState("COMPLETED");
        logToTerminal(`[COMPLETED] Match ${matchId} terminated successfully. Matchroom destroyed.`, "SYSTEM");
    };

    const handleReset = () => {
        window.history.replaceState({}, document.title, window.location.pathname);
        setMatchId("");
        setIsChallengerMode(false);
        setCreatorLocked(false);
        setChallengerLocked(false);
        setInviteUrl("");
        setActiveMatchState("IDLE");
        setWinnerAddress("");
        setPlayer1Ready(false);
        setPlayer2Ready(false);
        setPlayer1Address(walletAddress || "");
        setPlayer2Address("");
        logToTerminal("Platform states recycled. Ready for clean session deployment.", "SYSTEM");
    };

    return (
        <div className="min-h-screen pb-12 relative flex flex-col font-medium">
            {/* Structural Cyber-grid vector background and static overlay scanline */}
            <div className="absolute inset-0 cyber-grid pointer-events-none z-0" />
            <div className="absolute inset-0 cyber-scanline pointer-events-none z-10" />

            {/* Platform Master Header */}
            <header className="border-b border-cyan-500/20 bg-slate-950/80 backdrop-blur-md relative z-20">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
                    
                    {/* Brand Badge */}
                    <div className="flex items-center space-x-3">
                        <div className="w-10 h-10 rounded border border-cyan-500/40 flex items-center justify-center bg-cyan-950/40 shadow-[0_0_15px_rgba(6,182,212,0.2)]">
                            <span className="cyber-font font-black text-lg text-cyan-400 animate-pulse">A</span>
                        </div>
                        <div>
                            <div className="flex items-center space-x-2">
                                <h1 className="cyber-font font-black text-xl tracking-wider text-cyan-400 bg-clip-text">AETHERIS V8</h1>
                                <span className="text-[9px] px-1.5 py-0.5 rounded border border-cyan-500/30 bg-cyan-950/80 text-cyan-400 font-mono tracking-widest font-bold">ESCROW Engine</span>
                            </div>
                            <p className="text-[10px] text-gray-400 uppercase tracking-widest font-semibold">Decentralized Web3 Competitive Gaming Shield</p>
                        </div>
                    </div>

                    {/* Web3 wallet management widget */}
                    <div className="flex items-center space-x-4">
                        {walletAddress ? (
                            <div className="flex items-center space-x-3 bg-cyan-950/40 border border-cyan-500/30 rounded px-3 py-1.5">
                                <div className="text-right">
                                    <span className="text-[9px] text-cyan-400 font-mono tracking-widest block font-bold">NODE {networkName.toUpperCase()}</span>
                                    <span className="text-xs text-white font-mono font-bold">{walletBalance} ETH</span>
                                </div>
                                <div className="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse" />
                                <span className="text-xs font-mono text-gray-300">
                                    {walletAddress.substring(0, 6)}...{walletAddress.substring(38)}
                                </span>
                            </div>
                        ) : (
                            <button 
                                onClick={handleConnectWallet}
                                disabled={isConnecting}
                                className="cyber-font font-bold text-xs tracking-wider uppercase border border-cyan-500/60 bg-cyan-950/60 hover:bg-cyan-950 px-5 py-2.5 rounded text-cyan-400 transition-all hover:scale-105 shadow-[0_0_15px_rgba(6,182,212,0.2)]"
                            >
                                {isConnecting ? "SYNCHRONIZING..." : "CONNECT WEB3 HYPER-WALLET"}
                            </button>
                        )}
                    </div>
                </div>
            </header>

            {/* System Status Banner */}
            <div className="bg-cyan-950/20 border-b border-cyan-500/10 py-2.5 px-4 relative z-20">
                <div className="max-w-7xl mx-auto flex items-center justify-between text-xs text-cyan-400/90 font-mono">
                    <div className="flex items-center space-x-2">
                        <span className="w-2 h-2 rounded-full bg-cyan-400 animate-ping" />
                        <span>AETHERIS NETWORK ENGINE: ONLINE</span>
                    </div>
                    <div className="hidden md:flex items-center space-x-6">
                        <span>TREASURY: <b className="text-white">{PROTOCOL_TREASURY.substring(0, 10)}...</b></span>
                        <span>FEE RATIO: <b className="text-emerald-400">2.5% ROUTED</b></span>
                    </div>
                </div>
            </div>

            {/* Core Application Grid */}
            <main className="max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8 flex-1 grid grid-cols-1 lg:grid-cols-12 gap-8 relative z-20">
                
                {/* Column 1: ESCROW CONTROLLER WORKSPACE (Col Span 4) */}
                <section className="lg:col-span-4 space-y-6">
                    
                    <div className="bg-slate-950/80 border border-cyan-500/20 rounded p-6 backdrop-blur-md shadow-lg relative overflow-hidden">
                        <div className="absolute top-0 right-0 w-16 h-16 bg-gradient-to-br from-cyan-500/10 to-transparent pointer-events-none" />
                        
                        <div className="flex items-center justify-between pb-4 border-b border-cyan-500/10 mb-5">
                            <h2 className="cyber-font font-black text-sm tracking-widest text-cyan-400 uppercase flex items-center space-x-2">
                                <Icons.Cpu />
                                <span>PROTOCOL ESCROW PORTAL</span>
                            </h2>
                            <span className="text-[10px] bg-cyan-900/40 text-cyan-400 px-2 py-0.5 rounded border border-cyan-500/20 font-mono font-bold">
                                V8.2
                            </span>
                        </div>

                        {/* Direct Challenger Notification and Interface */}
                        {isChallengerMode ? (
                            <div className="space-y-5">
                                <div className="p-4 rounded border border-amber-500/30 bg-amber-950/10 space-y-2">
                                    <div className="flex items-center space-x-2 text-amber-400 text-xs font-bold uppercase tracking-wider">
                                        <Icons.AlertTriangle />
                                        <span>CHALLENGE TARGET ACTIVE</span>
                                    </div>
                                    <p className="text-xs text-gray-300 font-medium">
                                        You loaded directly via matchroom invitation. To participate, approve the match stake parameters below to lock funds in the neural escrow escrow.
                                    </p>
                                </div>

                                <div className="p-4 rounded border border-cyan-500/20 bg-slate-900/60 space-y-3 font-mono text-xs">
                                    <div className="flex justify-between">
                                        <span className="text-gray-400">Matchroom ID:</span>
                                        <span className="text-cyan-400 font-bold">{matchId}</span>
                                    </div>
                                    <div className="flex justify-between">
                                        <span className="text-gray-400">Required Stake:</span>
                                        <span className="text-white font-bold">{stakeAmount} {selectedToken}</span>
                                    </div>
                                    <div className="flex justify-between">
                                        <span className="text-gray-400">Network Host:</span>
                                        <span className="text-emerald-400">0x71C...3E12</span>
                                    </div>
                                </div>

                                {!challengerLocked ? (
                                    <button 
                                        onClick={handleChallengerJoin}
                                        disabled={!walletAddress}
                                        className={`w-full cyber-font py-3.5 rounded font-black text-xs uppercase tracking-wider transition-all ${
                                            walletAddress 
                                            ? "bg-emerald-500 text-slate-950 hover:bg-emerald-400 shadow-[0_0_15px_rgba(16,185,129,0.3)] hover:scale-[1.02]" 
                                            : "bg-slate-800 text-gray-500 cursor-not-allowed"
                                        }`}
                                    >
                                        MATCH STAKE & JOIN ESCROW
                                    </button>
                                ) : (
                                    <div className="p-3 rounded border border-emerald-500/30 bg-emerald-950/10 text-center">
                                        <span className="text-emerald-400 text-xs font-mono font-bold block uppercase">✔ ESCROW STAKE COMPLETED</span>
                                        <span className="text-[10px] text-gray-400">Awaiting match execution variables...</span>
                                    </div>
                                )}
                            </div>
                        ) : (
                            /* Creator Mode UI configuration elements */
                            <div className="space-y-5">
                                <div className="space-y-2">
                                    <label className="block text-[11px] text-cyan-400 uppercase tracking-widest font-bold">1. Select Settlement Token</label>
                                    <div className="grid grid-cols-2 gap-2.5">
                                        {["ETH", "USDC"].map((token) => (
                                            <button 
                                                key={token}
                                                disabled={creatorLocked}
                                                onClick={() => setSelectedToken(token)}
                                                className={`py-2 rounded font-mono font-bold text-xs transition-all border ${
                                                    selectedToken === token 
                                                    ? "bg-cyan-950/60 text-cyan-400 border-cyan-400/80 shadow-[0_0_10px_rgba(6,182,212,0.15)]" 
                                                    : "bg-slate-900/40 text-gray-400 border-cyan-500/10 hover:border-cyan-500/30"
                                                }`}
                                            >
                                                {token}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div className="space-y-2">
                                    <label className="block text-[11px] text-cyan-400 uppercase tracking-widest font-bold">2. Define Stake Limit</label>
                                    <div className="relative">
                                        <input 
                                            type="number" 
                                            disabled={creatorLocked}
                                            value={stakeAmount}
                                            onChange={(e) => setStakeAmount(e.target.value)}
                                            placeholder="0.05"
                                            className="w-full bg-slate-900/60 border border-cyan-500/20 text-white rounded px-3.5 py-2.5 font-mono text-sm focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400"
                                        />
                                        <span className="absolute right-3.5 top-3.5 text-xs text-cyan-400 font-mono font-bold">
                                            {selectedToken}
                                        </span>
                                    </div>
                                    <p className="text-[10px] text-gray-400 font-medium leading-relaxed">
                                        2.5% protocol lock fee is automatically deducted from payouts and routed dynamically to: <b className="text-white">{PROTOCOL_TREASURY.substring(0,8)}...</b>
                                    </p>
                                </div>

                                {!creatorLocked ? (
                                    <button 
                                        onClick={handleGenerateInvite}
                                        disabled={!walletAddress}
                                        className={`w-full cyber-font py-3.5 rounded font-black text-xs uppercase tracking-wider transition-all ${
                                            walletAddress 
                                            ? "bg-cyan-500 text-slate-950 hover:bg-cyan-400 shadow-[0_0_15px_rgba(6,182,212,0.3)] hover:scale-[1.02]" 
                                            : "bg-slate-800 text-gray-500 cursor-not-allowed"
                                        }`}
                                    >
                                        GENERATE PROTOCOL LOCK LINK
                                    </button>
                                ) : (
                                    <div className="space-y-4">
                                        <div className="p-3 rounded border border-cyan-500/30 bg-cyan-950/20">
                                            <span className="text-cyan-400 text-[10px] font-mono uppercase tracking-widest block font-bold mb-1">Invite URL Payload Active:</span>
                                            <div className="flex items-center space-x-2 bg-slate-950 p-2 rounded border border-cyan-500/10 overflow-hidden">
                                                <input 
                                                    type="text" 
                                                    readOnly 
                                                    value={inviteUrl}
                                                    className="bg-transparent border-none text-[11px] text-gray-300 font-mono focus:outline-none flex-1 truncate"
                                                />
                                                <button 
                                                    onClick={() => {
                                                        navigator.clipboard.writeText(inviteUrl);
                                                        logToTerminal("Target Invite link copied to clipboard payload.", "SYSTEM");
                                                    }}
                                                    className="p-1 hover:bg-cyan-900/40 rounded transition-colors"
                                                >
                                                    <Icons.Share />
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {activeMatchState !== "IDLE" && (
                            <div className="mt-5 pt-5 border-t border-cyan-500/10 flex items-center justify-between">
                                <button 
                                    onClick={handleReset}
                                    className="text-xs text-rose-500 hover:text-rose-400 font-mono font-bold flex items-center space-x-1.5"
                                >
                                    <Icons.Refresh />
                                    <span>RECYCLE ESCROW SESSION</span>
                                </button>
                            </div>
                        )}

                    </div>

                    {/* Ledger status representation panel */}
                    <div className="bg-slate-950/80 border border-cyan-500/20 rounded p-6 backdrop-blur-md shadow-lg">
                        <h3 className="cyber-font font-black text-xs tracking-widest text-cyan-400 uppercase pb-3 border-b border-cyan-500/10 mb-4 flex items-center space-x-2">
                            <Icons.Shield />
                            <span>AETHERIS LEDGER METRICS</span>
                        </h3>
                        <div className="space-y-3 font-mono text-xs">
                            <div className="flex justify-between">
                                <span className="text-gray-400">Total Locked Escrows:</span>
                                <span className="text-white font-bold">14,295,401 USD</span>
                            </div>
                            <div className="flex justify-between">
                                <span className="text-gray-400">Settled Disputes:</span>
                                <span className="text-emerald-400 font-bold">99.94% Cleared</span>
                            </div>
                            <div className="flex justify-between">
                                <span className="text-gray-400">Active Oracle Nodes:</span>
                                <span className="text-cyan-400 font-bold">48 Virtual Streams</span>
                            </div>
                        </div>
                    </div>

                </section>

                {/* Column 2: LIVE TELEMETRY RADAR & MULTIPLAYER HUDS (Col Span 5) */}
                <section className="lg:col-span-5 space-y-6">
                    
                    {/* Visual representation of radar checking game systems */}
                    <div className="bg-slate-950/80 border border-cyan-500/20 rounded p-6 backdrop-blur-md shadow-lg flex flex-col items-center justify-center relative overflow-hidden">
                        <div className="absolute top-4 left-4 flex items-center space-x-2">
                            <span className="w-2.5 h-2.5 rounded-full bg-cyan-500 animate-ping" />
                            <span className="text-xs font-mono text-cyan-400 uppercase tracking-widest font-bold">AI ORACLE RADAR STATUS</span>
                        </div>

                        {/* Scanner scope */}
                        <div className="w-56 h-56 rounded-full border border-cyan-500/20 bg-slate-950 flex items-center justify-center relative mt-8 mb-4 shadow-[0_0_30px_rgba(6,182,212,0.05)]">
                            {/* Injected radar animation vectors */}
                            <div className="absolute inset-2 rounded-full border border-cyan-500/10" />
                            <div className="absolute inset-8 rounded-full border border-cyan-500/10" />
                            <div className="absolute inset-16 rounded-full border border-cyan-500/10" />
                            <div className="absolute inset-24 rounded-full border border-cyan-500/10" />
                            
                            {/* Horizontal and vertical coordinate axes */}
                            <div className="absolute w-full h-[1px] bg-cyan-500/10" />
                            <div className="absolute h-full w-[1px] bg-cyan-500/10" />
                            
                            {/* Glowing radar scan sweep */}
                            <div className="absolute inset-0 rounded-full bg-gradient-to-tr from-cyan-500/20 to-transparent origin-center animate-[spin_5s_linear_infinite] pointer-events-none" />

                            {/* Signal blip animations representing active telemetry variables */}
                            {activeMatchState === "ACTIVE" && (
                                <>
                                    <div className="absolute w-3.5 h-3.5 rounded-full bg-cyan-400/80 border border-white animate-ping" style={{ top: '30%', left: '70%' }} />
                                    <div className="absolute w-2 h-2 rounded-full bg-emerald-400 shadow-[0_0_10px_rgba(16,185,129,0.8)]" style={{ top: '65%', left: '40%' }} />
                                    <div className="absolute w-1.5 h-1.5 rounded-full bg-rose-500 shadow-[0_0_10px_rgba(244,63,94,0.8)] animate-pulse" style={{ top: '45%', left: '20%' }} />
                                </>
                            )}
                        </div>

                        {/* Visual digital diagnostics readout under radar */}
                        <div className="w-full grid grid-cols-3 gap-4 text-center mt-2 border-t border-cyan-500/10 pt-4 font-mono text-xs">
                            <div>
                                <span className="text-gray-400 block text-[9px] uppercase tracking-wider font-bold">CLIENT ping</span>
                                <span className="text-cyan-400 text-sm font-bold">
                                    {activeMatchState === "ACTIVE" ? `${telemetryPing} MS` : "OFFLINE"}
                                </span>
                            </div>
                            <div>
                                <span className="text-gray-400 block text-[9px] uppercase tracking-wider font-bold">Ref Confidence</span>
                                <span className="text-emerald-400 text-sm font-bold">
                                    {activeMatchState === "ACTIVE" ? `${antiCheatConfidence}%` : "100.00%"}
                                </span>
                            </div>
                            <div>
                                <span className="text-gray-400 block text-[9px] uppercase tracking-wider font-bold">DATA APU RATE</span>
                                <span className="text-cyan-400 text-sm font-bold">
                                    {activeMatchState === "ACTIVE" ? `${telemetryAps}/SEC` : "STANDBY"}
                                </span>
                            </div>
                        </div>
                    </div>

                    {/* Dual player diagnostic HUD displays */}
                    <div className="grid grid-cols-2 gap-4">
                        
                        {/* Player 1 HUD Card */}
                        <div className={`p-4 rounded border backdrop-blur-md transition-all ${
                            player1Ready 
                            ? "border-cyan-500/40 bg-cyan-950/10 shadow-[0_0_10px_rgba(6,182,212,0.1)]" 
                            : "border-gray-800 bg-slate-950/50"
                        }`}>
                            <div className="flex items-center justify-between mb-2">
                                <span className="text-[10px] text-cyan-400 font-mono tracking-widest block font-bold">PLAYER 1 NODE</span>
                                <span className={`text-[9px] px-1.5 py-0.5 rounded font-mono font-bold ${
                                    player1Ready ? "bg-cyan-900/40 text-cyan-400" : "bg-gray-800 text-gray-500"
                                }`}>
                                    {player1Ready ? "ESCROW_LOCKED" : "UNRESOLVED"}
                                </span>
                            </div>
                            <p className="text-xs text-white font-mono truncate">
                                {player1Address ? player1Address : "Awaiting alignment..."}
                            </p>
                        </div>

                        {/* Player 2 HUD Card */}
                        <div className={`p-4 rounded border backdrop-blur-md transition-all ${
                            player2Ready 
                            ? "border-emerald-500/40 bg-emerald-950/10 shadow-[0_0_10px_rgba(16,185,129,0.1)]" 
                            : "border-gray-800 bg-slate-950/50"
                        }`}>
                            <div className="flex items-center justify-between mb-2">
                                <span className="text-[10px] text-emerald-400 font-mono tracking-widest block font-bold">PLAYER 2 NODE</span>
                                <span className={`text-[9px] px-1.5 py-0.5 rounded font-mono font-bold ${
                                    player2Ready ? "bg-emerald-900/40 text-emerald-400" : "bg-gray-800 text-gray-500"
                                }`}>
                                    {player2Ready ? "ESCROW_LOCKED" : "UNRESOLVED"}
                                </span>
                            </div>
                            <p className="text-xs text-white font-mono truncate">
                                {player2Address ? player2Address : "Awaiting alignment..."}
                            </p>
                        </div>

                    </div>

                    {/* Operational Match Control Deck interface */}
                    {activeMatchState === "ACTIVE" && (
                        <div className="bg-slate-950/80 border border-cyan-500/20 rounded p-6 backdrop-blur-md shadow-lg text-center space-y-4">
                            <h3 className="cyber-font font-black text-xs text-cyan-400 tracking-wider uppercase">
                                MATCH CONTROL CONSOLE
                            </h3>
                            <p className="text-xs text-gray-400 font-medium">
                                AI Referee actively tracking telemetry logs. Simulate winner variable below to execute payouts.
                            </p>
                            <div className="grid grid-cols-2 gap-3.5 pt-2">
                                <button 
                                    onClick={() => runCheatScannerAndSettle(1)}
                                    className="py-2 rounded border border-cyan-500/30 bg-cyan-950/40 text-cyan-400 hover:bg-cyan-900/60 font-bold text-xs font-mono"
                                >
                                    DECLARE P1 WINNER
                                </button>
                                <button 
                                    onClick={() => runCheatScannerAndSettle(2)}
                                    className="py-2 rounded border border-emerald-500/30 bg-emerald-950/40 text-emerald-400 hover:bg-emerald-900/60 font-bold text-xs font-mono"
                                >
                                    DECLARE P2 WINNER
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Settle and route jackpot payload block */}
                    {activeMatchState === "WINNER_DECIDED" && (
                        <div className="bg-slate-950/90 border-2 border-emerald-500/50 rounded p-6 backdrop-blur-md shadow-2xl space-y-4 text-center">
                            <div className="w-12 h-12 rounded-full border border-emerald-500/40 flex items-center justify-center bg-emerald-950/40 mx-auto">
                                <Icons.Lock />
                            </div>
                            <div className="space-y-1">
                                <h3 className="cyber-font font-black text-sm tracking-wider text-emerald-400 uppercase">
                                    ORACLE WINNER COMPILING VERIFIED
                                </h3>
                                <p className="text-xs text-white font-mono truncate max-w-sm mx-auto">
                                    Winner Node Target: {winnerAddress}
                                </p>
                            </div>
                            <button 
                                onClick={handleFinalizePayout}
                                className="w-full py-3.5 rounded bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-xs uppercase tracking-wider transition-all shadow-[0_0_20px_rgba(16,185,129,0.3)]"
                            >
                                EXECUTE PRIZE PAYOUT & DISBURSE FEES
                            </button>
                        </div>
                    )}

                </section>

                {/* Column 3: NEURAL STREAM CONSOLE TERMINAL (Col Span 3) */}
                <section className="lg:col-span-3 space-y-6">
                    
                    <div className="bg-slate-950/90 border border-cyan-500/20 rounded p-4 h-[450px] flex flex-col justify-between backdrop-blur-md shadow-lg relative">
                        <div className="absolute top-0 left-0 right-0 h-10 border-b border-cyan-500/10 flex items-center px-4 bg-slate-950/60 justify-between">
                            <span className="cyber-font font-black text-[10px] tracking-widest text-cyan-400 uppercase flex items-center space-x-2">
                                <Icons.Terminal />
                                <span>NEURAL EVENT STREAM</span>
                            </span>
                            <span className="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-pulse" />
                        </div>

                        {/* Messages terminal display loop */}
                        <div className="flex-1 overflow-y-auto mt-8 pt-2 space-y-3 terminal-scroll pr-1">
                            {terminalLogs.map((log) => (
                                <div key={log.id} className="font-mono text-[11px] leading-relaxed border-b border-cyan-500/5 pb-2">
                                    <div className="flex justify-between items-center text-[9px] text-gray-500 mb-0.5">
                                        <span>[TIME: {log.time}]</span>
                                    </div>
                                    <p className={`${log.color}`}>
                                        {log.text}
                                    </p>
                                </div>
                            ))}
                            <div ref={terminalEndRef} />
                        </div>

                        <div className="pt-2 border-t border-cyan-500/10 mt-2 text-center">
                            <p className="text-[9px] text-gray-400 uppercase tracking-widest font-mono">
                                AETHERIS ORACLE PROTOCOLS DISPATCHING SECURELY
                            </p>
                        </div>
                    </div>

                    {/* Platform warnings info box */}
                    <div className="p-4 rounded border border-cyan-500/20 bg-slate-950/80">
                        <h4 className="font-bold text-xs text-cyan-400 mb-1 flex items-center space-x-1.5">
                            <Icons.Shield />
                            <span>PROTOCOL SECURED</span>
                        </h4>
                        <p className="text-[11px] text-gray-400 leading-relaxed font-semibold">
                            Escrows utilize EVM network triggers to guarantee secure funds. Payout is only made once dynamic inputs and referee vectors resolve to zero hacks.
                        </p>
                    </div>

                </section>

            </main>

            {/* Custom Cyber Footer bar */}
            <footer className="border-t border-cyan-500/10 bg-slate-950/80 backdrop-blur-md py-6 mt-auto relative z-20">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row items-center justify-between text-xs text-gray-400">
                    <p className="font-mono">
                        © {new Date().getFullYear()} AETHERIS ESCROW PROTOCOL. ZERO RECOURSES LOGGED. COMPLIES WITH STANDARD DECISION ALGORITHMS.
                    </p>
                    <div className="flex items-center space-x-4 mt-2 md:mt-0 font-mono text-[11px]">
                        <span className="text-cyan-400">AETHERIS STABLE: V8.2</span>
                        <span className="text-gray-600">|</span>
                        <span>TREASURY ADDRESS DIRECTED</span>
                    </div>
                </div>
            </footer>
        </div>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
