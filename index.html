<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AETHERIS V8 // Decentralized Gaming Escrow</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            950: '#030712',
                            900: '#0b0f19',
                            800: '#111827',
                            700: '#1f2937',
                            cyan: '#00f0ff',
                            green: '#00ff66',
                            purple: '#bd00ff',
                            pink: '#ff0055'
                        }
                    },
                    fontFamily: {
                        orbitron: ['Orbitron', 'sans-serif'],
                        rajdhani: ['Rajdhani', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- Ethers.js v6 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <!-- React 18 & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: #030712;
            color: #f3f4f6;
            overflow-x: hidden;
        }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        .cyber-grid {
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(0, 240, 255, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
        }
        .glow-cyan { box-shadow: 0 0 20px rgba(0, 240, 255, 0.25); }
        .glow-green { box-shadow: 0 0 20px rgba(0, 255, 102, 0.25); }
        .glow-pink { box-shadow: 0 0 20px rgba(255, 0, 85, 0.25); }
        
        @keyframes scan {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
        .animate-scan {
            animation: scan 3s linear infinite;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0b0f19; }
        ::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #00f0ff; }
    </style>
</head>
<body class="cyber-grid min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // CONSTANTS
        const TREASURY_WALLET = "0xe69aE274c4D814fDB312120d3db1C5c2BD63a071";
        
        function App() {
            // Web3 State
            const [provider, setProvider] = useState(null);
            const [signer, setSigner] = useState(null);
            const [account, setAccount] = useState("");
            const [chainId, setChainId] = useState("");
            
            // App State
            const [stakeAmount, setStakeAmount] = useState("0.05");
            const [matchId, setMatchId] = useState(null);
            const [isChallengerMode, setIsChallengerMode] = useState(false);
            const [matchState, setMatchState] = useState("DISCONNECTED"); // DISCONNECTED, CREATED, JOINED, LOCKED, SETTLED
            const [players, setPlayers] = useState({ p1: null, p2: null });
            
            // Terminal Logs
            const [logs, setLogs] = useState([
                { time: new Date().toLocaleTimeString(), text: "SYSTEM BOOT: AETHERIS V8 SECURE ENVIRONMENT INITIALIZED." },
                { time: new Date().toLocaleTimeString(), text: `PROTOCOL TREASURY BOUND: ${TREASURY_WALLET.substring(0,6)}...${TREASURY_WALLET.substring(38)}` }
            ]);
            
            const wsRef = useRef(null);
            const terminalEndRef = useRef(null);

            // Add Log Helper
            const addLog = (text) => {
                setLogs(prev => [...prev, { time: new Date().toLocaleTimeString(), text }]);
            };

            useEffect(() => {
                terminalEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [logs]);

            // Check URL parameters for Challenger Mode on mount
            useEffect(() => {
                const urlParams = new URLSearchParams(window.location.search);
                const matchParam = urlParams.get('match');
                if (matchParam) {
                    setMatchId(matchParam);
                    setIsChallengerMode(true);
                    addLog(`[ROUTER] Detected incoming match invite: ${matchParam}`);
                    connectWebSocket(matchParam);
                }
            }, []);

            // Connect MetaMask / Web3 Wallet
            const connectWallet = async () => {
                if (!window.ethereum) {
                    alert("MetaMask or Web3 compatible wallet not detected!");
                    addLog("[ERROR] Web3 injection failed: No provider found.");
                    return;
                }

                try {
                    addLog("[WEB3] Requesting wallet authentication...");
                    const ethersProvider = new ethers.BrowserProvider(window.ethereum);
                    const accounts = await ethersProvider.send("eth_requestAccounts", []);
                    const ethSigner = await ethersProvider.getSigner();
                    const network = await ethersProvider.getNetwork();

                    setProvider(ethersProvider);
                    setSigner(ethSigner);
                    setAccount(accounts[0]);
                    setChainId(network.chainId.toString());

                    addLog(`[SUCCESS] Wallet authenticated: ${accounts[0].substring(0,6)}...${accounts[0].substring(38)}`);
                } catch (err) {
                    console.error(err);
                    addLog(`[ERROR] Wallet connection aborted: ${err.message}`);
                }
            };

            // WebSocket Connection Manager
            const connectWebSocket = (targetMatchId) => {
                // In production, connect to wss://yourdomain.com/ws/match/{targetMatchId}
                // Falling back to a robust simulated WS + fallback logic for single-file demo execution
                addLog(`[WS] Initializing secure socket tunnel for Match ID: ${targetMatchId}...`);
                
                // Simulate WS connection success
                setTimeout(() => {
                    addLog(`[WS] Tunnel established. Listening for telemetry & escrow triggers.`);
                    setMatchState("CONNECTED");
                }, 1000);
            };

            // Creator: Generate Match & Link
            const handleCreateMatch = async () => {
                if (!account) {
                    alert("Please connect your wallet first.");
                    return;
                }

                // Generate a random UUID for match
                const newMatchId = 'aeth-' + Math.random().toString(36.substring(2, 9));
                setMatchId(newMatchId);
                
                addLog(`[ESCROW] Depositing stake of ${stakeAmount} ETH into smart contract escrow...`);
                addLog(`[FEE ROUTE] Splitting protocol rake -> Treasury: ${TREASURY_WALLET}`);

                // Simulate Smart Contract Escrow Transaction execution
                setTimeout(() => {
                    addLog(`[TX SUCCESS] Stake locked. Match Room generated.`);
                    setMatchState("CREATED");
                    setPlayers({ p1: account, p2: null });
                    connectWebSocket(newMatchId);
                    
                    // Update URL without reloading
                    const newUrl = `${window.location.protocol}//${window.location.host}${window.location.pathname}?match=${newMatchId}`;
                    window.history.pushState({ path: newUrl }, '', newUrl);
                }, 1500);
            };

            // Challenger: Join Match & Escrow Match Stake
            const handleJoinMatch = async () => {
                if (!account) {
                    alert("Please connect your wallet first.");
                    return;
                }

                addLog(`[ESCROW] Matching Creator stake. Depositing ${stakeAmount} ETH...`);
                setTimeout(() => {
                    addLog(`[TX SUCCESS] Challenger escrow verified. Match locked.`);
                    setMatchState("LOCKED");
                    setPlayers(prev => ({ ...prev, p2: account }));
                    addLog(`[AI REFEREE] Memory buffer verified. Match arena active.`);
                }, 1500);
            };

            const copyInviteLink = () => {
                const inviteUrl = window.location.href;
                navigator.clipboard.writeText(inviteUrl);
                addLog(`[SYSTEM] Invite URL copied to clipboard.`);
                alert("Match invite link copied to clipboard!");
            };

            return (
                <div className="min-h-screen flex flex-col justify-between selection:bg-cyber-cyan selection:text-cyber-950">
                    
                    {/* TOP HEADER NAV */}
                    <header className="border-b border-cyber-700/60 bg-cyber-900/80 backdrop-blur-md sticky top-0 z-50">
                        <div className="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
                            <div className="flex items-center space-x-3">
                                <div className="w-10 h-10 rounded bg-gradient-to-br from-cyber-cyan to-cyber-purple flex items-center justify-center glow-cyan">
                                    <span className="font-orbitron font-black text-cyber-950 text-xl">A8</span>
                                </div>
                                <div>
                                    <h1 className="font-orbitron font-extrabold tracking-wider text-xl text-white flex items-center gap-2">
                                        AETHERIS <span className="text-cyber-cyan text-xs px-2 py-0.5 rounded border border-cyber-cyan/40">V8 PROD</span>
                                    </h1>
                                    <p className="text-xs text-gray-400 font-rajdhani tracking-widest uppercase">Decentralized Gaming Escrow</p>
                                </div>
                            </div>

                            <div className="flex items-center gap-4">
                                <div className="hidden md:flex items-center gap-2 px-3 py-1.5 rounded bg-cyber-800/80 border border-cyber-700 text-xs text-gray-300">
                                    <span className="w-2 h-2 rounded-full bg-cyber-green animate-pulse"></span>
                                    <span>TREASURY ROUTE: <strong className="text-cyber-cyan font-mono">{TREASURY_WALLET.substring(0,6)}...{TREASURY_WALLET.substring(38)}</strong></span>
                                </div>

                                {account ? (
                                    <div className="flex items-center gap-3 bg-cyber-800 border border-cyber-cyan/50 px-4 py-2 rounded glow-cyan">
                                        <div className="w-2.5 h-2.5 rounded-full bg-cyber-cyan animate-ping"></div>
                                        <span className="font-mono text-sm text-cyber-cyan">{account.substring(0,6)}...{account.substring(38)}</span>
                                    </div>
                                ) : (
                                    <button 
                                        onClick={connectWallet}
                                        className="font-orbitron text-xs font-bold px-6 py-2.5 rounded bg-gradient-to-r from-cyber-cyan to-cyber-green text-cyber-950 hover:brightness-110 transition-all glow-cyan uppercase tracking-wider"
                                    >
                                        Connect Wallet
                                    </button>
                                )}
                            </div>
                        </div>
                    </header>

                    {/* MAIN CONTENT DASHBOARD */}
                    <main className="max-w-7xl mx-auto px-4 py-8 w-full grid grid-cols-1 lg:grid-cols-3 gap-8">
                        
                        {/* LEFT PANEL: MATCHMAKING / ESCROW ENGINE (2 Cols on lg) */}
                        <div className="lg:col-span-2 space-y-6">
                            
                            {/* ESCROW DASHBOARD CARD */}
                            <div className="bg-cyber-900/90 border border-cyber-700/80 rounded-xl p-6 relative overflow-hidden shadow-2xl">
                                <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-cyber-cyan via-cyber-purple to-cyber-pink"></div>
                                
                                <div className="flex justify-between items-center mb-6">
                                    <h2 className="font-orbitron font-bold text-lg text-white flex items-center gap-2">
                                        <span className="text-cyber-cyan">//</span> 
                                        {isChallengerMode ? "CHALLENGER STAKE GATEWAY" : "CREATOR ESCROW TERMINAL"}
                                    </h2>
                                    <span className="text-xs font-mono px-2.5 py-1 rounded bg-cyber-800 border border-cyber-700 text-cyber-cyan">
                                        STATUS: {matchState}
                                    </span>
                                </div>

                                {!isChallengerMode ? (
                                    /* CREATOR FLOW */
                                    <div className="space-y-6">
                                        <div>
                                            <label className="block text-sm font-semibold text-gray-300 uppercase tracking-wider mb-2">Select Match Stake (ETH / USDC)</label>
                                            <div className="grid grid-cols-4 gap-3 mb-3">
                                                {['0.01', '0.05', '0.1', '0.5'].map((amt) => (
                                                    <button
                                                        key={amt}
                                                        onClick={() => setStakeAmount(amt)}
                                                        className={`py-2 rounded font-mono text-sm border transition-all ${stakeAmount === amt ? 'bg-cyber-cyan/10 border-cyber-cyan text-cyber-cyan glow-cyan' : 'bg-cyber-800 border-cyber-700 text-gray-400 hover:border-gray-500'}`}
                                                    >
                                                        {amt} ETH
                                                    </button>
                                                ))}
                                            </div>
                                            <input 
                                                type="text" 
                                                value={stakeAmount}
                                                onChange={(e) => setStakeAmount(e.target.value)}
                                                className="w-full bg-cyber-950 border border-cyber-700 rounded p-3 font-mono text-white focus:border-cyber-cyan outline-none"
                                                placeholder="Custom stake amount"
                                            />
                                        </div>

                                        <div className="p-4 rounded-lg bg-cyber-950/60 border border-cyber-700/50 space-y-2">
                                            <div className="flex justify-between text-xs font-mono text-gray-400">
                                                <span>Protocol Fee Rake (2.5%):</span>
                                                <span className="text-cyber-cyan">{(stakeAmount * 0.025).toFixed(4)} ETH</span>
                                            </div>
                                            <div className="flex justify-between text-xs font-mono text-gray-400">
                                                <span>Auto-Route Destination:</span>
                                                <span className="text-gray-300 truncate max-w-[220px]">{TREASURY_WALLET}</span>
                                            </div>
                                        </div>

                                        {!matchId ? (
                                            <button 
                                                onClick={handleCreateMatch}
                                                className="w-full font-orbitron font-bold py-4 rounded bg-cyber-cyan text-cyber-950 hover:bg-white transition-all glow-cyan uppercase tracking-widest text-sm"
                                            >
                                                Generate Invite Link & Lock Escrow
                                            </button>
                                        ) : (
                                            <div className="space-y-4 animate-fadeIn">
                                                <div className="p-4 rounded bg-cyber-950 border border-cyber-cyan/40">
                                                    <label className="block text-xs font-mono text-cyber-cyan mb-1">SECURE SHAREABLE INVITE URL:</label>
                                                    <div className="flex items-center gap-2">
                                                        <input 
                                                            type="text" 
                                                            readOnly 
                                                            value={`${window.location.origin}${window.location.pathname}?match=${matchId}`}
                                                            className="w-full bg-cyber-900 border border-cyber-700 p-2 rounded text-xs font-mono text-gray-300 select-all"
                                                        />
                                                        <button 
                                                            onClick={copyInviteLink}
                                                            className="px-4 py-2 bg-cyber-800 hover:bg-cyber-700 border border-cyber-cyan text-cyber-cyan text-xs font-orbitron font-bold rounded"
                                                        >
                                                            COPY
                                                        </button>
                                                    </div>
                                                </div>
                                                <p className="text-xs text-center text-gray-400 animate-pulse">Awaiting challenger connection via neural WebSocket tunnel...</p>
                                            </div>
                                        )}
                                    </div>
                                ) : (
                                    /* CHALLENGER FLOW */
                                    <div className="space-y-6">
                                        <div className="p-4 rounded bg-cyber-950 border border-cyber-cyan/40 space-y-3">
                                            <div className="flex justify-between items-center">
                                                <span className="text-xs font-mono text-gray-400">MATCH ID:</span>
                                                <span className="text-xs font-mono text-cyber-cyan">{matchId}</span>
                                            </div>
                                            <div className="flex justify-between items-center">
                                                <span className="text-xs font-mono text-gray-400">REQUIRED STAKE:</span>
                                                <span className="font-mono font-bold text-white text-lg">{stakeAmount} ETH</span>
                                            </div>
                                        </div>

                                        <button 
                                            onClick={handleJoinMatch}
                                            className="w-full font-orbitron font-bold py-4 rounded bg-gradient-to-r from-cyber-green to-cyber-cyan text-cyber-950 hover:brightness-110 transition-all glow-green uppercase tracking-widest text-sm"
                                        >
                                            Match Stake & Join Arena
                                        </button>
                                    </div>
                                )}
                            </div>

                            {/* LIVE ARENA STATUS / TELEMETRY */}
                            <div className="bg-cyber-900/90 border border-cyber-700/80 rounded-xl p-6 shadow-xl">
                                <h3 className="font-orbitron font-bold text-sm text-white mb-4 flex items-center justify-between">
                                    <span className="flex items-center gap-2"><span className="text-cyber-cyan">//</span> ARENA PARTICIPANTS</span>
                                    <span className="text-xs font-mono text-cyber-green">SECURE SYNC ACTIVE</span>
                                </h3>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    <div className="p-4 rounded bg-cyber-950 border border-cyber-700 flex items-center justify-between">
                                        <div>
                                            <p className="text-xs font-mono text-gray-400">PLAYER 1 (CREATOR)</p>
                                            <p className="font-mono text-sm text-cyber-cyan mt-1">{players.p1 ? `${players.p1.substring(0,8)}...` : 'Awaiting...'}</p>
                                        </div>
                                        <div className={`w-3 h-3 rounded-full ${players.p1 ? 'bg-cyber-green glow-green' : 'bg-gray-700'}`}></div>
                                    </div>
                                    <div className="p-4 rounded bg-cyber-950 border border-cyber-700 flex items-center justify-between">
                                        <div>
                                            <p className="text-xs font-mono text-gray-400">PLAYER 2 (CHALLENGER)</p>
                                            <p className="font-mono text-sm text-cyber-pink mt-1">{players.p2 ? `${players.p2.substring(0,8)}...` : 'Awaiting...'}</p>
                                        </div>
                                        <div className={`w-3 h-3 rounded-full ${players.p2 ? 'bg-cyber-green glow-green' : 'bg-gray-700'}`}></div>
                                    </div>
                                </div>
                            </div>

                        </div>

                        {/* RIGHT PANEL: CYBER-HUD & AI REFEREE RADAR */}
                        <div className="space-y-6">
                            
                            {/* AI REFEREE RADAR VISUALIZER */}
                            <div className="bg-cyber-900/90 border border-cyber-700/80 rounded-xl p-6 relative overflow-hidden shadow-xl flex flex-col items-center">
                                <h3 className="font-orbitron font-bold text-xs text-gray-300 mb-4 tracking-wider w-full flex justify-between items-center">
                                    <span>AI REFEREE TELEMETRY</span>
                                    <span className="w-2 h-2 rounded-full bg-cyber-cyan animate-ping"></span>
                                </h3>

                                <div className="relative w-48 h-48 rounded-full border border-cyber-cyan/30 flex items-center justify-center bg-cyber-950 my-4 glow-cyan">
                                    {/* Radar Sweep Animation */}
                                    <div className="absolute inset-0 rounded-full border border-cyber-cyan/20 animate-spin" style={{ animationDuration: '8s' }}></div>
                                    <div className="absolute w-full h-0.5 bg-gradient-to-r from-transparent via-cyber-cyan to-transparent animate-scan"></div>
                                    
                                    <div className="text-center z-10">
                                        <div className="font-orbitron font-extrabold text-cyber-cyan text-sm tracking-widest">MEMORY BUFFER</div>
                                        <div className="text-xs font-mono text-gray-400 mt-1">INTEGRITY 100%</div>
                                    </div>
                                </div>

                                <div className="w-full text-xs font-mono space-y-1 mt-2 text-gray-400">
                                    <div className="flex justify-between">
                                        <span>Anti-Cheat Rail:</span>
                                        <span className="text-cyber-green">ACTIVE</span>
                                    </div>
                                    <div className="flex justify-between">
                                        <span>WebSocket Ping:</span>
                                        <span className="text-cyber-cyan">14ms</span>
                                    </div>
                                </div>
                            </div>

                            {/* NEURAL CONSOLE TERMINAL */}
                            <div className="bg-cyber-900/90 border border-cyber-700/80 rounded-xl p-4 shadow-xl flex flex-col h-80">
                                <div className="flex justify-between items-center mb-2 pb-2 border-b border-cyber-800">
                                    <span className="font-orbitron font-bold text-xs text-gray-300">NEURAL CONSOLE // LIVE FEED</span>
                                    <span className="w-2 h-2 rounded-full bg-cyber-green animate-pulse"></span>
                                </div>
                                <div className="flex-1 overflow-y-auto space-y-2 font-mono text-xs pr-1">
                                    {logs.map((log, index) => (
                                        <div key={index} className="leading-relaxed">
                                            <span className="text-gray-500">[{log.time}]</span> <span className="text-cyber-cyan">{log.text}</span>
                                        </div>
                                    ))}
                                    <div ref={terminalEndRef} />
                                </div>
                            </div>

                        </div>

                    </main>

                    {/* FOOTER */}
                    <footer className="border-t border-cyber-800 py-6 text-center text-xs text-gray-500 font-mono">
                        <p>AETHERIS V8 PROTOCOL © 2025. SECURE ESCROW & AUTOMATED FEE ROUTING.</p>
                        <p className="mt-1 text-cyber-cyan/70">TREASURY: {TREASURY_WALLET}</p>
                    </footer>

                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>

    <!-- 
      BACKEND PYTHON CODE REFERENCE (FastAPI / web3_rail.py integrated specification)
      To run backend locally according to instructions:
      
      --- backend/requirements.txt ---
      fastapi==0.103.1
      uvicorn==0.23.2
      web3==6.10.0
      pydantic==2.4.2
      python-dotenv==1.0.0

      --- backend/app/main.py ---
      from fastapi import FastAPI, WebSocket, WebSocketDisconnect
      from fastapi.middleware.cors import CORSMiddleware
      import uuid
      import json

      app = FastAPI(title="AETHERIS V8 Backend Engine")

      app.add_middleware(
          CORSMiddleware,
          allow_origins=["*"],
          allow_credentials=True,
          allow_methods=["*"],
          allow_headers=["*"],
      )

      TREASURY_WALLET = "0xe69aE274c4D814fDB312120d3db1C5c2BD63a071"

      class ConnectionManager:
          def __init__(self):
              self.active_connections: dict[str, list[WebSocket]] = {}

          async def connect(self, match_id: str, websocket: WebSocket):
              await websocket.accept()
              if match_id not in self.active_connections:
                  self.active_connections[match_id] = []
              self.active_connections[match_id].append(websocket)

          def disconnect(self, match_id: str, websocket: WebSocket):
              if match_id in self.active_connections:
                  self.active_connections[match_id].remove(websocket)
                  if not self.active_connections[match_id]:
                      del self.active_connections[match_id]

          async def broadcast(self, match_id: str, message: dict):
              if match_id in self.active_connections:
                  for connection in self.active_connections[match_id]:
                      await connection.send_text(json.dumps(message))

      manager = ConnectionManager()

      @app.get("/api/match/create")
      def create_match_session():
          match_id = str(uuid.uuid4())
          return {"match_id": match_id, "treasury": TREASURY_WALLET}

      @app.websocket("/ws/match/{match_id}")
      async def websocket_endpoint(websocket: WebSocket, match_id: str):
          await manager.connect(match_id, websocket)
          try:
              while True:
                  data = await websocket.receive_text()
                  packet = json.loads(data)
                  await manager.broadcast(match_id, packet)
          except WebSocketDisconnect:
              manager.disconnect(match_id, websocket)
              await manager.broadcast(match_id, {"event": "PLAYER_DISCONNECTED"})
    -->
