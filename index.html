// Audio synthesis engine for immersive construction & Kenyan soundscapes
const playSound = function(type) {
    try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'click') {
            // High quality light metal tap (hammer on rebar)
            osc.frequency.setValueAtTime(1200, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.12);
            gain.gain.setValueAtTime(0.05, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
            osc.start();
            osc.stop(ctx.currentTime + 0.12);
        } else if (type === 'mpesa') {
            // Authentic Safaricom upbeat dual-chord chime
            const chord = [523.25, 659.25, 783.99, 1046.50]; // C Major scale harmonics
            chord.forEach((freq, idx) => {
                const o = ctx.createOscillator();
                const g = ctx.createGain();
                o.connect(g);
                g.connect(ctx.destination);
                o.type = 'sine';
                o.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.07);
                g.gain.setValueAtTime(0.04, ctx.currentTime + idx * 0.07);
                g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.07 + 0.35);
                o.start(ctx.currentTime + idx * 0.07);
                o.stop(ctx.currentTime + idx * 0.07 + 0.35);
            });
        } else if (type === 'horn') {
            // Dual-tone heavy highway truck horn
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(290, ctx.currentTime);
            gain.gain.setValueAtTime(0.03, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
            osc.start();
            osc.stop(ctx.currentTime + 0.3);

            const osc2 = ctx.createOscillator();
            const gain2 = ctx.createGain();
            osc2.connect(gain2);
            gain2.connect(ctx.destination);
            osc2.type = 'sawtooth';
            osc2.frequency.setValueAtTime(350, ctx.currentTime);
            gain2.gain.setValueAtTime(0.03, ctx.currentTime);
            gain2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
            osc2.start();
            osc2.stop(ctx.currentTime + 0.3);
        } else if (type === 'shovel') {
            // Gritty sliding sand shovel scrape
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(150, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(750, ctx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.03, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
            osc.start();
            osc.stop(ctx.currentTime + 0.2);
        }
    } catch (e) {
        // Safe bypass if user gestures are yet to activate audio context
    }
};

const injectStylesAndFonts = function() {
    if (document.getElementById('jenga-kazi-fonts')) return;
    const fontLink = document.createElement('link');
    fontLink.id = 'jenga-kazi-fonts';
    fontLink.href = 'https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap';
    fontLink.rel = 'stylesheet';
    document.head.appendChild(fontLink);

    const style = document.createElement('style');
    style.id = 'jenga-kazi-custom-css';
    style.innerHTML = `
        body {
            background-color: #060913;
            color: #f1f5f9;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-image: 
                radial-gradient(at 0% 0%, rgba(245, 158, 11, 0.05) 0px, transparent 50%),

    document.head.appendChild(style);
};

            const t = parseFloat(slabThickness) || 0;
            const vol = l * w * t; // in cubic meters
            // Concrete Class 25 ratio 1:1.5:3. Roughly 310kg cement per cubic meter
            const cementBags = Math.ceil(vol * 6.5);
            const sandTonnes = (vol * 0.45).toFixed(1);
            const ballastTonnes = (vol * 0.85).toFixed(1);
            const rawCost = (cementBags * 790) + (parseFloat(sandTonnes) * 3200) + (parseFloat(ballastTonnes) * 2800);
            return {
                vol: vol.toFixed(2),
                cement: cementBags,
                sand: sandTonnes,
                ballast: ballastTonnes,
                cost: Math.round(rawCost)
            };
        } else if (calcType === "wall") {
            const l = parseFloat(wallLength) || 0;
            const h = parseFloat(wallHeight) || 0;
            const area = l * h;
            // Assuming standard 9x4x6 Quarry Stone bricks. Roughly 45 blocks per sqm inclusive of joint gaps
            const stones = Math.ceil(area * 45);
            const cementBags = Math.ceil(area * 0.35);
            const sandTonnes = (area * 0.04).toFixed(1);
            const rawCost = (stones * 48) + (cementBags * 790) + (parseFloat(sandTonnes) * 3200);
            return {
                vol: area.toFixed(1),
                stones: stones,
                cement: cementBags,
                sand: sandTonnes,
                cost: Math.round(rawCost)
            };
        } else {
            const area = parseFloat(plasterArea) || 0;
            // Plaster thickness 15mm. 1:4 mix.
            const cementBags = Math.ceil(area * 0.22);
            const sandTonnes = (area * 0.022).toFixed(1);
            const rawCost = (cementBags * 790) + (parseFloat(sandTonnes) * 3200);
            return {
                vol: area.toFixed(1),
                cement: cementBags,
                sand: sandTonnes,
                cost: Math.round(rawCost)
            };
