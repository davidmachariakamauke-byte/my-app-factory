<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AETHERIS V8 | Decentralized Gaming Escrow & AI Referee</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            bg: '#030712',
                            card: '#0b0f19',
                            border: '#1e293b',
                            cyan: '#06b6d4',
                            green: '#10b981',
                            purple: '#8b5cf6',
                            danger: '#ef4444'
                        }
                    },
                    fontFamily: {
                        orbitron: ['Orbitron', 'sans-serif'],
                        rajdhani: ['Rajdhani', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    
    <!-- Ethers.js v6 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.1/ethers.umd.min.js"></script>

    <!-- React 18 & Babel CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: #030712;
            color: #f8fafc;
            overflow-x: hidden;
        }
        .font-cyber {
            font-family: 'Orbitron', sans-serif;
        }
        /* Custom Radar Sweep Animation */
        @keyframes radar-sweep {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .radar-sweep {
            animation: radar-sweep 4s linear infinite;
        }
        /* Glowing neon utilities */
        .neon-glow-cyan {
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.25);
        }
        .neon-glow-green {
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.25);
        }
        .neon-text-cyan {
            text-shadow: 0 0 10px rgba(6, 182, 212, 0.5);
        }
        /* Custom scrollbar for terminal */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #030712;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #06b6d4;
        }
    </style>
</head>
<body class="bg-cyber-bg min-h-screen text-slate-100 flex flex-col justify-between selection:bg-cyber-cyan selection:text-black">

    <!-- Root Application Mount -->
    <div id="root" class="flex-grow flex flex-col"></div>

    <!-- Embedded Backend Architecture Source Code Viewer Modal / Drawer or Footer -->
    <footer class="border-t border-cyber-border bg-cyber-card/80 backdrop-blur py-4 px-6 text-xs text-slate-400 font-mono flex flex-col md:flex-row justify-between items-center gap-4">
        <div class="flex items-center gap-2">
            <span class="inline-block w-2 h-2 rounded-full bg-cyber-green animate-pulse"></span>
            <span>AETHERIS PROTOCOL V8.4.2 [TREASURY: <strong class="text-cyber-cyan">0xe69aE...071</strong>]</span>
        </div>
        <div class="flex items-center gap-6">
            <span>FASTAPI WEBSOCKET ENGINE ACTIVE</span>
            <span class="text-cyber-purple">CHAIN: EVM POLYGON/ETH</span>
        </div>
    </footer>

    <!-- React Frontend & Simulation Engine -->
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // CONSTANTS
        const TREASURY_WALLET = "0xe69aE274c4D814fDB312120d3db1C5c2BD63a071";
        
        // Mock WebSocket Backend Simulator for Frontend-Only Single File distribution 
        // Emulates FastAPI /ws/match/{match_id} behavior
        class MockMatchWebSocket {
            constructor(matchId, onMessage) {
                this.matchId = matchId;
                this.onMessage = onMessage;
                this.isConnected = true;
                this.timer = null;
                this.initSimulation();
            }

            initSimulation() {
                // Simulate periodic telemetry or connection status updates
                setTimeout(() => {
                    this.onMessage({ type: "TELEMETRY_LIVE", payload: { status: "AI Memory Buffer Verified", latency: "14ms" } });
                }, 1000);
            }

            send(data) {
                const parsed = JSON.parse(data);
                // Echo back simulated events for multiplayer matchmaking demonstration
                setTimeout(() => {
                    if (parsed.action === "JOIN_ROOM") {
                        this.onMessage({ 
                            type: "ROOM_UPDATE", 
                            payload: { 
                                player2: parsed.wallet, 
                                status: "MATCH_READY",
                                message: "Challenger connected. Escrow contract locked." 
                            } 
                        });
                    } else if (parsed.action === "LOCK_ESCROW") {
                        this.onMessage({
                            type: "MATCH_READY",
                            payload: {
                                status: "LIVE",
                                message: "AI Referee monitoring match streams. 5% Protocol Fee routed to Treasury."
                            }
                        });
                    }
                }, 800);
            }

            close() {
                this.isConnected = false;
            }
        }

        function App() {
            // Web3 State
            const [account, setAccount] = useState(null);
            const [provider, setProvider] = useState(null);
            const [balance, setBalance] = useState("0.00");
            const [network, setNetwork] = useState("Not Connected");
            
            // Matchmaking & Navigation State
            const [matchId, setMatchId] = useState(null);
            const [isCreator, setIsCreator] = useState(true);
            const [stakeAmount, setStakeAmount] = useState("0.05");
            const [matchState, setMatchState] = useState("IDLE"); // IDLE, CREATED, WAITING, READY, IN_PROGRESS, SETTLED
            const [opponentAddress, setOpponentAddress] = useState(null);
            
            // Terminal & Telemetry Logs
            const [logs, setLogs] = useState([
                { time: new Date().toLocaleTimeString(), text: "System Initialized. AETHERIS V8 Neural Core online.", type: "sys" },
                { time: new Date().toLocaleTimeString(), text: `Protocol Fee Receiver locked: ${TREASURY_WALLET.substring(0,6)}...${TREASURY_WALLET.substring(38)}`, type: "info" }
            ]);
            
            const wsRef = useRef(null);
            const terminalEndRef = useRef(null);

            // Auto scroll terminal
            useEffect(() => {
                terminalEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [logs]);

            // Check URL parameters on load for Challenger mode (?match=UUID)
            useEffect(() => {
                const urlParams = new URLSearchParams(window.location.search);
                const queryMatch = urlParams.get('match');
                if (queryMatch) {
                    setMatchId(queryMatch);
                    setIsCreator(false);
                    setMatchState("WAITING_TO_JOIN");
                    addLog(`Detected incoming match invite: ${queryMatch}`, "info");
                }
            }, []);

            const addLog = (text, type = "info") => {
                setLogs(prev => [...prev, { time: new Date().toLocaleTimeString(), text, type }]);
            };

            // 1. Connect Web3 Wallet via Ethers.js v6
            const connectWallet = async () => {
                if (!window.ethereum) {
                    alert("MetaMask or Web3 compatible wallet not detected! Please install a browser wallet.");
                    addLog("Wallet connection failed: No Web3 provider found.", "danger");
                    return;
                }

                try {
                    addLog("Requesting wallet authentication...", "sys");
                    const ethersProvider = new ethers.BrowserProvider(window.ethereum);
                    const accounts = await ethersProvider.send("eth_requestAccounts", []);
                    const signer = await ethersProvider.getSigner();
                    const address = await signer.getAddress();
                    const net = await ethersProvider.getNetwork();
                    const balWei = await ethersProvider.getBalance(address);
                    const balEth = ethers.formatEther(balWei);

                    setProvider(ethersProvider);
                    setAccount(address);
                    setBalance(Number(balEth).toFixed(4));
                    setNetwork(net.name.toUpperCase());

                    addLog(`Wallet Connected successfully: ${address.substring(0, 6)}...${address.substring(38)}`, "success");
                    addLog(`Connected to network: ${net.name.toUpperCase()} | Balance: ${Number(balEth).toFixed(4)} ETH`, "info");
                } catch (err) {
                    console.error(err);
                    addLog(`Connection rejected or failed: ${err.message}`, "danger");
                }
            };

            // Initialize WebSocket Room when Match is created or joined
            useEffect(() => {
                if (matchId) {
                    // Initialize mock WebSocket matching FastAPI backend /ws/match/{match_id}
                    const ws = new MockMatchWebSocket(matchId, (msg) => {
                        if (msg.type === "TELEMETRY_LIVE") {
                            addLog(`AI Telemetry: ${msg.payload.status} (Latency: ${msg.payload.latency})`, "sys");
                        } else if (msg.type === "ROOM_UPDATE") {
                            setOpponentAddress(msg.payload.player2);
                            addLog(`Player 2 joined room! Address: ${msg.payload.player2.substring(0,6)}...`, "success");
                            setMatchState("READY");
                        } else if (msg.type === "MATCH_READY") {
                            addLog(msg.payload.message, "success");
                            setMatchState("IN_PROGRESS");
                        }
                    });
                    wsRef.current = ws;

                    return () => {
                        ws.close();
                    };
                }
            }, [matchId]);

            // 2. Creator Mode: Generate Invite Link
            const handleCreateMatch = () => {
                if (!account) {
                    alert("Please connect your Web3 wallet first.");
                    return;
                }
                const newMatchId = 'aether-' + Math.random().toString(36).substring(2, 9) + '-' + Date.now().toString(36);
                setMatchId(newMatchId);
                setMatchState("WAITING");
                
                // Update browser URL without reload
                const newUrl = `${window.location.protocol}//${window.location.host}${window.location.pathname}?match=${newMatchId}`;
                window.history.pushState({ path: newUrl }, '', newUrl);

                addLog(`Cryptographic match_id generated: ${newMatchId}`, "success");
                addLog(`Shareable URL compiled: ${newUrl}`, "info");
            };

            // 3. Challenger Mode: Match Stake & Join
            const handleJoinMatch = async () => {
                if (!account) {
                    alert("Please connect your Web3 wallet first.");
                    return;
                }

                addLog(`Initiating escrow deposit of ${stakeAmount} ETH...`, "sys");
                addLog(`Protocol fee routing initialized to Treasury: ${TREASURY_WALLET}`, "info");

                try {
                    // Simulate smart contract interaction or real tx if provider exists
                    if (provider) {
                        const signer = await provider.getSigner();
                        // Send small protocol fee/stake simulation or trigger transfer to treasury
                        // For safe UX demonstration without draining user mainnets without a deployed contract:
                        addLog("Smart Contract escrow call dispatched to EVM rail...", "sys");
                    }

                    setTimeout(() => {
                        addLog("Escrow deposit confirmed on-chain. Match locked.", "success");
                        setMatchState("IN_PROGRESS");
                        
                        if (wsRef.current) {
                            wsRef.current.send(JSON.stringify({
                                action: "JOIN_ROOM",
                                wallet: account,
                                match_id: matchId
                            }));
                        }
                    }, 1500);

                } catch (err) {
                    console.error(err);
                    addLog(`Escrow transaction failed: ${err.message}`, "danger");
                }
            };

            const copyShareUrl = () => {
                const url = window.location.href;
                navigator.clipboard.writeText(url);
                alert("Match invite URL copied to clipboard!");
                addLog("Match invite link copied to clipboard.", "info");
            };

            return (
                <div className="flex flex-col min-h-screen">
                    {/* Top Navigation Bar */}
                    <header className="border-b border-cyber-border bg-cyber-card/60 backdrop-blur-md sticky top-0 z-50 px-6 py-4 flex items-center justify-between">
                        <div className="flex items-center space-x-3">
                            <div className="w-10 h-10 rounded bg-gradient-to-br from-cyber-cyan to-cyber-purple flex items-center justify-center font-cyber font-black text-black text-xl neon-glow-cyan">
                                Λ
                            </div>
                            <div>
                                <h1 className="font-cyber font-extrabold text-lg tracking-wider text-white neon-text-cyan">AETHERIS <span className="text-cyber-cyan">V8</span></h1>
                                <p className="text-xs font-mono text-slate-400">DECENTRALIZED GAMING ESCROW</p>
                            </div>
                        </div>

                        {/* Wallet & Telemetry Badge */}
                        <div className="flex items-center gap-4">
                            {account ? (
                                <div className="hidden md:flex items-center gap-3 bg-cyber-bg border border-cyber-border px-4 py-2 rounded-lg text-xs font-mono">
                                    <span className="w-2 h-2 rounded-full bg-cyber-green animate-ping"></span>
                                    <div>
                                        <div className="text-slate-400">{network}</div>
                                        <div className="text-cyber-cyan font-bold">{balance} ETH</div>
                                    </div>
                                    <div className="border-l border-cyber-border pl-3 text-slate-300">
                                        {account.substring(0, 6)}...{account.substring(38)}
                                    </div>
                                </div>
                            ) : null}

                            <button 
                                onClick={connectWallet}
                                className="font-cyber text-xs uppercase tracking-widest px-6 py-3 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-black font-extrabold rounded-lg transition-all duration-300 neon-glow-cyan active:scale-95 cursor-pointer"
                            >
                                {account ? 'WALLET CONNECTED' : 'CONNECT WALLET'}
                            </button>
                        </div>
                    </header>

                    {/* Main Dashboard Grid */}
                    <main className="flex-grow container mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
                        
                        {/* Left Column: Cyber HUD & Live Radar Telemetry */}
                        <div className="lg:col-span-1 flex flex-col gap-6">
                            
                            {/* AI Referee Radar Panel */}
                            <div className="bg-cyber-card border border-cyber-border rounded-xl p-5 relative overflow-hidden">
                                <div className="absolute top-0 right-0 p-3 text-[10px] font-mono text-cyber-cyan uppercase tracking-wider bg-cyan-950/40 border-b border-l border-cyber-border rounded-bl-lg">
                                    AI Ref v8.2 Active
                                </div>
                                <h2 className="font-cyber text-sm font-bold text-slate-200 mb-4 flex items-center gap-2">
                                    <span className="w-2 h-2 rounded-full bg-cyber-cyan"></span>
                                    LIVE TELEMETRY & MEMORY BUFFER
                                </h2>
                                
                                <div className="flex flex-col items-center justify-center py-6 relative">
                                    {/* Radar Circle */}
                                    <div className="w-48 h-48 rounded-full border border-cyber-cyan/30 relative flex items-center justify-center bg-cyan-950/10">
                                        <div className="absolute w-36 h-36 rounded-full border border-cyber-cyan/20"></div>
                                        <div className="absolute w-24 h-24 rounded-full border border-cyber-cyan/10"></div>
                                        <div className="absolute w-full h-[1px] bg-cyber-cyan/20"></div>
                                        <div className="absolute h-full w-[1px] bg-cyber-cyan/20"></div>
                                        
                                        {/* Radar Sweep Line */}
                                        <div className="absolute w-24 h-24 top-1/2 left-1/2 origin-top-left radar-sweep pointer-events-none">
                                            <div className="w-24 h-24 bg-gradient-to-tr from-cyber-cyan/40 to-transparent rounded-tl-full"></div>
                                        </div>

                                        {/* Center pulse dot */}
                                        <div className="w-3 h-3 rounded-full bg-cyber-cyan animate-ping absolute"></div>
                                        <div className="w-2 h-2 rounded-full bg-cyber-cyan absolute"></div>
                                    </div>
                                    <div className="mt-4 text-center font-mono text-xs text-slate-400">
                                        MEMORY INTEGRITY: <span className="text-cyber-green font-bold">100% SECURE</span>
                                    </div>
                                </div>
                            </div>

                            {/* Protocol Fee Routing Box */}
                            <div className="bg-cyber-card border border-cyber-border rounded-xl p-5">
                                <h2 className="font-cyber text-xs font-bold text-slate-300 mb-3 flex items-center gap-2">
                                    <span className="text-cyber-purple">⚡</span> PROTOCOL FEE ROUTING
                                </h2>
                                <div className="bg-cyber-bg p-3 rounded border border-cyber-border font-mono text-[11px] break-all text-slate-400">
                                    <div className="text-slate-500 mb-1">// Treasury Receiver Address</div>
                                    <span className="text-cyber-cyan">{TREASURY_WALLET}</span>
                                </div>
                                <p className="text-[11px] text-slate-500 mt-2 font-mono">
                                    All matches automatically route a 5% protocol fee directly to the hardcoded treasury upon escrow settlement.
                                </p>
                            </div>
                        </div>

                        {/* Center & Right Column: Matchmaking Engine & Neural Console */}
                        <div className="lg:col-span-2 flex flex-col gap-6">
                            
                            {/* Matchmaking Control Center */}
                            <div className="bg-cyber-card border border-cyber-border rounded-xl p-6 relative">
                                <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-cyber-cyan via-cyber-purple to-cyber-green"></div>
                                
                                <div className="flex justify-between items-center mb-6">
                                    <h2 className="font-cyber text-lg font-bold text-white flex items-center gap-2">
                                        <span>🎮</span> COMPETITIVE ESCROW ARENA
                                    </h2>
                                    <span className="text-xs font-mono px-3 py-1 bg-slate-900 border border-cyber-border rounded text-cyber-cyan">
                                        MODE: {isCreator ? 'CREATOR' : 'CHALLENGER'}
                                    </span>
                                </div>

                                {/* CREATOR MODE UI */}
                                {isCreator && matchState === "IDLE" && (
                                    <div className="space-y-6">
                                        <div>
                                            <label className="block font-mono text-xs text-slate-400 mb-2">SET STAKE AMOUNT (ETH / USDC)</label>
                                            <div className="relative">
                                                <input 
                                                    type="number" 
                                                    value={stakeAmount} 
                                                    onChange={(e) => setStakeAmount(e.target.value)}
                                                    className="w-full bg-cyber-bg border border-cyber-border rounded-lg px-4 py-3 font-cyber text-lg text-white focus:outline-none focus:border-cyber-cyan"
                                                    placeholder="0.05" 
                                                />
                                                <div className="absolute right-4 top-3.5 font-mono text-xs text-cyber-cyan font-bold">ETH</div>
                                            </div>
                                        </div>

                                        <button 
                                            onClick={handleCreateMatch}
                                            className="w-full py-4 bg-cyber-cyan hover:bg-cyan-400 text-black font-cyber font-black tracking-wider uppercase rounded-lg transition-all shadow-lg neon-glow-cyan cursor-pointer"
                                        >
                                            GENERATE INVITE LINK & LOCK ESCROW
                                        </button>
                                    </div>
                                )}

                                {isCreator && matchState === "WAITING" && (
                                    <div className="space-y-6 text-center py-6">
                                        <div className="inline-block p-4 rounded-full bg-cyber-cyan/10 border border-cyber-cyan/30 text-cyber-cyan mb-2 animate-bounce">
                                            ⏳
                                        </div>
                                        <h3 className="font-cyber font-bold text-white text-lg">WAITING FOR CHALLENGER...</h3>
                                        <p className="text-sm font-mono text-slate-400 max-w-md mx-auto">
                                            Match Room <strong className="text-cyber-cyan">{matchId}</strong> initialized. Share your dynamic link below to challenge an opponent.
                                        </p>

                                        <div className="flex items-center gap-2 max-w-lg mx-auto bg-cyber-bg p-2 rounded-lg border border-cyber-border">
                                            <input 
                                                type="text" 
                                                readOnly 
                                                value={`${window.location.protocol}//${window.location.host}${window.location.pathname}?match=${matchId}`} 
                                                className="w-full bg-transparent font-mono text-xs text-slate-300 px-2 focus:outline-none"
                                            />
                                            <button 
                                                onClick={copyShareUrl}
                                                className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-cyber-cyan font-cyber text-xs rounded transition-all"
                                            >
                                                COPY
                                            </button>
                                        </div>
                                    </div>
                                )}

                                {/* CHALLENGER MODE UI */}
                                {!isCreator && matchState === "WAITING_TO_JOIN" && (
                                    <div className="space-y-6 text-center py-6">
                                        <div className="inline-block p-4 rounded-full bg-cyber-green/10 border border-cyber-green/30 text-cyber-green mb-2">
                                            ⚔️
                                        </div>
                                        <h3 className="font-cyber font-bold text-white text-lg">MATCH INVITE RECEIVED</h3>
                                        <p className="text-sm font-mono text-slate-400 max-w-md mx-auto">
                                            You have been challenged to match ID: <strong className="text-cyber-cyan">{matchId}</strong>. Stake funds to lock escrow and begin.
                                        </p>

                                        <button 
                                            onClick={handleJoinMatch}
                                            className="px-8 py-4 bg-cyber-green hover:bg-emerald-400 text-black font-cyber font-black tracking-wider uppercase rounded-lg transition-all shadow-lg neon-glow-green cursor-pointer"
                                        >
                                            MATCH STAKE & JOIN ROOM
                                        </button>
                                    </div>
                                )}

                                {/* MATCH READY / IN PROGRESS UI */}
                                {(matchState === "READY" || matchState === "IN_PROGRESS") && (
                                    <div className="space-y-6 py-4">
                                        <div className="bg-emerald-950/20 border border-cyber-green/40 rounded-xl p-4 flex items-center justify-between">
                                            <div>
                                                <div className="text-xs font-mono text-cyber-green font-bold flex items-center gap-2">
                                                    <span className="w-2 h-2 rounded-full bg-cyber-green animate-ping"></span>
                                                    MATCH IN PROGRESS
                                                </div>
                                                <div className="text-sm font-cyber text-white mt-1">AI Referee Session Active</div>
                                            </div>
                                            <div className="text-right font-mono text-xs text-slate-400">
                                                <div>ROOM: {matchId}</div>
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-2 gap-4">
                                            <div className="bg-cyber-bg border border-cyber-border p-4 rounded-lg text-center">
                                                <div className="text-xs font-mono text-slate-500 mb-1">PLAYER 1 (CREATOR)</div>
                                                <div className="font-mono text-xs text-cyber-cyan truncate">{account ? `${account.substring(0,8)}...` : 'Connected'}</div>
                                            </div>
                                            <div className="bg-cyber-bg border border-cyber-border p-4 rounded-lg text-center">
                                                <div className="text-xs font-mono text-slate-500 mb-1">PLAYER 2 (CHALLENGER)</div>
                                                <div className="font-mono text-xs text-cyber-purple truncate">{opponentAddress ? `${opponentAddress.substring(0,8)}...` : 'Waiting...'}</div>
                                            </div>
                                        </div>

                                        <div className="p-4 bg-slate-900/50 rounded-lg border border-cyber-border text-center font-mono text-xs text-slate-400">
                                            Match telemetry streaming via WebSocket. Winner will be automatically settled upon AI score validation.
                                        </div>
                                    </div>
                                )}

                            </div>

                            {/* Neural Console Terminal */}
                            <div className="bg-cyber-card border border-cyber-border rounded-xl p-5 flex flex-col h-64">
                                <div className="flex justify-between items-center mb-3 border-b border-cyber-border pb-2">
                                    <div className="font-cyber text-xs font-bold text-slate-300 flex items-center gap-2">
                                        <span className="text-cyber-cyan">&gt;</span> NEURAL CONSOLE TERMINAL
                                    </div>
                                    <div className="text-[10px] font-mono text-slate-500">WEBSOCKET: ACTIVE</div>
                                </div>
                                
                                <div className="flex-grow overflow-y-auto font-mono text-xs space-y-2 pr-2">
                                    {logs.map((log, idx) => (
                                        <div key={idx} className="flex items-start gap-2">
                                            <span className="text-slate-600">[{log.time}]</span>
                                            <span className={
                                                log.type === 'success' ? 'text-cyber-green' :
                                                log.type === 'danger' ? 'text-cyber-danger' :
                                                log.type === 'sys' ? 'text-cyber-cyan' : 'text-slate-300'
                                            }>
                                                {log.text}
                                            </span>
                                        </div>
                                    ))}
                                    <div ref={terminalEndRef}></div>
                                </div>

        from fastapi import FastAPI, WebSocket, WebSocketDisconnect

        import json

        class ConnectionManager:
            def __init__(self):
                self.active_rooms: dict[str, list[WebSocket]] = {}

            async def connect(self, match_id: str, websocket: WebSocket):
                await websocket.accept()
                if match_id not in self.active_rooms:
                    self.active_rooms[match_id] = []
                self.active_rooms[match_id].append(websocket)

            def disconnect(self, match_id: str, websocket: WebSocket):
                if match_id in self.active_rooms:
                    self.active_rooms[match_id].remove(websocket)
                    if not self.active_rooms[match_id]:
                        del self.active_rooms[match_id]

            async def broadcast_to_room(self, match_id: str, message: dict):
                if match_id in self.active_rooms:
                    for connection in self.active_rooms[match_id]:
                        await connection.send_text(json.dumps(message))
