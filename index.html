<body>
  <div id="root"></div>
  <script type="text/babel">
const { useState, useMemo, useEffect } = React;

// Define Kenyan Construction Ecosystem Icons as raw SVGs
const Icons = {

    Truck: () => (

    ShoppingBag: () => (

    ShieldCheck: () => (

        </svg>
    ),
    Users: () => (
        <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">

    ),
    Search: () => (
        <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="8"/>

    ),
    Plus: () => (
        <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
            <line x1="12" x2="12" y1="5" y2="19"/>

    ),
    Notification: () => (
        <svg className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">

    ),
    Phone: () => (
        <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
        </svg>
    ),
    MapPin: () => (
        <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">

};

function App() {
    // Basic App Configuration & Kenya context states
    const [activeTab, setActiveTab] = useState('dashboard');
    const [userRole, setUserRole] = useState('fundi'); // 'fundi' (worker) or 'contractor' (employer)
    const [selectedCounty, setSelectedCounty] = useState('All');
    const [searchQuery, setSearchQuery] = useState('');
    const [mPesaWallet, setMPesaWallet] = useState(6450); // Initialized with custom Kenyan Shilling amount
    const [chamaSavings, setChamaSavings] = useState(14800);
    const [notifications, setNotifications] = useState([
        { id: 1, title: 'Kazi Imepatikana!', msg: 'New masonry job posted in Westlands, Nairobi.', read: false, time: '2 mins ago' },
        { id: 2, title: 'Chama Update', msg: 'Your weekly contribution of KSh 500 was successfully received.', read: false, time: '1 hour ago' },
        { id: 3, title: 'Price Drop alert', msg: 'Savannah Cement prices dropped to KSh 640 per bag at Ruai Builders.', read: true, time: '1 day ago' }
    ]);
    const [showNotifications, setShowNotifications] = useState(false);
    
    // Dynamic Form States
    const [showAddJobModal, setShowAddJobModal] = useState(false);
    const [newJob, setNewJob] = useState({
        title: '', siteName: '', county: 'Nairobi', area: '', pay: '', duration: '', details: '', type: 'Masonry'
    });
    const [newFundiProfile, setNewFundiProfile] = useState({
        name: '', skill: 'Masonry', county: 'Nairobi', dailyRate: '', phone: '', experience: '', certified: true
    });
    const [showAddProfileModal, setShowAddProfileModal] = useState(false);

    // Job application simulator state
    const [appliedJobIds, setAppliedJobIds] = useState([2]); // Preset dynamic job applications
    const [cart, setCart] = useState([]); // Selected materials for standard checkout simulation
    const [chamaContributionAmount, setChamaContributionAmount] = useState('500');

    // Calculator states (Extremely practical construction metric tool for fundis)
    const [calcType, setCalcType] = useState('concrete'); // concrete, brick
    const [calcLength, setCalcLength] = useState('10');
    const [calcWidth, setCalcWidth] = useState('10');
    const [calcThickness, setCalcThickness] = useState('0.1'); // For concrete slab
    const [calcResults, setCalcResults] = useState(null);

    // Filter counties
    const counties = ['All', 'Nairobi', 'Mombasa', 'Kiambu', 'Nakuru', 'Kisumu', 'Uasin Gishu', 'Machakos'];

    // Mock Databases representing "everything ready in the market"
    const [marketJobs, setMarketJobs] = useState([
        { id: 1, title: 'Daily Plastering Kibarua', siteName: 'Safaricom Housing Scheme', area: 'Kasarani', county: 'Nairobi', pay: 'KSh 1,500 / Day', duration: '5 Days', type: 'Masonry', status: 'Active', posts: 4 },
        { id: 2, title: 'Site Electrical Wiring Lead', siteName: 'Nyali Heights Apartments', area: 'Nyali', county: 'Mombasa', pay: 'KSh 25,000 Total', duration: '2 Weeks', type: 'Electrical', status: 'Active', posts: 1 },
        { id: 3, title: 'Commercial Painting Crew Needed', siteName: 'Two Rivers Extension', area: 'Ruaka', county: 'Kiambu', pay: 'KSh 1,800 / Day', duration: '10 Days', type: 'Painting', status: 'Active', posts: 6 },
        { id: 4, title: 'Slab Concreting Cast Casuals', siteName: 'Maji Mazuri Villas', area: 'Milimani', county: 'Nakuru', pay: 'KSh 1,200 / Day', duration: '1 Day', type: 'Masonry', status: 'Urgent', posts: 12 },
        { id: 5, title: 'Plumbing System Overhaul', siteName: 'Mega Plaza Mall', area: 'CBD', county: 'Kisumu', pay: 'KSh 3,500 / Day', duration: '4 Days', type: 'Plumbing', status: 'Active', posts: 2 }
    ]);

    const [marketMaterials, setMarketMaterials] = useState([
        { id: 101, name: 'Bamburi Tembo Cement (50Kg)', category: 'Cement', price: 650, unit: 'bag', dealer: 'Duka la Jenga, Ruai', county: 'Nairobi', phone: '0712345678', stock: 'In Stock' },
        { id: 102, name: 'Savannah Cement (50Kg)', category: 'Cement', price: 635, unit: 'bag', dealer: 'Njoro Hardwares', county: 'Nakuru', phone: '0722112233', stock: 'In Stock' },
        { id: 103, name: 'Deformed Steel Bars (Y12)', category: 'Steel', price: 1150, unit: 'piece', dealer: 'Kenya Steel Yards', county: 'Nairobi', phone: '0733445566', stock: 'Limited' },
        { id: 104, name: 'River Sand (Tipper Truck)', category: 'Aggregates', price: 18500, unit: '7 Tonnes', dealer: 'Mlolongo Sand Distributors', county: 'Machakos', phone: '0711998877', stock: 'In Stock' },
        { id: 105, name: 'Blue Stone Ballast (3/4 Inch)', category: 'Aggregates', price: 14500, unit: '7 Tonnes', dealer: 'Mlolongo Sand Distributors', county: 'Machakos', phone: '0711998877', stock: 'In Stock' },
        { id: 106, name: 'Cypress Timber (2x2)', category: 'Timber', price: 45, unit: 'per foot', dealer: 'Gikomba Timber Traders', county: 'Nairobi', phone: '0700554433', stock: 'In Stock' }
    ]);

    const [marketTools, setMarketTools] = useState([
        { id: 201, name: 'Diesel Concrete Mixer (Heavy Duty)', category: 'Machinery', price: 3500, unit: 'Day', dealer: 'Mombasa Road Tool Rentals', county: 'Nairobi', status: 'Available' },
        { id: 202, name: 'DeWalt Hammer Drill SDS', category: 'Hand Tools', price: 600, unit: 'Day', dealer: 'Fundi Hub Westlands', county: 'Nairobi', status: 'Available' },
        { id: 203, name: 'Steel Scaffolding Set (5 Frames)', category: 'Safety & Support', price: 250, unit: 'Day', dealer: 'Kigo Scaffolds & Shuttering', county: 'Kiambu', status: 'Rented Out' },
        { id: 204, name: 'Electric Angle Grinder 9"', category: 'Hand Tools', price: 400, unit: 'Day', dealer: 'Kisumu Builders Store', county: 'Kisumu', status: 'Available' }
    ]);

    const [mafundiProfiles, setMafundiProfiles] = useState([
        { id: 301, name: 'John Kamau (Fundi Kamau)', skill: 'Masonry', county: 'Nairobi', area: 'Kasarani', dailyRate: 1800, experience: '8 Years', certified: true, rating: 4.9, reviews: 24, phone: '0712345600', avatar: 'https://images.unsplash.com/photo-1540569014015-19a7be504e3a?auto=format&fit=crop&q=80&w=120' },
        { id: 302, name: 'Sarah Atieno (Wire-Lady)', skill: 'Electrical', county: 'Kisumu', area: 'Kondele', dailyRate: 2200, experience: '5 Years', certified: true, rating: 4.8, reviews: 18, phone: '0722998800', avatar: 'https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&q=80&w=120' },
        { id: 303, name: 'Michael Mwangi', skill: 'Plumbing', county: 'Kiambu', area: 'Thika', dailyRate: 1500, experience: '6 Years', certified: false, rating: 4.5, reviews: 12, phone: '0733887700', avatar: 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&q=80&w=120' },
        { id: 304, name: 'Emmanuel Kiprop', skill: 'Welding', county: 'Uasin Gishu', area: 'Eldoret Town', dailyRate: 2000, experience: '10 Years', certified: true, rating: 5.0, reviews: 31, phone: '0744776600', avatar: 'https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?auto=format&fit=crop&q=80&w=120' }
    ]);

    const [marketTransport, setMarketTransport] = useState([
        { id: 401, type: 'Bodaboda Delivery', capacity: 'Up to 50Kg (Small tools/1 Cement bag)', rate: 'KSh 150 base + 50/Km', contacts: 'Nairobi Central Boda Association', phone: '0799888777' },
        { id: 402, type: 'Pick-up Truck (Toyota Hilux)', capacity: 'Up to 1.5 Tonnes', rate: 'KSh 3,000 base + 120/Km', contacts: 'Express Pickups Kenya', phone: '0788777666' },
        { id: 403, type: 'Tipper Truck (SinoTruck)', capacity: 'Up to 15 Tonnes (Sand/Ballast)', rate: 'Flat KSh 12,000 within Nairobi', contacts: 'Kiambu Lorry Operators', phone: '0766555444' }
    ]);

    // Perform interactive calculation
    const handleCalculate = () => {
        const l = parseFloat(calcLength) || 0;
        const w = parseFloat(calcWidth) || 0;
        const t = parseFloat(calcThickness) || 0;

        if (calcType === 'concrete') {
            const volume = l * w * t;
            // Concrete mix ratio estimation (1:2:4 standard structural slab)
            // 1 cubic meter of concrete requires approx:
            // 7.2 bags cement, 0.4 cubic meters sand, 0.8 cubic meters ballast
            const cementBags = Math.ceil(volume * 7.8);
            const sandTonnes = (volume * 0.6).toFixed(1);
            const ballastTonnes = (volume * 1.2).toFixed(1);
            setCalcResults({
                volume: volume.toFixed(2),
                cement: cementBags,
                sand: sandTonnes,
                ballast: ballastTonnes,
                costEst: (cementBags * 650) + (parseFloat(sandTonnes) * 2500) + (parseFloat(ballastTonnes) * 2200)
            });
        } else {
            // Brick wall estimator based on surface area
            // Approx 50 standard bricks per square meter for single wall
            const area = l * w; // Assuming w is acting as height of wall here
            const bricksRequired = Math.ceil(area * 50);
            const cementForMortar = Math.ceil(bricksRequired * 0.02); // rough estimate
            setCalcResults({
                area: area.toFixed(1),
                bricks: bricksRequired,
                cement: cementForMortar,
                costEst: (bricksRequired * 35) + (cementForMortar * 650)
            });
        }
    };

    // Recalculate if type changes
    useEffect(() => {
        handleCalculate();
    }, [calcType, calcLength, calcWidth, calcThickness]);

    // Handle interactive Apply Job Action
    const handleApplyJob = (jobId) => {
        if (appliedJobIds.includes(jobId)) return;
        setAppliedJobIds([...appliedJobIds, jobId]);
        
        // Add a dynamic M-Pesa notification & confirm box simulation
        const addedNotif = {
            id: notifications.length + 1,
            title: 'Kazi Applied Successful!',
            msg: `Your application has been received. Contractor has been notified via SMS.`,
            read: false,
            time: 'Just now'
        };
        setNotifications([addedNotif, ...notifications]);
        alert(`Maombi Yako Yametumwa! Application submitted. The site manager will contact you on your registered number.`);
    };

    // Handle Chama Savings deposit
    const handleChamaDeposit = (e) => {
        e.preventDefault();
        const amt = parseFloat(chamaContributionAmount);
        if (isNaN(amt) || amt <= 0) {
            alert('Weka kiasi sahihi cha fedha.');
            return;
        }
        if (mPesaWallet < amt) {
            alert('M-Pesa balance is insufficient to complete this contribution.');
            return;
        }

        setMPesaWallet(prev => prev - amt);
        setChamaSavings(prev => prev + amt);
        
        const addedNotif = {
            id: notifications.length + 1,
            title: 'Chama Contribution Successful',
            msg: `KSh ${amt} deposited from M-Pesa into Jenga Fund Chama.`,
            read: false,
            time: 'Just now'
        };
        setNotifications([addedNotif, ...notifications]);
        setChamaContributionAmount('');
        alert(`M-Pesa Paybill Transaction Complete! KSh ${amt} safely contributed to your Chama account.`);
    };

    // Handle Material checkout basket additions
    const toggleCart = (item) => {
        const exists = cart.find(x => x.id === item.id);
        if (exists) {
            setCart(cart.filter(x => x.id !== item.id));
        } else {
            setCart([...cart, { ...item, qty: 1 }]);
        }
    };

    // Post new Job
    const handleCreateJobSubmit = (e) => {
        e.preventDefault();
        if (!newJob.title || !newJob.pay || !newJob.area) {
            alert('Tafadhali jaza nafasi zote muhimu.');
            return;
        }
        const created = {
            id: marketJobs.length + 1,
            title: newJob.title,
            siteName: newJob.siteName || 'Private Site',
            county: newJob.county,
            area: newJob.area,
            pay: `KSh ${newJob.pay} / Day`,
            duration: newJob.duration || 'Flexible',
            type: newJob.type,
            status: 'Active',
            posts: 1
        };
        setMarketJobs([created, ...marketJobs]);
        setShowAddJobModal(false);
        setNewJob({ title: '', siteName: '', county: 'Nairobi', area: '', pay: '', duration: '', details: '', type: 'Masonry' });
        alert('Your job posting has been broadcast to all Fundis in ' + created.county + '!');
    };

    // Register a new Fundi Profile
    const handleCreateProfileSubmit = (e) => {
        e.preventDefault();
        if (!newFundiProfile.name || !newFundiProfile.dailyRate || !newFundiProfile.phone) {
            alert('Tafadhali jaza jina na kiwango cha malipo.');
            return;
        }
        const created = {
            id: mafundiProfiles.length + 1,
            name: newFundiProfile.name,
            skill: newFundiProfile.skill,
            county: newFundiProfile.county,
            area: 'Township',
            dailyRate: parseFloat(newFundiProfile.dailyRate),
            experience: newFundiProfile.experience || '3 Years',
            certified: newFundiProfile.certified,
            rating: 5.0,
            reviews: 1,
            phone: newFundiProfile.phone,
            avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&q=80&w=120'
        };
        setMafundiProfiles([created, ...mafundiProfiles]);
        setShowAddProfileModal(false);
        setNewFundiProfile({ name: '', skill: 'Masonry', county: 'Nairobi', dailyRate: '', phone: '', experience: '', certified: true });
        alert('Kazi Nzuri! Your professional Fundi profile is now online.');
    };

    // Filtered lists
    const filteredJobs = useMemo(() => {
        return marketJobs.filter(job => {
            const matchesCounty = selectedCounty === 'All' || job.county === selectedCounty;
            const matchesSearch = job.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                  job.type.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                  job.area.toLowerCase().includes(searchQuery.toLowerCase());
            return matchesCounty && matchesSearch;
        });
    }, [marketJobs, selectedCounty, searchQuery]);

    const filteredMaterials = useMemo(() => {
        return marketMaterials.filter(item => {
            const matchesCounty = selectedCounty === 'All' || item.county === selectedCounty;
            const matchesSearch = item.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                  item.category.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                  item.dealer.toLowerCase().includes(searchQuery.toLowerCase());
            return matchesCounty && matchesSearch;
        });
    }, [marketMaterials, selectedCounty, searchQuery]);

    const filteredTools = useMemo(() => {
        return marketTools.filter(tool => {
            const matchesCounty = selectedCounty === 'All' || tool.county === selectedCounty;
            const matchesSearch = tool.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                  tool.category.toLowerCase().includes(searchQuery.toLowerCase());
            return matchesCounty && matchesSearch;
        });
    }, [marketTools, selectedCounty, searchQuery]);

    const filteredMafundi = useMemo(() => {
        return mafundiProfiles.filter(profile => {
            const matchesCounty = selectedCounty === 'All' || profile.county === selectedCounty;
            const matchesSearch = profile.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                  profile.skill.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                  profile.area.toLowerCase().includes(searchQuery.toLowerCase());
            return matchesCounty && matchesSearch;
        });
    }, [mafundiProfiles, selectedCounty, searchQuery]);

    return (
        <div className="min-h-screen bg-slate-50 text-slate-950 flex flex-col font-sans selection:bg-amber-400 selection:text-slate-900">
            
            {/* National Top Header Banner / M-Pesa Integration Status */}
            <header className="bg-slate-900 text-white sticky top-0 z-50 shadow-md">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 h-20 flex items-center justify-between">
                    
                    {/* Brand Name with Kenyan Flag thematic colored dot */}
                    <div className="flex items-center space-x-3">
                        <div className="w-12 h-12 rounded-xl bg-gradient-to-tr from-amber-500 to-orange-600 flex items-center justify-center shadow-lg transform transition-transform hover:scale-105">
                            <span className="font-extrabold text-xl text-slate-900 tracking-wider">UK</span>
                        </div>
                        <div>
                            <div className="flex items-center space-x-2">
                                <h1 className="font-bold text-xl tracking-tight">UJENZI CONNECT</h1>
                                <span className="flex space-x-0.5">
                                    <span className="w-2.5 h-1.5 bg-red-600 rounded-sm"></span>
                                    <span className="w-2.5 h-1.5 bg-green-600 rounded-sm"></span>
                                    <span className="w-2.5 h-1.5 bg-black rounded-sm"></span>
                                </span>
                            </div>
                            <p className="text-[10px] text-slate-400 tracking-widest uppercase">Soko Kuu la Mafundi Kenya</p>
                        </div>
                    </div>

                    {/* Quick Search Bar (Global Context filter) */}
                    <div className="hidden md:flex items-center space-x-2 bg-slate-800 border border-slate-700 rounded-xl px-3 py-1.5 w-72">
                        <Icons.Search />
                        <input 
                            type="text" 
                            placeholder="Tafuta Cement, Mafundi, Mikataba..." 
                            value={searchQuery}
                            onChange={(e) => setSearchQuery(e.target.value)}
                            className="bg-transparent border-none text-xs text-slate-200 focus:outline-none w-full"
                        />
                    </div>

                    {/* Local Financial Status Indicators */}
                    <div className="flex items-center space-x-4">
                        
                        {/* Dynamic User Profile Quick Switch */}
                        <div className="hidden sm:flex items-center space-x-1.5 bg-slate-800/80 p-1 rounded-xl border border-slate-700">
                            <button 
                                onClick={() => setUserRole('fundi')}
                                className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition-all ${userRole === 'fundi' ? 'bg-amber-500 text-slate-900 shadow-md' : 'text-slate-400 hover:text-slate-200'}`}
                            >
                                Mimi ni Fundi
                            </button>
                            <button 
                                onClick={() => setUserRole('contractor')}
                                className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition-all ${userRole === 'contractor' ? 'bg-amber-500 text-slate-900 shadow-md' : 'text-slate-400 hover:text-slate-200'}`}
                            >
                                Mimi ni Tajiri / Boss
                            </button>
                        </div>

                        {/* M-Pesa Integrated Balance Widget */}
