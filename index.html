// High-Fidelity Web Audio Synthesizer for Immersive Audio Feedback
const playSound = (type) => {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'click') {
            osc.frequency.setValueAtTime(900, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1400, ctx.currentTime + 0.05);
            gain.gain.setValueAtTime(0.04, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
            osc.start();
            osc.stop(ctx.currentTime + 0.05);
        } else if (type === 'warning') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(120, ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(380, ctx.currentTime + 0.12);
            osc.frequency.linearRampToValueAtTime(120, ctx.currentTime + 0.25);
            gain.gain.setValueAtTime(0.08, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
            osc.start();
            osc.stop(ctx.currentTime + 0.25);
        } else if (type === 'success') {
            osc.type = 'sine';
            const chord = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
            chord.forEach((freq, idx) => {
                const o = ctx.createOscillator();
                const g = ctx.createGain();
                o.connect(g);
                g.connect(ctx.destination);
                o.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.06);
                g.gain.setValueAtTime(0.03, ctx.currentTime + idx * 0.06);
                g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.06 + 0.3);
                o.start(ctx.currentTime + idx * 0.06);
                o.stop(ctx.currentTime + idx * 0.06 + 0.3);
            });
        } else if (type === 'scan') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(800, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(250, ctx.currentTime + 0.5);
            gain.gain.setValueAtTime(0.02, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
            osc.start();
            osc.stop(ctx.currentTime + 0.5);
        }
    } catch (e) {
        // Ignored if user interaction limits apply
    }
};

const SOLIDITY_CONTRACT_CODE = `// SPDX-License-Identifier: MIT
pragma solidity ^0.8.20;

/**
 * @title Project Epic: Decentralized AI Referee Gaming Escrow
 * @notice Exclusively locks and settles native USDC stakes on the Base network.
 * @dev Enforces automated platform fee extraction on payouts to the platform wallet.
 */

interface IERC20 {
    function transfer(address to, uint256 amount) external returns (bool);
    function transferFrom(address from, address to, uint256 amount) external returns (bool);
    function balanceOf(address account) external view returns (uint256);
}

contract EpicGamingEscrow {
    // Base Network Platform Fee Destination
    address public constant FEE_ADDRESS = 0xe69aE274c4D814fDB312120d3db1C5c2BD63a071;
    uint256 public constant FEE_BPS = 250; // 2.5% Flat Platform Fee

    address public immutable oracle;
    address public immutable usdcToken; // Base Network Native USDC: 0x833589fCD6eDb6E08f4c7C32D4f71b54bda02913

    struct Match {
        address player1;
        address player2;
        uint256 lockedUsdc;
        bool active;
        bool settled;
    }

    mapping(bytes32 => Match) public matches;

    event MatchStaked(bytes32 indexed matchId, address indexed player, uint256 usdcAmount);
    event MatchSettled(bytes32 indexed matchId, address indexed winner, uint256 winnerPayout, uint256 platformFee);
    event CheatEnforced(bytes32 indexed matchId, address indexed cheater, address indexed victim, uint256 payout);

    modifier onlyOracle() {
        require(msg.sender == oracle, "Error: Must be Authorized AI Referee Oracle");
        _;
    }

    constructor(address _oracle, address _usdcToken) {
        require(_oracle != address(0), "Invalid oracle");
        require(_usdcToken != address(0), "Invalid token");
        oracle = _oracle;
        usdcToken = _usdcToken;
    }

    /**
     * @notice Stakes native USDC tokens and locks them into match escrow pool.
     */
    function stakeUSDC(bytes32 matchId, address opponent, uint256 amount) external {
        require(opponent != address(0) && opponent != msg.sender, "Invalid opponent address");
        require(amount > 0, "Stake must be greater than 0");

        // Secure Transfer from standard player wallet
        IERC20(usdcToken).transferFrom(msg.sender, address(this), amount);

        Match storage m = matches[matchId];
        if (!m.active && !m.settled) {
            m.player1 = msg.sender;
            m.player2 = opponent;
            m.active = true;
        }

        m.lockedUsdc += amount;
        emit MatchStaked(matchId, msg.sender, amount);
    }

    /**
     * @notice Oracle triggers instant resolution and dispatches USDC winner payout minus platform fee.
     */
    function executePayout(bytes32 matchId, address winner) external onlyOracle {
        Match storage m = matches[matchId];
        require(m.active && !m.settled, "Match inactive or resolved");
        require(winner == m.player1 || winner == m.player2, "Winner must be active participant");

        m.settled = true;
        m.active = false;

        uint256 totalPool = m.lockedUsdc;
        uint256 feeAmount = (totalPool * FEE_BPS) / 10000;
        uint256 winnerPayout = totalPool - feeAmount;

        // Route commission directly to Base storage node
        require(IERC20(usdcToken).transfer(FEE_ADDRESS, feeAmount), "Platform fee transfer failed");
        // Route remaining funds to validated victor
        require(IERC20(usdcToken).transfer(winner, winnerPayout), "Winner transfer failed");

        emit MatchSettled(matchId, winner, winnerPayout, feeAmount);
    }

    /**
     * @notice Zero-Tolerance Anti-Cheat override execution. Awards non-violating player entire balance minus fee.
     */
    function enforceAntiCheatShutdown(bytes32 matchId, address cheater) external onlyOracle {
        Match storage m = matches[matchId];
        require(m.active && !m.settled, "Match cannot be modified");
        address honestPlayer = (cheater == m.player1) ? m.player2 : m.player1;

        m.settled = true;
        m.active = false;

        uint256 totalPool = m.lockedUsdc;
        uint256 feeAmount = (totalPool * FEE_BPS) / 10000;
        uint256 winnerPayout = totalPool - feeAmount;

        require(IERC20(usdcToken).transfer(FEE_ADDRESS, feeAmount), "Platform fee transfer failed");
        require(IERC20(usdcToken).transfer(honestPlayer, winnerPayout), "Honest player payout failed");

        emit CheatEnforced(matchId, cheater, honestPlayer, winnerPayout);
    }
}`;

function App() {
    useEffect(() => {
        injectStylesAndFonts();
    }, []);

    // State Variables
    const [matchId] = useState("0x" + Array.from({length: 40}, () => Math.floor(Math.random()*16).toString(16)).join(""));

    const [siweModal, setSiweModal] = useState(false);
    const [siweSigning, setSiweSigning] = useState(false);
    const [jwtSession, setJwtSession] = useState(null);

    const [stakingAmount, setStakingAmount] = useState("100");
    const [selectedPlayer, setSelectedPlayer] = useState("Player 1");

    // Chat interactions
    const [chatLog, setChatLog] = useState([
        { sender: "AI REFEREE", text: "Secure AI Oracle session initiated. Monitoring Base L2 Node channels.", time: "SYS-INIT" }
    ]);

    const [isTyping, setIsTyping] = useState(false);
    const [mute, setMute] = useState(false);

    // Live Telemetry logs
    const [ping, setPing] = useState(14);
    const [fps, setFps] = useState(144);
    const [packetLoss, setPacketLoss] = useState(0);
    const [memState, setMemState] = useState("SECURE");

    // Live telemetry variations

                setPacketLoss(Math.random() > 0.95 ? 1 : 0);
            } else if (gameState === "dispute") {
                setPing(982);
                setFps(24);
                setPacketLoss(35);
            } else {
                setPing(Math.floor(Math.random() * 3) + 10);
                setFps(Math.floor(Math.random() * 4) + 141);
                setPacketLoss(0);
            }
        }, 1200);
        return () => clearInterval(interval);
    }, [gameState]);

    // Handle initial connection click (opens custom SIWE screen)
    const handleConnectClick = () => {
        if (!mute) playSound('click');
        if (connected) {
            // Disconnect immediately
            setConnected(false);
            setWalletAddress("");
            setUsdcBalance(0);
            setJwtSession(null);
            addChatMsg("SYSTEM", "User session cleared. Connected wallet detached.");
        } else {
            setSiweModal(true);
        }
    };

    // SIWE Cryptographic Sign Simulator
    const executeSIWE = () => {
        if (!mute) playSound('scan');
        setSiweSigning(true);
        setTimeout(() => {
            setSiweSigning(false);
            setSiweModal(false);
            setConnected(true);
            setWalletAddress("0x71C7...b2c3");
            setUsdcBalance(5000.00); // Give user initial mock USDC to stake
            const randomJwt = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9." + btoa(JSON.stringify({ address: "0x71C7...b2c3", auth: true }));
            setJwtSession(randomJwt);
            addChatMsg("SYSTEM", "SIWE signature cryptographically verified. Generated session JWT.");
            addChatMsg("AI REFEREE", "Player 1 Wallet linked with full telemetry authorization. Native USDC assets ready.");
            if (!mute) playSound('success');
        }, 1600);
    };

    const addChatMsg = (sender, text) => {
        const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        setChatLog(prev => [...prev, { sender, text, time }]);
    };

    // Multi-route Deposit or Direct USDC stake
    const executeStake = () => {
        if (!connected) {
            alert("Cryptographic SIWE session must be authenticated to stake assets!");
            return;
        }
        const parsedAmount = parseFloat(stakingAmount);
        if (isNaN(parsedAmount) || parsedAmount <= 0) {
            alert("Please input a valid USDC stake amount.");
            return;
        }
        if (parsedAmount > usdcBalance) {
            alert("Insufficient native USDC balance!");
            return;
        }

        if (!mute) playSound('success');
        setUsdcBalance(prev => prev - parsedAmount);

        if (selectedPlayer === "Player 1") {
            setP1Stake(prev => prev + parsedAmount);
            setEscrowPool(prev => prev + parsedAmount);
            addChatMsg("SYSTEM", `Player 1 (ELITE_CONQUEROR) deposited ${parsedAmount} USDC into the Base L2 Escrow contract.`);
        } else {
            setP2Stake(prev => prev + parsedAmount);
            setEscrowPool(prev => prev + parsedAmount);
            addChatMsg("SYSTEM", `Player 2 (DEGEN_KILLER) deposited ${parsedAmount} USDC into the Base L2 Escrow contract.`);
        }
    };

    // AI Interactive response model
    const triggerAIResponse = (promptText) => {
        setIsTyping(true);
        if (!mute) playSound('scan');
        setTimeout(() => {
            setIsTyping(false);
            let reply = "";
            const norm = promptText.toLowerCase();

            if (norm.includes("status") || norm.includes("telemetry")) {
                reply = `[TELEMETRY REPORT] Verified Client Modules. FPS: ${fps}. Net Latency: ${ping}ms. All local processes checked and tagged secure. Escrow lock index: ${matchId.substring(0, 10)}...`;
            } else if (norm.includes("cheat") || norm.includes("violation")) {
                reply = "Zero-tolerance ruleset is operational. Active client telemetry is evaluated. Memory wrappers, local hook modifications, or network spoofing trigger instant collateral release to the honest counterparty.";
            } else if (norm.includes("payout") || norm.includes("fee")) {
                reply = `Match pool is currently ${escrowPool.toFixed(2)} USDC. Platform reserves 2.50% directly into secure storage. Resolution triggers multi-sig broadcast to verified winner address.`;
            } else {
                reply = `Inquiry processed. Standing by for telemetry endpoints. Currently checking Match L2 state for active locks. Standard operations stable.`;
            }

            addChatMsg("AI REFEREE", reply);
            if (!mute) playSound('click');
        }, 1100);
    };

    const handleSendChat = (e) => {
        e.preventDefault();
        if (!userInput.trim()) return;
        const msg = userInput;
        addChatMsg("USER", msg);
        setUserInput("");
        triggerAIResponse(msg);
    };

    // Match State Simulators
    const startMatchScan = () => {
        if (escrowPool === 0) {
            alert("Escrow Pool must be funded prior to starting match telemetry monitoring!");
            return;
        }
        if (!mute) playSound('scan');
        setGameState("scanning");
        addChatMsg("AI REFEREE", "Active game telemetry hooks loaded. Client memory spaces, performance indexes, and network packets are being logged.");
    };

    const forceCheatViolation = () => {
        if (gameState !== "scanning") {
            alert("Match telemetry scan must be active to trigger violations!");
            return;

        setGameState("dispute");
        setMemState("VIOLATION: DYNAMIC PACKET INJECTION");

            addChatMsg("AI REFEREE", "SECURITY VERDICT: Cheat metrics verified. Shutting down active channels and executing secure escrow override.");

            addChatMsg("SYSTEM", `Base Contract Broadcast: Transferred ${honestPayout.toFixed(2)} USDC to non-violating Player 2. Routed platform fee of ${fee.toFixed(2)} USDC to safe deposit.`);
            setEscrowPool(0);
            setP1Stake(0);
            setP2Stake(0);
        }, 3000);
    };

    const resolveCleanVictory = () => {
        if (gameState !== "scanning") {
            alert("Match telemetry scan must be active to complete match!");
            return;
        }
        if (!mute) playSound('success');
        setGameState("victory");
        setMemState("VERIFIED SECURE");
        addChatMsg("AI REFEREE", "MATCH COMPLETE: High telemetry evaluation complete. Counter-signatures verified. No violations recorded. Winner identified: Player 2.");

        setTimeout(() => {
            const fee = escrowPool * 0.025;
            const payout = escrowPool - fee;
            addChatMsg("SYSTEM", `Base L2 Settled: ${payout.toFixed(2)} USDC released to Player 2. Service fee of ${fee.toFixed(2)} USDC routed directly to 0xe69aE274c4D814fDB312120d3db1C5c2BD63a071`);
            setEscrowPool(0);
            setP1Stake(0);
            setP2Stake(0);
        }, 2200);
    };

    const resetArena = () => {
        if (!mute) playSound('click');
        setGameState("idle");
        setMemState("SECURE");
        setEscrowPool(0);
        setP1Stake(0);
        setP2Stake(0);
        setChatLog([{ sender: "AI REFEREE", text: "Oracle reset completed. Standing by for next match configurations.", time: "SYS-RESET" }]);
    };

    return (
        <div className="min-h-screen bg-transparent flex flex-col justify-between selection:bg-[#66FCF1] selection:text-black">
            
            {/* Holographic Glowing Orbs */}
            <div className="absolute top-0 left-0 w-full h-full pointer-events-none opacity-30 overflow-hidden z-0">
                <div className="absolute top-[10%] left-[25%] w-[25vw] h-[25vw] bg-cyan-600/10 rounded-full blur-[100px]" />
                <div className="absolute bottom-[15%] right-[15%] w-[30vw] h-[30vw] bg-pink-600/5 rounded-full blur-[120px]" />
            </div>

            {/* HEADER */}
            <header className="border-b border-[#66FCF1]/15 bg-[#040609]/95 backdrop-blur-lg relative z-30">
                <div className="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
                    
                    {/* Animated Cybershield Logo */}
                    <div className="flex items-center gap-3">
                        <div className="relative group cursor-pointer" onClick={() => { if(!mute) playSound('click'); }}>
                            <div className={`w-14 h-14 rounded-xl flex items-center justify-center transition-all duration-500 relative overflow-hidden border ${
                                gameState === "dispute" ? "bg-red-500/10 border-red-500 neon-red-glow" :
                                gameState === "scanning" ? "bg-cyan-500/15 border-[#66FCF1] neon-cyan-glow animate-pulse" :
                                gameState === "victory" ? "bg-emerald-500/10 border-emerald-400" :
                                "bg-[#0b0c10]/90 border-cyan-500/30"
                            }`}>
                                <svg className={`w-8 h-8 transition-transform duration-1000 ${
                                    gameState === "scanning" ? "rotate-180" : "group-hover:scale-110"
                                }`} viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                                </svg>
                                <div className="absolute inset-0 bg-gradient-to-b from-transparent via-[#66FCF1]/10 to-transparent pointer-events-none" />
                            </div>
                            <span className="absolute -inset-1 rounded-xl border border-[#66FCF1]/10 group-hover:scale-105 transition-transform duration-300 pointer-events-none" />
                        </div>

                        <div>
                            <div className="flex items-center gap-2">
                                <h1 className="font-orbitron font-extrabold text-2xl tracking-widest text-white">
                                    PROJECT <span className="text-[#66FCF1] drop-shadow-[0_0_8px_rgba(102,252,241,0.5)]">EPIC</span>
                                </h1>
                                <span className="bg-[#66FCF1]/10 text-[#66FCF1] text-[9px] font-mono font-bold px-2 py-0.5 rounded border border-[#66FCF1]/30">
                                    BASE L2
                                </span>

                            className={`px-4 py-2 text-[11px] font-orbitron font-bold tracking-wider rounded transition-all ${
                                activeTab === "solidity" ? "bg-[#66FCF1]/15 text-[#66FCF1] border border-[#66FCF1]/30" : "text-gray-400 hover:text-white"

                            onClick={() => { if(!mute) playSound('click'); setActiveTab("architecture"); }}
