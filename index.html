// ============================================================================
// HD SYNTHESIZED SPATIAL AUDIO SYSTEM (Zero External Dependencies)
// ============================================================================
const playNexusSound = function(type) {
    try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioContextClass();
        if (!ctx) return;
        
        const masterGain = ctx.createGain();
        masterGain.connect(ctx.destination);
        const now = ctx.currentTime;
        
        if (type === 'tick') {
            const osc = ctx.createOscillator();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(900, now);
            masterGain.gain.setValueAtTime(0.02, now);
            masterGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.08);
            osc.connect(masterGain);
            osc.start(now);
            osc.stop(now + 0.08);
        } else if (type === 'laser') {
            const osc = ctx.createOscillator();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(1400, now);
            osc.frequency.exponentialRampToValueAtTime(400, now + 0.2);
            masterGain.gain.setValueAtTime(0.04, now);
            masterGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.2);
            osc.connect(masterGain);
            osc.start(now);
            osc.stop(now + 0.2);
        } else if (type === 'lock') {
            const osc = ctx.createOscillator();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(440, now);
            osc.frequency.setValueAtTime(880, now + 0.1);
            masterGain.gain.setValueAtTime(0.05, now);
            masterGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.25);
            osc.connect(masterGain);
            osc.start(now);
            osc.stop(now + 0.25);
        } else if (type === 'settle') {
            const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99]; // Cyber Chord Major 7th arpeggio
            notes.forEach((freq, idx) => {
                const osc = ctx.createOscillator();
                const noteGain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, now + idx * 0.06);
                noteGain.gain.setValueAtTime(0.05, now + idx * 0.06);
                noteGain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.06 + 0.3);
                osc.connect(noteGain);
                noteGain.connect(ctx.destination);
                osc.start(now + idx * 0.06);
                osc.stop(now + idx * 0.06 + 0.3);
            });
        } else if (type === 'error') {
            const osc = ctx.createOscillator();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.linearRampToValueAtTime(80, now + 0.35);
            masterGain.gain.setValueAtTime(0.08, now);
            masterGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);
            osc.connect(masterGain);
            osc.start(now);
            osc.stop(now + 0.35);
        } else if (type === 'radar') {
            const osc = ctx.createOscillator();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1200, now);
            masterGain.gain.setValueAtTime(0.008, now);
            masterGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.4);
            osc.connect(masterGain);
            osc.start(now);
            osc.stop(now + 0.4);
        }
    } catch (e) {
        // Fallback silently for blocked audio
    }
};

// ============================================================================
// CONTEXT SYSTEM (Escrow & Platform Logic Engine)
// ============================================================================
const EscrowContext = createContext();

const EscrowProvider = ({ children }) => {
  const [appMode, setAppMode] = useState(MODES.DEMO);
  const [matchState, setMatchState] = useState(MATCH_STATES.PRE_MATCH);
  const [walletConnected, setWalletConnected] = useState(false);
  const [walletAddress, setWalletAddress] = useState(null);
  
  const [demoBalance, setDemoBalance] = useState(100.00);
  const [liveUsdcBalance, setLiveUsdcBalance] = useState(250.00);

  const [selectedGame, setSelectedGame] = useState("CyberStrike 2077");
  const [stakePerPlayer, setStakePerPlayer] = useState(25.00);
  const [maxPlayers, setMaxPlayers] = useState(4);
  const [assemblyTtl, setAssemblyTtl] = useState(1800);

  const [players, setPlayers] = useState([]);
  const [spectatorMode, setSpectatorMode] = useState(false);
  const [spectatorDelay, setSpectatorDelay] = useState(15);
  const [cameraLockId, setCameraLockId] = useState(null);

  const [auditLogs, setAuditLogs] = useState([]);
  const [chatMessages, setChatMessages] = useState([
    { sender: "System Agent AI", text: "Global Integrity Shield active. Checking Base L2 node synchronization.", timestamp: new Date().toLocaleTimeString() },
    { sender: "Gemini Referee AI", text: "Packet pipeline optimized. Standard v_max coefficient locked to 15.0 units/sec.", timestamp: new Date().toLocaleTimeString() }
  ]);
  const [matchResult, setMatchResult] = useState(null);

  const generateRoster = useCallback((capacity, mode) => {
    const list = [];
    const isLive = mode === MODES.LIVE;
    
    list.push({
      id: "P-01",
      handle: isLive ? "CyberX_Pro" : "DemoRider_01",
      walletSanitized: isLive ? "0x7F...3B91" : "DEMO_VAULT_01",
      staked: true,
      ping: 12,
      team: "Alpha",
      hp: 100,
      x: 300,
      y: 250,
      vx: 2.1,
      vy: -1.5,
      angle: 45,
      action: "IDLE",
      isSelf: true
    });

    for (let i = 2; i <= capacity; i++) {
      const isStaked = i <= Math.ceil(capacity * 0.75);
      const team = i % 2 === 0 ? "Alpha" : "Beta";
      list.push({
        id: `P-${i < 10 ? '0' + i : i}`,
        handle: `Operator_${i}`,
        walletSanitized: `0x${Math.floor(Math.random()*16777215).toString(16).padEnd(4, '0')}...${i}`,
        staked: isStaked,
        ping: Math.floor(Math.random() * 25) + 10,
        team: team,
        hp: 100,
        x: Math.random() * 700 + 150,
        y: Math.random() * 350 + 100,
        vx: (Math.random() - 0.5) * 6,
        vy: (Math.random() - 0.5) * 6,
        angle: Math.floor(Math.random() * 360),
        action: "IDLE",
        isSelf: false
      });
    }
    return list;
  }, []);

  useEffect(() => {
    setPlayers(generateRoster(maxPlayers, appMode));
  }, [maxPlayers, appMode, generateRoster]);

  useEffect(() => {
    if (matchState !== MATCH_STATES.PRE_MATCH) return;
    const timer = setInterval(() => {
      setAssemblyTtl(prev => (prev > 0 ? prev - 1 : 0));
    }, 1000);
    return () => clearInterval(timer);
  }, [matchState]);

  const toggleMode = (newMode) => {
    if (matchState === MATCH_STATES.MATCH_ACTIVE) {
      playNexusSound('error');
      alert("Platform lock: Mode modification is restricted during active real-time sessions.");
      return;
    }
    setAppMode(newMode);
    playNexusSound('tick');
  };

  const connectWallet = async () => {
    try {
      if (window.ethereum) {
        const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
        if (accounts.length > 0) {
          const addr = accounts[0];
          setWalletAddress(`${addr.substring(0, 6)}...${addr.substring(addr.length - 4)}`);
          setWalletConnected(true);
          playNexusSound('settle');
          return;
        }
      }
    } catch (err) {
      console.warn("Local Web3 injection bypassed. Synchronizing master smart paymaster instance.");
    }
    setWalletAddress("0x7F9e...3B91");
    setWalletConnected(true);
    playNexusSound('settle');
  };

  const disconnectWallet = () => {
    setWalletConnected(false);
    setWalletAddress(null);
    playNexusSound('tick');
  };

  const lockStake = () => {
    if (appMode === MODES.LIVE && !walletConnected) {
      playNexusSound('error');
      alert("A valid Web3 cryptographic signature is required to commit real collateral.");
      return;
    }

    const currentPot = stakePerPlayer * maxPlayers;
    
    if (appMode === MODES.DEMO) {
      if (demoBalance < stakePerPlayer) {
        playNexusSound('error');
        return alert("Inadequate sandbox capital. Reload demo allocations.");
      }
      setDemoBalance(prev => prev - stakePerPlayer);
    } else {
      if (liveUsdcBalance < stakePerPlayer) {
        playNexusSound('error');
        return alert("Insufficient real USDC on Base Layer-2 network.");
      }
      setLiveUsdcBalance(prev => prev - stakePerPlayer);
    }

    setPlayers(prev => prev.map(p => ({ ...p, staked: true })));
    setMatchState(MATCH_STATES.MATCH_ACTIVE);
    playNexusSound('lock');
    setAuditLogs(prev => [
      `[${new Date().toISOString()}] PLATFORM: Escrow initialized. Allocating ${currentPot.toFixed(2)} tokens dynamically into multi-sig network buffer.`,
      `[${new Date().toISOString()}] AUDIT: Programmatic split configured -> 90% (Victory Reward), 10% (Encrypted System fee).`,
      ...prev
    ]);
  };

  const triggerSettlement = (winner) => {
    const activeStakersCount = players.filter(p => p.staked).length;
    const grossPot = stakePerPlayer * activeStakersCount;
    const protocolFee = grossPot * PROTOCOL_FEE_PERCENTAGE;
    const winnerPayout = grossPot * WINNER_PAYOUT_PERCENTAGE;

    if (appMode === MODES.DEMO) {
      if (winner.isSelf) setDemoBalance(prev => prev + winnerPayout);
    } else {
      if (winner.isSelf) setLiveUsdcBalance(prev => prev + winnerPayout);
    }

    setMatchResult({
      winner,
      grossPot,
      protocolFee,
      winnerPayout,
      txHash: `0x${Array.from({length: 64}, () => Math.floor(Math.random()*16).toString(16)).join('')}`,
      blockTimestamp: new Date().toUTCString(),
      cryptographicHash: `NEXUS-VALIDATOR-${Math.random().toString(36).substring(2, 11).toUpperCase()}-APPROVED`
    });

    setMatchState(MATCH_STATES.POST_MATCH);
    playNexusSound('settle');
  };

  const resetPlatform = () => {
    setMatchState(MATCH_STATES.PRE_MATCH);
    setMatchResult(null);
    setAssemblyTtl(1800);
    setPlayers(generateRoster(maxPlayers, appMode));
    playNexusSound('tick');
  };

  return (
    <EscrowContext.Provider value={{
      appMode,
      toggleMode,
      matchState,
      setMatchState,
      walletConnected,
      walletAddress,
      connectWallet,
      disconnectWallet,
      demoBalance,
      setDemoBalance,
      liveUsdcBalance,
      setLiveUsdcBalance,
      selectedGame,
      setSelectedGame,
      stakePerPlayer,
      setStakePerPlayer,
      maxPlayers,
      setMaxPlayers,
      assemblyTtl,
      players,
      setPlayers,
      spectatorMode,
      setSpectatorMode,
      spectatorDelay,
      setSpectatorDelay,
      cameraLockId,
      setCameraLockId,
      auditLogs,
      setAuditLogs,
      chatMessages,
      setChatMessages,
      lockStake,
      triggerSettlement,
      matchResult,
      resetPlatform,
      hiddenVaultTarget: PROTOCOL_TREASURY_VAULT_ADDRESS
    }}>
      {children}
    </EscrowContext.Provider>
  );
};

const useEscrow = () => useContext(EscrowContext);

// ============================================================================
// STAGE 02: ACTIVE TELEMETRY CANVAS & SPECTATOR ENGINE
// ============================================================================
const TabMatchActive = () => {
  const {
    players,
    setPlayers,
    spectatorMode,
    setSpectatorMode,
    spectatorDelay,
    setSpectatorDelay,
    cameraLockId,
    setCameraLockId,
    triggerSettlement,
    setAuditLogs
  } = useEscrow();

  const canvasRef = useRef(null);
  const [mapPerspective, setMapPerspective] = useState("GLOBAL"); // GLOBAL, DYNAMIC_HOTSPOT, DIRECT_LOCK
  const [aimingLasers, setAimingLasers] = useState(true);

  // REALTIME PHYSICS LOOP simulation
  useEffect(() => {
    const updateLoop = setInterval(() => {
      setPlayers(prev => prev.map(p => {
        if (p.hp <= 0) return p;

        // Apply boundary friction with random force vector shifts
        let newVx = p.vx + (Math.random() - 0.5) * 1.2;
        let newVy = p.vy + (Math.random() - 0.5) * 1.2;
        
        // Hard physics clamp: velocity cap (v <= v_max) where v_max = 14.5 units/sec
        const speed = Math.sqrt(newVx * newVx + newVy * newVy);
        const vMax = 14.5;
        if (speed > vMax) {
          newVx = (newVx / speed) * vMax;
          newVy = (newVy / speed) * vMax;
        }

        let newX = p.x + newVx;
        let newY = p.y + newVy;

        // Edge collision reflections
        if (newX < 40 || newX > 960) {
          newVx = -newVx;
          newX = Math.max(40, Math.min(960, newX));
        }
        if (newY < 40 || newY > 560) {
          newVy = -newVy;
          newY = Math.max(40, Math.min(560, newY));
        }

        const deltaAngle = (p.angle + (Math.random() - 0.5) * 25) % 360;
        const triggerActiveShot = Math.random() > 0.88;
        let finalHp = p.hp;

        if (triggerActiveShot && Math.random() > 0.75) {
          finalHp = Math.max(0, p.hp - Math.floor(Math.random() * 20));
          if (finalHp === 0) {
            playNexusSound('error');
          } else {
            playNexusSound('radar');
          }
        }

        return {
          ...p,
          x: newX,
          y: newY,
          vx: newVx,
          vy: newVy,
          angle: deltaAngle,
          action: triggerActiveShot ? "SHOOT" : "RUN",
          hp: finalHp
        };
      }));
    }, 60);

    return () => clearInterval(updateLoop);
  }, [setPlayers]);

  // RENDERING TELEMETRY PIPELINE (60FPS immediate-mode 2D Canvas)
  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let frameId;

    const paint = () => {
      // 1. Dark Void grid initialization
      ctx.fillStyle = '#040508';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = 'rgba(6, 182, 212, 0.04)';
      ctx.lineWidth = 1;
      const step = 40;
      for (let x = 0; x < canvas.width; x += step) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += step) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }

      // Draw perimeter barriers
      ctx.strokeStyle = 'rgba(6, 182, 212, 0.2)';
      ctx.lineWidth = 2;
      ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);

      // Perspective adjustments
      let translationX = 0;
      let translationY = 0;
      if (mapPerspective === "DIRECT_LOCK" && cameraLockId) {
        const lockedPlayer = players.find(p => p.id === cameraLockId);
        if (lockedPlayer) {
          translationX = canvas.width / 2 - lockedPlayer.x;
          translationY = canvas.height / 2 - lockedPlayer.y;
        }
      }

      ctx.save();
      ctx.translate(translationX, translationY);

      const massiveScaleActive = players.length > 12;

      players.forEach(p => {
        if (p.hp <= 0) {
          // Render terminal footprint vector (dead operator)
          ctx.strokeStyle = 'rgba(239, 68, 68, 0.15)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(p.x - 8, p.y - 8); ctx.lineTo(p.x + 8, p.y + 8);
          ctx.moveTo(p.x + 8, p.y - 8); ctx.lineTo(p.x - 8, p.y + 8);
          ctx.stroke();
          return;
        }

        if (massiveScaleActive) {
          // Render compressed tactical points to optimize performance
          ctx.beginPath();
          ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
          ctx.fillStyle = p.team === 'Alpha' ? '#06b6d4' : '#c084fc';
          ctx.fill();
        } else {
          ctx.save();
          ctx.translate(p.x, p.y);

          const rad = (p.angle * Math.PI) / 180;

          // AIMING RADIAL VECTORS
          if (aimingLasers) {
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(Math.cos(rad) * 80, Math.sin(rad) * 80);
            ctx.strokeStyle = p.action === "SHOOT" ? 'rgba(239, 68, 68, 0.85)' : 'rgba(34, 211, 238, 0.3)';
            ctx.lineWidth = p.action === "SHOOT" ? 2.5 : 1;
            ctx.stroke();

            // Intercept aiming dot indicator
            if (p.action === "SHOOT") {
              ctx.beginPath();
              ctx.arc(Math.cos(rad) * 80, Math.sin(rad) * 80, 3, 0, Math.PI * 2);
              ctx.fillStyle = '#ef4444';
              ctx.fill();
            }
          }

          // Tactical vector representation (Sleek circle)
          ctx.beginPath();
          ctx.arc(0, 0, 10, 0, Math.PI * 2);
          ctx.fillStyle = p.isSelf ? '#10b981' : p.team === 'Alpha' ? '#06b6d4' : '#8b5cf6';
          ctx.fill();
          ctx.lineWidth = 1.5;
          ctx.strokeStyle = '#ffffff';
          ctx.stroke();

          // HP Meter overlay
          ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
          ctx.fillRect(-15, -18, 30, 4);
          ctx.fillStyle = p.hp > 45 ? '#10b981' : p.hp > 20 ? '#f59e0b' : '#ef4444';
          ctx.fillRect(-15, -18, (p.hp / 100) * 30, 4);

          // Operator handle callouts
          ctx.font = "9px 'Share Tech Mono'";
          ctx.fillStyle = '#f1f5f9';
          ctx.textAlign = 'center';
          ctx.fillText(p.handle, 0, -22);

          ctx.restore();
        }
      });

      ctx.restore();
      frameId = requestAnimationFrame(paint);
    };

    paint();
    return () => cancelAnimationFrame(frameId);
  }, [players, mapPerspective, cameraLockId, aimingLasers]);
