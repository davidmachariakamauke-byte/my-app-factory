<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AETHERIS V8 // Decentralized Gaming Escrow</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            bg: '#030712',
                            card: '#0b0f19',
                            border: '#1e293b',
                            cyan: '#06b6d4',
                            green: '#10b981',
                            neon: '#22d3ee',
                            purple: '#8b5cf6'
                        }
                    },
                    fontFamily: {
                        orbitron: ['Orbitron', 'sans-serif'],
                        rajdhani: ['Rajdhani', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- Ethers.js v6 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <!-- React 18 & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body {
            background-color: #030712;
            color: #f3f4f6;
            font-family: 'Rajdhani', sans-serif;
        }
        .font-cyber {
            font-family: 'Orbitron', sans-serif;
        }
        .glass-panel {
            background: rgba(11, 15, 25, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(6, 182, 212, 0.2);
            box-shadow: 0 0 25px rgba(6, 182, 212, 0.05);
        }
        .glass-panel-active {
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(6, 182, 212, 0.5);
            box-shadow: 0 0 35px rgba(6, 182, 212, 0.15);
        }
        .cyber-glow {
            text-shadow: 0 0 10px rgba(6, 182, 212, 0.6);
        }
        .cyber-button {
            position: relative;
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.2), rgba(139, 92, 246, 0.2));
            border: 1px solid #06b6d4;
            transition: all 0.3s ease;
        }
        .cyber-button:hover {
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.4), rgba(139, 92, 246, 0.4));
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.6);
            border-color: #22d3ee;
        }
        /* Radar Animation */
        @keyframes radar-sweep {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .radar-sweep {
            animation: radar-sweep 4s linear infinite;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #030712;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #06b6d4;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <div id="root" class="flex-1 flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Protocol Constant
        const TREASURY_ADDRESS = "0xe69aE274c4D814fDB312120d3db1C5c2BD63a071";

        function App() {
            const [walletAddress, setWalletAddress] = useState(null);
            const [provider, setProvider] = useState(null);
            const [stakeAmount, setStakeAmount] = useState("0.05");
            const [matchId, setMatchId] = useState(null);
            const [urlMatchId, setUrlMatchId] = useState(null);
            const [matchState, setMatchState] = useState("DISCONNECTED"); // DISCONNECTED, CREATED, JOINED, LOCKED, SETTLED
            const [terminalLogs, setTerminalLogs] = useState([]);
            const [ws, setWs] = useState(null);
            const [isCreator, setIsCreator] = useState(true);
            const [roomData, setRoomData] = useState({ creator: null, challenger: null, status: "IDLE" });

            // Check URL parameters on load
            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const mId = params.get('match');
                if (mId) {
                    setUrlMatchId(mId);
                    setIsCreator(false);
                    setMatchId(mId);
                    addLog(`[ROUTER] Detected incoming challenger link for match ID: ${mId}`);
                }
            }, []);

            const addLog = (msg) => {
                const timestamp = new Date().toLocaleTimeString();
                setTerminalLogs(prev => [...prev, `[${timestamp}] ${msg}`]);
            };

            // Connect Wallet Function using Ethers.js v6
            const connectWallet = async () => {
                if (!window.ethereum) {
                    alert("MetaMask or Web3 Wallet not detected! Please install a browser wallet.");
                    addLog("[ERROR] Web3 Provider not found in window object.");
                    return;
                }

                try {
                    addLog("[WEB3] Requesting wallet authentication...");
                    const ethersProvider = new ethers.BrowserProvider(window.ethereum);
                    const accounts = await ethersProvider.send("eth_requestAccounts", []);
                    const signer = await ethersProvider.getSigner();
                    const address = await signer.getAddress();

                    setProvider(ethersProvider);
                    setWalletAddress(address);
                    addLog(`[AUTH SUCCESS] Wallet connected: ${address.substring(0, 6)}...${address.substring(38)}`);
                    addLog(`[FEE ROUTE] Protocol Treasury Configured: ${TREASURY_ADDRESS.substring(0, 6)}...`);
                } catch (err) {
                    console.error(err);
                    addLog(`[AUTH ERROR] ${err.message || "User rejected connection"}`);
                }
            };

            // Initialize WebSocket simulation & Real-time Sync
            useEffect(() => {
                if (!matchId) return;

                addLog(`[NETWORK] Establishing secure WebSocket tunnel to /ws/match/${matchId}`);
                
                // Simulating robust FastAPI WebSocket behavior locally for seamless frontend rendering
                // In production backend: connects to ws://domain.com/ws/match/{match_id}
                const simulateWs = {
                    send: (data) => {
                        const parsed = JSON.parse(data);
                        addLog(`[WS OUT] Sent payload type: ${parsed.event}`);
                        
                        // Mocking backend responses
                        setTimeout(() => {
                            if (parsed.event === "CREATE_MATCH") {
                                setMatchState("CREATED");
                                setRoomData(prev => ({ ...prev, creator: walletAddress, status: "WAITING_FOR_CHALLENGER" }));
                                addLog(`[AI REFEREE] Match room initialized on blockchain escrow rail.`);
                                addLog(`[AI REFEREE] Memory buffer scanned. Zero anomalies detected.`);
                            } else if (parsed.event === "JOIN_MATCH") {
                                setMatchState("LOCKED");
                                setRoomData(prev => ({ ...prev, challenger: walletAddress, status: "MATCH_LOCKED" }));
                                addLog(`[ESCROW] Challenger locked stake. Funds pooled securely.`);
                                addLog(`[PROTOCOL] 2.5% Rake routed directly to treasury ${TREASURY_ADDRESS.substring(0,6)}...`);
                                addLog(`[AI REFEREE] Telemetry live. Match session active!`);
                            }
                        }, 600);
                    }
                };

                setWs(simulateWs);
                setMatchState(isCreator ? "DISCONNECTED" : "JOINED");

                return () => {
                    addLog(`[NETWORK] Closing WebSocket tunnel for match ${matchId}`);
                };
            }, [matchId]);

            // Creator: Generate Match & Invite URL
            const handleCreateMatch = () => {
                if (!walletAddress) {
                    alert("Please connect your Web3 wallet first.");
                    return;
                }
                const newId = 'aetheris-' + Math.random().toString(36.substring(2, 9));
                setMatchId(newId);
                
                // Update URL parameters without reload
                const newUrl = `${window.location.origin}${window.location.pathname}?match=${newId}`;
                window.history.pushState({ path: newUrl }, '', newUrl);

                addLog(`[ESCROW] Initializing smart contract escrow for ${stakeAmount} ETH/USDC...`);
                if (ws) {
                    ws.send(JSON.stringify({ event: "CREATE_MATCH", creator: walletAddress, stake: stakeAmount }));
                }
            };

            // Challenger: Join Match via URL parameter
            const handleJoinMatch = () => {
                if (!walletAddress) {
                    alert("Please connect your Web3 wallet to join.");
                    return;
                }
                addLog(`[ESCROW] Staking ${stakeAmount} ETH/USDC to join match ${urlMatchId}...`);
                if (ws) {
                    ws.send(JSON.stringify({ event: "JOIN_MATCH", challenger: walletAddress, match_id: urlMatchId }));
                }
            };

            const copyInviteLink = () => {
                const link = window.location.href;
                navigator.clipboard.writeText(link);
                alert("Invite link copied to clipboard!");
                addLog("[SYSTEM] Invite link copied to clipboard.");
            };

            return (
                <div className="min-h-screen flex flex-col bg-cyber-bg text-slate-100 font-rajdhani">
                    
                    {/* Header HUD */}
                    <header className="border-b border-cyber-border bg-cyber-card/80 backdrop-blur-md sticky top-0 z-50 px-6 py-4 flex items-center justify-between">
                        <div className="flex items-center space-x-3">
                            <div className="w-4 h-4 bg-cyber-cyan rounded-full animate-ping"></div>
                            <h1 className="font-cyber font-black text-xl md:text-2xl tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyber-cyan via-cyber-green to-cyber-purple cyber-glow">
                                AETHERIS V8 <span className="text-xs px-2 py-0.5 rounded bg-cyber-cyan/10 border border-cyber-cyan text-cyber-cyan ml-2">PROD-CORE</span>
                            </h1>
                        </div>

                        <div className="flex items-center space-x-4">
                            <div className="hidden md:flex flex-col text-right text-xs text-slate-400">
                                <span>TREASURY ROUTE:</span>
                                <span className="font-mono text-cyber-cyan">{TREASURY_ADDRESS.substring(0, 8)}...{TREASURY_ADDRESS.substring(34)}</span>
                            </div>
                            
                            {walletAddress ? (
                                <div className="glass-panel px-4 py-2 rounded-lg flex items-center space-x-2 border-cyber-cyan/50">
                                    <div className="w-2.5 h-2.5 rounded-full bg-cyber-green animate-pulse"></div>
                                    <span className="font-mono text-sm text-cyber-cyan">{walletAddress.substring(0, 6)}...{walletAddress.substring(38)}</span>
                                </div>
                            ) : (
                                <button 
                                    onClick={connectWallet}
                                    className="cyber-button font-cyber text-sm px-5 py-2.5 rounded-lg text-cyber-cyan font-bold tracking-wider uppercase"
                                >
                                    CONNECT WALLET
                                </button>
                            )}
                        </div>
                    </header>

                    {/* Main Workspace */}
                    <main className="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">
                        
                        {/* Left & Center Columns: Gaming Escrow Engine */}
                        <div className="lg:col-span-2 space-y-6">
                            
                            {/* Mission Control Banner */}
                            <div className="glass-panel p-6 rounded-2xl relative overflow-hidden">
                                <div className="absolute -right-10 -bottom-10 w-48 h-48 bg-cyber-cyan/10 rounded-full blur-3xl pointer-events-none"></div>
                                <div className="flex items-center justify-between mb-4">
                                    <span className="text-xs uppercase font-cyber tracking-widest text-cyber-cyan">Decentralized Matchmaking Protocol</span>
                                    <span className="text-xs font-mono px-3 py-1 rounded bg-cyber-green/10 text-cyber-green border border-cyber-green/30">STATUS: {matchState}</span>
                                </div>
                                <h2 className="font-cyber text-2xl md:text-3xl font-bold mb-2">High-Performance Gaming Escrow</h2>
                                <p className="text-slate-400 text-sm md:text-base max-w-xl">
                                    Zero fiat intermediaries. Automated smart contract stake locking, instant peer WebSocket syncing, and trustless AI referee state verification.
                                </p>
                            </div>

                            {/* Dynamic Creator / Challenger Interaction Hub */}
                            <div className="glass-panel p-6 rounded-2xl">
                                {!urlMatchId ? (
                                    /* --- CREATOR MODE --- */
                                    <div className="space-y-6">
                                        <div className="flex items-center justify-between">
                                            <h3 className="font-cyber text-lg font-bold text-cyber-cyan flex items-center gap-2">
                                                <span>⚡</span> CREATOR MODE: INITIALIZE MATCH
                                            </h3>
                                            <span className="text-xs text-slate-400">Step 1 of 2</span>
                                        </div>

                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-xs uppercase font-cyber tracking-wider text-slate-400 mb-2">Stake Amount (USDC / ETH)</label>
                                                <input 
                                                    type="number" 
                                                    value={stakeAmount}
                                                    onChange={(e) => setStakeAmount(e.target.value)}
                                                    className="w-full bg-cyber-bg border border-cyber-border rounded-lg px-4 py-3 text-slate-200 font-mono focus:outline-none focus:border-cyber-cyan transition-colors"
                                                    placeholder="0.05"
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-xs uppercase font-cyber tracking-wider text-slate-400 mb-2">Protocol Fee Rake</label>
                                                <div className="w-full bg-cyber-bg/50 border border-cyber-border rounded-lg px-4 py-3 text-slate-400 font-mono flex items-center justify-between">
                                                    <span>2.5% Auto-Routed</span>
                                                    <span className="text-xs text-cyber-cyan">Treasury Verified</span>
                                                </div>
                                            </div>
                                        </div>

                                        {!matchId ? (
                                            <button 
                                                onClick={handleCreateMatch}
                                                className="w-full cyber-button font-cyber text-base py-4 rounded-xl text-cyber-cyan font-bold tracking-widest uppercase"
                                            >
                                                GENERATE INVITE LINK & LOCK ESCROW
                                            </button>
                                        ) : (
                                            <div className="space-y-4 pt-4 border-t border-cyber-border">
                                                <div className="bg-cyber-bg/80 border border-cyber-cyan/40 p-4 rounded-xl flex items-center justify-between">
                                                    <div className="overflow-hidden mr-4">
                                                        <span className="text-xs uppercase font-cyber text-cyber-cyan block mb-1">Shareable Match URL</span>
                                                        <span className="font-mono text-xs text-slate-300 truncate block">{window.location.origin}/?match={matchId}</span>
                                                    </div>
                                                    <button 
                                                        onClick={copyInviteLink}
                                                        className="px-4 py-2 bg-cyber-cyan/20 border border-cyber-cyan rounded-lg text-cyber-cyan text-xs font-cyber hover:bg-cyber-cyan/40 transition-all shrink-0"
                                                    >
                                                        COPY LINK
                                                    </button>
                                                </div>
                                                <div className="text-center text-sm text-slate-400 animate-pulse">
                                                    Waiting for challenger to join via invite link...
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                ) : (
                                    /* --- CHALLENGER MODE --- */
                                    <div className="space-y-6">
                                        <div className="flex items-center justify-between">
                                            <h3 className="font-cyber text-lg font-bold text-cyber-green flex items-center gap-2">
                                                <span>🛡️</span> CHALLENGER MODE: MATCH INVITATION DETECTED
                                            </h3>
                                            <span className="text-xs font-mono text-cyber-green bg-cyber-green/10 px-2 py-1 rounded">ID: {urlMatchId}</span>
                                        </div>

                                        <div className="p-4 rounded-xl bg-cyber-bg/60 border border-cyber-border space-y-3">
                                            <div className="flex justify-between text-sm">
                                                <span className="text-slate-400">Match Creator:</span>
                                                <span className="font-mono text-cyber-cyan">0x71C...3a92</span>
                                            </div>
                                            <div className="flex justify-between text-sm">
                                                <span className="text-slate-400">Required Stake:</span>
                                                <span className="font-mono text-slate-100">0.05 ETH / USDC</span>
                                            </div>
                                            <div className="flex justify-between text-sm">
                                                <span className="text-slate-400">Protocol Rake:</span>
                                                <span className="font-mono text-slate-100">2.5% (Direct to Treasury)</span>
                                            </div>
                                        </div>

                                        <button 
                                            onClick={handleJoinMatch}
                                            className="w-full bg-gradient-to-r from-cyber-green to-cyber-cyan hover:opacity-90 font-cyber text-base py-4 rounded-xl text-slate-950 font-extrabold tracking-widest uppercase transition-all shadow-lg shadow-cyber-green/20"
                                        >
                                            MATCH STAKE & JOIN ESCROW
                                        </button>
                                    </div>
                                )}
                            </div>

                            {/* Telemetry & AI Referee Visualizer */}
                            <div className="glass-panel p-6 rounded-2xl grid grid-cols-1 md:grid-cols-2 gap-6 items-center">
                                <div className="space-y-4">
                                    <h3 className="font-cyber text-base font-bold text-cyber-cyan flex items-center gap-2">
                                        <span>📡</span> AI REFEREE TELEMETRY
                                    </h3>
                                    <p className="text-sm text-slate-400">
                                        Real-time state scanning evaluates packet authenticity and player latency. Zero manual photo uploads required. Fully decentralized memory buffer validation.
                                    </p>
                                    <div className="space-y-2 text-xs font-mono">
                                        <div className="flex justify-between p-2 rounded bg-cyber-bg border border-cyber-border">
                                            <span className="text-slate-400">BUFFER INTEGRITY:</span>
                                            <span className="text-cyber-green">100% SECURE</span>
                                        </div>
                                        <div className="flex justify-between p-2 rounded bg-cyber-bg border border-cyber-border">
                                            <span className="text-slate-400">LATENCY RAIL:</span>
                                            <span className="text-cyber-cyan">14ms (OPTIMAL)</span>
                                        </div>
                                    </div>
                                </div>

                                <div className="relative flex items-center justify-center h-48 bg-cyber-bg/80 rounded-xl border border-cyber-border overflow-hidden">
                                    {/* Radar Scanner Animation */}
                                    <div className="absolute w-36 h-36 rounded-full border border-cyber-cyan/30 flex items-center justify-center">
                                        <div className="absolute w-24 h-24 rounded-full border border-cyber-cyan/50 flex items-center justify-center">
                                            <div className="absolute w-12 h-12 rounded-full border border-cyber-cyan"></div>
                                        </div>
                                        <div className="absolute w-full h-0.5 bg-gradient-to-r from-transparent via-cyber-cyan to-transparent radar-sweep origin-center"></div>
                                    </div>
                                    <div className="absolute bottom-2 font-mono text-[10px] text-cyber-cyan tracking-widest uppercase animate-pulse">
                                        AI Memory Buffer Scanning...
                                    </div>
                                </div>
                            </div>

                        </div>

                        {/* Right Column: Neural Console Terminal */}
                        <div className="glass-panel p-5 rounded-2xl flex flex-col h-[580px] lg:h-full">
                            <div className="flex items-center justify-between pb-3 mb-3 border-b border-cyber-border">
                                <h3 className="font-cyber text-sm font-bold text-cyber-cyan flex items-center gap-2">
                                    <span className="w-2 h-2 rounded-full bg-cyber-cyan animate-ping"></span>
                                    NEURAL CONSOLE TERMINAL
                                </h3>
                                <span className="text-[10px] font-mono text-slate-400">WS-STREAM v8.2</span>
                            </div>

                            <div className="flex-1 bg-cyber-bg/90 rounded-xl border border-cyber-border p-4 font-mono text-xs overflow-y-auto space-y-2">
                                <div className="text-slate-500">[SYSTEM] Aetheris V8 Core Initialized.</div>
                                <div className="text-slate-500">[SYSTEM] Treasury Route locked: {TREASURY_ADDRESS.substring(0, 10)}...</div>
                                {terminalLogs.map((log, index) => (
                                    <div key={index} className="text-cyber-cyan leading-relaxed">{log}</div>
                                ))}
                            </div>

                            <div className="mt-4 pt-3 border-t border-cyber-border flex items-center justify-between text-[11px] text-slate-400 font-mono">
                                <span>SOCKET: ACTIVE</span>
                                <span className="text-cyber-green">PROTOCOL SECURE</span>
                            </div>
                        </div>

                    </main>

                    {/* Footer */}
                    <footer className="border-t border-cyber-border bg-cyber-card/50 py-4 px-6 text-center text-xs text-slate-500 font-mono">
                        AETHERIS V8 DECENTRALIZED GAMING PROTOCOL &bull; ALL RIGHTS RESERVED &bull; TREASURY: <span className="text-slate-400">{TREASURY_ADDRESS}</span>
                    </footer>

                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
