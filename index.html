// SYNTHESIZED HD SPATIAL AUDIO SYSTEM (Zero External Dependencies)
const playVIPSound = function(type, frequencyOverride = null) {
    try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();
        if (!ctx) return;
        
        const masterGain = ctx.createGain();
        masterGain.connect(ctx.destination);
        
        const now = ctx.currentTime;
        
        if (type === 'tick') {
            const osc = ctx.createOscillator();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(frequencyOverride || 800, now);
            masterGain.gain.setValueAtTime(0.01, now);
            masterGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.05);
            osc.connect(masterGain);
            osc.start(now);
            osc.stop(now + 0.05);
        } else if (type === 'laser') {
            const osc = ctx.createOscillator();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(1200, now);
            osc.frequency.exponentialRampToValueAtTime(300, now + 0.15);
            masterGain.gain.setValueAtTime(0.03, now);
            masterGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.15);
            osc.connect(masterGain);
            osc.start(now);
            osc.stop(now + 0.15);
        } else if (type === 'impact') {
            const osc = ctx.createOscillator();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(80, now);
            osc.frequency.exponentialRampToValueAtTime(30, now + 0.3);
            masterGain.gain.setValueAtTime(0.15, now);
            masterGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.3);
            osc.connect(masterGain);
            osc.start(now);
            osc.stop(now + 0.3);
        } else if (type === 'win') {
            const notes = [523.25, 659.25, 783.99, 1046.50]; // Beautiful C Major Arpeggio
            notes.forEach((freq, idx) => {
                const osc = ctx.createOscillator();
                const noteGain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, now + idx * 0.07);
                noteGain.gain.setValueAtTime(0.04, now + idx * 0.07);
                noteGain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.07 + 0.25);
                osc.connect(noteGain);
                noteGain.connect(ctx.destination);
                osc.start(now + idx * 0.07);
                osc.stop(now + idx * 0.07 + 0.25);
            });
        } else if (type === 'lose') {
            const osc = ctx.createOscillator();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, now);
            osc.frequency.linearRampToValueAtTime(60, now + 0.35);
            masterGain.gain.setValueAtTime(0.05, now);
            masterGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);
            osc.connect(masterGain);
            osc.start(now);
            osc.stop(now + 0.35);
        } else if (type === 'shatter') {
            // White noise burst
            const bufferSize = ctx.sampleRate * 0.2;
            const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }
            const noise = ctx.createBufferSource();
            noise.buffer = buffer;
            const filter = ctx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.value = 1000;
            noise.connect(filter);
            filter.connect(masterGain);
            masterGain.gain.setValueAtTime(0.08, now);
            masterGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.2);
            noise.start(now);
            noise.stop(now + 0.2);
        }
    } catch (e) {
        // Safe fallback for browsers blocking audio
    }
};

// PREMIUM MULTI-GAME PLATFORM ADAPTER FOR ALL 10 VIP EXPERIENCE MODES
function AetherVipGameEngine({ 
    activeGame, 
    wager, 
    userBalance, 
    isLive,

    pMaxLimit, 
    onCompleteSettlement,
    triggerToast
}) {
    const canvasRef = useRef(null);
    const [gameState, setGameState] = useState("IDLE"); // IDLE, RUNNING, COMPLETED
    const [settledResult, setSettledResult] = useState(null); // { won: bool, multiplier: float, cashoutValue: float }
    
    // Game variables simulation states
    const [crashMultiplier, setCrashMultiplier] = useState(1.0);

    const [breakerTargetPosition, setBreakerTargetPosition] = useState(50); // 0 to 100 percentage
    const [breakerXCoordinate, setBreakerXCoordinate] = useState(50);

    // Continuous dynamic drawing pipeline for high frame-rate rendering
    useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let frameId;
        let rotationAngle = 0;
        let animationCounter = 0;

        const executeFrameRender = () => {
            animationCounter += 0.04;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Slate background grid
            ctx.fillStyle = "#060609";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = "rgba(16, 185, 129, 0.03)";
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += 25) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 25) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // MODULAR SCREEN DRAW RENDERING DEPENDING ON VIP SUITE STATE
            if (activeGame === "crash") {
                // Rocket curve drawing with neon trails
                ctx.strokeStyle = "rgba(16, 185, 129, 0.3)";
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(20, canvas.height - 20);
                
                let limitX = canvas.width - 40;
                let limitY = canvas.height - 20;
                ctx.beginPath();
                ctx.moveTo(30, canvas.height - 30);
                for (let t = 0; t <= 100; t++) {
                    const tempX = 30 + (t / 100) * limitX;
                    const tempY = (canvas.height - 30) - Math.pow(t / 100, 2) * (canvas.height - 80) * (gameState === "RUNNING" ? Math.min(2.5, crashMultiplier / 2) : 1);
                    ctx.lineTo(tempX, tempY);
                    if (t === 100) {
                        limitX = tempX;
                        limitY = tempY;
                    }
                }
                ctx.strokeStyle = "#10b981";
                ctx.shadowBlur = 10;
                ctx.shadowColor = "#10b981";
                ctx.stroke();
                ctx.shadowBlur = 0;

                // Draw glowing node
                ctx.fillStyle = "#fbbf24";
                ctx.beginPath();
                ctx.arc(limitX, limitY, 8, 0, Math.PI * 2);
                ctx.fill();

                ctx.font = "16px 'Share Tech Mono'";
                ctx.fillStyle = "#ffffff";
                ctx.fillText(`INDEX MULTIPLIER: ${crashMultiplier.toFixed(2)}x`, 30, 40);
            }
            else if (activeGame === "binary") {
                // Pulsing indicator stream representation
                ctx.strokeStyle = "rgba(255, 255, 255, 0.08)";
                ctx.beginPath();
                ctx.moveTo(0, canvas.height / 2);
                ctx.lineTo(canvas.width, canvas.height / 2);
                ctx.stroke();

                const indicatorY = canvas.height / 2 + Math.sin(animationCounter) * 60;
                ctx.fillStyle = binaryDirection === "HIGH" ? "#10b981" : "#d946ef";
                ctx.shadowBlur = 15;
                ctx.shadowColor = ctx.fillStyle;
                ctx.beginPath();
                ctx.arc(canvas.width / 2, indicatorY, 10, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;

                ctx.font = "14px 'Share Tech Mono'";
                ctx.fillStyle = "#ffffff";
                ctx.fillText(`TRAJECTORY TARGET: ${binaryDirection}`, 30, 40);
            }
            else if (activeGame === "orbit") {
                // Interactive orbital indicator ring
                rotationAngle += 0.03;
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                
                ctx.strokeStyle = "rgba(16, 185, 129, 0.2)";
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(centerX, centerY, 80, 0, Math.PI*2);
                ctx.stroke();

                // Multiplier node locations
                const nodeAngle = rotationAngle;
                const orbX = centerX + Math.cos(nodeAngle) * 80;
                const orbY = centerY + Math.sin(nodeAngle) * 80;

                ctx.fillStyle = "#fbbf24";
                ctx.shadowBlur = 12;
                ctx.shadowColor = "#fbbf24";
                ctx.beginPath();
                ctx.arc(orbX, orbY, 9, 0, Math.PI * 2);

                ctx.shadowBlur = 0;

                ctx.fillStyle = "#a3a3a3";

            }
            else if (activeGame === "slots") {
                // Dynamic holographic slot rollers
                const reelXCoords = [canvas.width / 2 - 80, canvas.width / 2, canvas.width / 2 + 80];

                    ctx.fillStyle = "rgba(255,255,255,0.03)";
                    ctx.strokeStyle = "rgba(255,255,255,0.08)";
                    ctx.fillRect(rx - 30, canvas.height / 2 - 40, 60, 80);
                    ctx.strokeRect(rx - 30, canvas.height / 2 - 40, 60, 80);

                    // Scrolling symbol visual indicator representation
                    ctx.font = "24px 'Plus Jakarta Sans'";
                    ctx.textAlign = "center";
                    ctx.fillStyle = "#10b981";
                    const symbolList = ["💎", "⚡", "🌟", "🔥"];
                    const pickIndex = (gameState === "RUNNING") ? Math.floor(animationCounter * 3 + index) % 4 : index;

            else if (activeGame === "plinko") {

                ctx.fillStyle = "#ffffff";
                for (let r = 1; r <= 6; r++) {

                    for (let c = 0; c < count; c++) {
                        const px = canvas.width / 2 - (count - 1) * 15 + c * 30;
                        const py = 40 + r * 30;
                        ctx.beginPath();
                        ctx.arc(px, py, 2.5, 0, Math.PI*2);
                        ctx.fill();
                    }
                }
                
                // Draw drop particles
                plinkoBalls.forEach(ball => {
                    ctx.fillStyle = "#fbbf24";
                    ctx.beginPath();
                    ctx.arc(ball.x, ball.y, 5, 0, Math.PI*2);
                    ctx.fill();
                });
            }
            else if (activeGame === "wheel") {
                // Interactive multiplier wheel of fortune
                rotationAngle += (gameState === "RUNNING" ? 0.08 : 0.005);
                const wx = canvas.width / 2;
                const wy = canvas.height / 2;
                
                ctx.save();
                ctx.translate(wx, wy);
                ctx.rotate(rotationAngle);
                
                ctx.strokeStyle = "rgba(255,255,255,0.1)";
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, 90, 0, Math.PI*2);
                ctx.stroke();

                for (let s = 0; s < 8; s++) {
                    const angle = s * Math.PI / 4;
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(Math.cos(angle) * 90, Math.sin(angle) * 90);
                    ctx.stroke();
                }
                ctx.restore();

                // Wheel selector pointer
                ctx.fillStyle = "#fbbf24";
                ctx.beginPath();
                ctx.moveTo(wx, wy - 98);
                ctx.lineTo(wx - 10, wy - 110);
                ctx.lineTo(wx + 10, wy - 110);
                ctx.closePath();
                ctx.fill();
            }
            else if (activeGame === "breaker") {
                // Slasher target tracking line
                ctx.strokeStyle = "rgba(255, 255, 255, 0.05)";
                ctx.strokeRect(40, canvas.height / 2 - 20, canvas.width - 80, 40);

                // Draw moving node block
                const tx = 40 + (breakerTargetPosition / 100) * (canvas.width - 80);
                ctx.fillStyle = "#10b981";
                ctx.fillRect(tx - 15, canvas.height / 2 - 15, 30, 30);

                // Draw slider node index
                const sx = 40 + (breakerXCoordinate / 100) * (canvas.width - 80);
                ctx.strokeStyle = "#fbbf24";
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(sx, canvas.height / 2 - 25);
                ctx.lineTo(sx, canvas.height / 2 + 25);
                ctx.stroke();
            }

            frameId = requestAnimationFrame(executeFrameRender);
        };
        executeFrameRender();

        return () => {
            cancelAnimationFrame(frameId);
        };
    }, [activeGame, gameState, crashMultiplier, plinkoBalls, breakerTargetPosition, breakerXCoordinate, binaryDirection]);

                            <button 
                                onClick={startSurgeLadder}
                                className="bg-gradient-to-r from-emerald-400 to-emerald-500 text-neutral-950 py-4 rounded-xl font-syne font-black text-xs uppercase tracking-widest"
                            >
                                START SURGE STEP CLIMBER
                            </button>
                        )}

                        {activeGame === "slots" && (
                            <button 
                                onClick={playHoloSlots}
                                className="bg-gradient-to-r from-emerald-400 to-emerald-500 text-neutral-950 py-4 rounded-xl font-syne font-black text-xs uppercase tracking-widest"
                            >
                                INITIATE HOLOGRAPHIC ROLL
                            </button>
                        )}

                        {activeGame === "plinko" && (
                            <button 
                                onClick={dropPlinkoQuantumBall}
                                className="bg-gradient-to-r from-emerald-400 to-emerald-500 text-neutral-950 py-4 rounded-xl font-syne font-black text-xs uppercase tracking-widest"
                            >
                                DISPATCH DETERMINISTIC QUANTUM NODE
                            </button>
                        )}

                        {activeGame === "flip" && (
                            <button 
                                onClick={executeVelocityFlip}
                                className="bg-gradient-to-r from-emerald-400 to-emerald-500 text-neutral-950 py-4 rounded-xl font-syne font-black text-xs uppercase tracking-widest"
                            >
                                FLIP BINARY VELOCITY ELEMENT
                            </button>
                        )}

                        {activeGame === "wheel" && (
                            <button 
                                onClick={spinCyberWheel}
                                className="bg-gradient-to-r from-emerald-400 to-emerald-500 text-neutral-950 py-4 rounded-xl font-syne font-black text-xs uppercase tracking-widest"
                            >
                                ENGAGE ROTATING VELOCITY INDICES
                            </button>
                        )}

                        {activeGame === "breaker" && (
                            <button 
                                onClick={initiateNodeBreaker}
                                className="bg-gradient-to-r from-emerald-400 to-emerald-500 text-neutral-950 py-4 rounded-xl font-syne font-black text-xs uppercase tracking-widest"
                            >
                                INITIATE TARGET BREAKER BAR
                            </button>
                        )}

                    </div>
                )}

                {/* RUNNING STATE HARDWARE INTERACTIONS */}
                {gameState === "RUNNING" && (
                    <div className="flex flex-col gap-3">
                        {activeGame === "crash" && (
                            <button 
                                onClick={triggerCrashCashout}
                                className="bg-gradient-to-r from-emerald-400 to-emerald-500 text-neutral-950 py-4 rounded-xl font-syne font-black text-xs uppercase tracking-widest animate-pulse"
                            >
                                LIQUIDIZE VALUE AT {crashMultiplier.toFixed(2)}x
                            </button>
                        )}

                        {activeGame === "surge" && (
                            <div className="grid grid-cols-2 gap-4">
                                <button 
                                    onClick={climbSurgeTier}
                                    className="bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 py-4 rounded-xl font-syne font-black text-xs uppercase tracking-widest"
                                >
                                    CLIMB TO TIER {ladderTier + 1}
                                </button>
                                <button 
                                    onClick={triggerLadderCashout}
                                    className="bg-zinc-900 text-white py-4 rounded-xl font-syne font-black text-xs uppercase tracking-widest"
                                >
                                    CLAIM YIELD {(1.00 + (ladderTier * 0.70)).toFixed(2)}x
                                </button>
                            </div>
                        )}

                        {activeGame === "breaker" && (
                            <button 
                                onClick={captureSlasherInterceptNode}
                                className="bg-gradient-to-r from-emerald-400 to-emerald-500 text-neutral-950 py-4 rounded-xl font-syne font-black text-xs uppercase tracking-widest"
                            >
                                SLICE INTERCEPT POINT NOW
                            </button>
                        )}

                        {activeGame !== "crash" && activeGame !== "surge" && activeGame !== "breaker" && (
                            <p className="text-center text-xs font-mono text-zinc-500 py-3 animate-pulse uppercase tracking-widest">
                                Calculating server-side parameters in secure queue...
                            </p>
                        )}
                    </div>
                )}
            </div>

        </div>
    );
}
