const playSoundEffect = function(type, pitchModifier = 1.0) {
    try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();
        if (!ctx) return;
        
        const masterGain = ctx.createGain();
        masterGain.connect(ctx.destination);
        
        if (type === 'tick') {
            const osc = ctx.createOscillator();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600 * pitchModifier, ctx.currentTime);
            masterGain.gain.setValueAtTime(0.015, ctx.currentTime);
            masterGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);
            osc.connect(masterGain);
            osc.start();
            osc.stop(ctx.currentTime + 0.04);
        } else if (type === 'hit') {
            const osc = ctx.createOscillator();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(220 * pitchModifier, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(880 * pitchModifier, ctx.currentTime + 0.12);
            masterGain.gain.setValueAtTime(0.06, ctx.currentTime);
            masterGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
            osc.connect(masterGain);
            osc.start();
            osc.stop(ctx.currentTime + 0.12);
        } else if (type === 'squad') {
            const chord = [261.63, 329.63, 392.00, 523.25];
            chord.forEach((freq, idx) => {
                const o = ctx.createOscillator();
                const g = ctx.createGain();
                o.connect(g);
                g.connect(masterGain);
                o.type = 'sine';
                o.frequency.setValueAtTime(freq * pitchModifier, ctx.currentTime + idx * 0.04);
                g.gain.setValueAtTime(0.02, ctx.currentTime + idx * 0.04);
                g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.04 + 0.2);
                o.start(ctx.currentTime + idx * 0.04);
                o.stop(ctx.currentTime + idx * 0.04 + 0.2);
            });
        } else if (type === 'win') {
            const baseFreq = 523.25 * pitchModifier;
            const sequence = [baseFreq, baseFreq * 1.2, baseFreq * 1.5, baseFreq * 2.0];
            sequence.forEach((freq, idx) => {
                const o = ctx.createOscillator();
                const g = ctx.createGain();
                o.connect(g);
                g.connect(masterGain);
                o.type = 'triangle';
                o.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.06);
                g.gain.setValueAtTime(0.035, ctx.currentTime + idx * 0.06);
                g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.06 + 0.25);
                o.start(ctx.currentTime + idx * 0.06);
                o.stop(ctx.currentTime + idx * 0.06 + 0.25);
            });
        } else if (type === 'fail') {
            const osc = ctx.createOscillator();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(140, ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(50, ctx.currentTime + 0.25);
            masterGain.gain.setValueAtTime(0.05, ctx.currentTime);
            masterGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
            osc.connect(masterGain);
            osc.start();
            osc.stop(ctx.currentTime + 0.25);
        }
    } catch (e) {
        // Audio execution bypass for secure environments
    }
};

                            </button>
                        )}

                        {activeGame === "orbit" && (
                            <button 
                                onClick={lockOrbitIntersection}
                                className="bg-cyan-500 hover:bg-cyan-400 text-slate-950 py-3 rounded-xl font-grotesk font-black text-xs uppercase tracking-widest transition-all"
                            >
                                LOCK INTERSECT METRICS
                            </button>
                        )}

                        {activeGame === "ladder" && (
                            <button 
                                onClick={startGridLadder}
                                className="bg-cyan-500 hover:bg-cyan-400 text-slate-950 py-3 rounded-xl font-grotesk font-black text-xs uppercase tracking-widest transition-all"
                            >
                                START MULTI-TIER ESCALATOR
                            </button>
                        )}

                        {activeGame === "wheel" && (
                            <button 
                                onClick={spinHyperWheel}
                                className="bg-gradient-to-r from-cyan-500 via-indigo-600 to-fuchsia-500 text-slate-950 py-3 rounded-xl font-grotesk font-black text-xs uppercase tracking-widest transition-all"
                            >
                                INITIATE ROTATION MECHANICS
                            </button>
                        )}

                        {activeGame === "breaker" && (
                            <button 
                                onClick={breakSequencedTile}
                                className="bg-cyan-500 hover:bg-cyan-400 text-slate-950 py-3 rounded-xl font-grotesk font-black text-xs uppercase tracking-widest transition-all"
                            >
                                DETONATE GLOW NODES
                            </button>
                        )}

                    </div>
                )}

                {/* GAME ACTIVE SECONDARY INTERACTION LAYERS */}
                {gameState === "ACTIVE" && (
                    <div className="flex flex-col gap-2">
                        {activeGame === "crash" && (
                            <button 
                                onClick={cashoutQuantumCrash}
                                className="bg-fuchsia-600 hover:bg-fuchsia-500 text-white py-3.5 rounded-xl font-grotesk font-black text-xs uppercase tracking-widest animate-pulse"
                            >
                                LIQUIDIZE VALUE AT {currentTickerMultiplier.toFixed(2)}x
                            </button>
                        )}

                        {activeGame === "ladder" && (
                            <div className="grid grid-cols-2 gap-3">
                                <button 
                                    onClick={climbLadderStep}
                                    className="bg-cyan-500 hover:bg-cyan-400 text-slate-950 py-3 rounded-xl font-grotesk font-black text-xs uppercase tracking-widest"
                                >
                                    CLIMB TO TIER {ladderStep + 1}
                                </button>
                                <button 
                                    onClick={cashoutLadderStep}
                                    className="bg-slate-900 hover:bg-slate-800 text-white py-3 rounded-xl font-grotesk font-black text-xs uppercase tracking-widest"
                                >
                                    CLAIM YIELD {(1.0 + (ladderStep * 0.8)).toFixed(1)}x
                                </button>
                            </div>
                        )}

                        {activeGame !== "crash" && activeGame !== "ladder" && (
                            <p className="text-center text-xs font-mono text-slate-500 py-2 animate-pulse uppercase tracking-wider">
                                Collateral calculations running in background processes...
                            </p>
                        )}
                    </div>
                )}
            </div>

        </div>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
