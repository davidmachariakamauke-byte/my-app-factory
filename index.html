// Injected Web Audio Synth for ultimate immersive cyberpunk interaction
const playSound = (type) => {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'click') {
            osc.frequency.setValueAtTime(800, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.05, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
            osc.start();
            osc.stop(ctx.currentTime + 0.08);
        } else if (type === 'warning') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(450, ctx.currentTime + 0.15);
            osc.frequency.linearRampToValueAtTime(150, ctx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
            osc.start();
            osc.stop(ctx.currentTime + 0.3);
        } else if (type === 'success') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
            osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1); // E5
            osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2); // G5
            osc.frequency.setValueAtTime(1046.50, ctx.currentTime + 0.3); // C6
            gain.gain.setValueAtTime(0.08, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.45);
            osc.start();
            osc.stop(ctx.currentTime + 0.5);
        } else if (type === 'scan') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(1000, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.4);
            gain.gain.setValueAtTime(0.03, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
            osc.start();
            osc.stop(ctx.currentTime + 0.4);
        }
    } catch (e) {
        // Fallback if browser blocks audio autoplay/contexts
    }
};

// Raw content templates
const SOLIDITY_CONTRACT_CODE = `// SPDX-License-Identifier: MIT
pragma solidity ^0.8.20;

/**
 * @title Project Epic: Decentralized AI Referee Gaming Escrow
 * @notice Combines AI telemetry Oracle signature verification with Uniswap Multi-Asset swapping.
 * @dev Enforces automated platform fee extraction on payouts.
 */

interface ISwapRouter {
    struct ExactInputSingleParams {
        address tokenIn;
        address tokenOut;
        uint24 fee;
        address recipient;
        uint256 deadline;
        uint256 amountIn;
        uint256 amountOutMinimum;
        uint160 sqrtPriceLimitX96;
    }
    function exactInputSingle(ExactInputSingleParams calldata params) external payable returns (uint256 amountOut);
}

interface IERC20 {
    function transfer(address to, uint256 amount) external returns (bool);
    function transferFrom(address from, address to, uint256 amount) external returns (bool);
    function balanceOf(address account) external view returns (uint256);
    function approve(address spender, uint256 amount) external returns (bool);
}

contract EpicGamingEscrow {
    // Platform Fee Direct Wallet Destination (Base Layer-2)
    address public constant FEE_ADDRESS = 0xe69aE274c4D814fDB312120d3db1C5c2BD63a071;
    uint256 public constant FEE_BPS = 250; // 2.5% fee

    address public oracle;
    address public constant USDC = 0x833589fCD6eDb6E08f4c7C32D4f71b54bda02913; // Base USDC address
    ISwapRouter public immutable swapRouter;

    struct Match {
        address player1;
        address player2;
        uint256 lockedUsdc;
        bool active;
        bool settled;
    }

    mapping(bytes32 => Match) public matches;
    mapping(address => bool) public supportedTokens;

    event MatchStaked(bytes32 indexed matchId, address indexed player, uint256 usdcAmount);
    event MatchSettled(bytes32 indexed matchId, address indexed winner, uint256 winnerPayout, uint256 platformFee);
    event CheatEnforced(bytes32 indexed matchId, address indexed cheater, address indexed victim, uint256 payout);

    modifier onlyOracle() {
        require(msg.sender == oracle, "Error: caller must be Authorized AI Referee Oracle");
        _;
    }

    constructor(address _oracle, address _swapRouter) {
        oracle = _oracle;
        swapRouter = ISwapRouter(_swapRouter);
    }

    /**
     * @notice Stakes standard ERC20 token or Native ETH, auto-swaps to USDC via Uniswap v3 & locks in Escrow pool.
     */
    function stakeAndSwap(
        bytes32 matchId,
        address opponent,
        address tokenIn,
        uint256 amountIn,
        uint24 poolFee,
        uint256 minUsdcOut
    ) external payable {
        require(opponent != address(0), "Invalid opponent");
        uint256 usdcReceived;

        if (tokenIn == address(0)) {
            // Swap Native ETH to USDC
            require(msg.value == amountIn, "ETH amount mismatch");
            usdcReceived = swapRouter.exactInputSingle{value: msg.value}(
                ISwapRouter.ExactInputSingleParams({
                    tokenIn: 0x4200000000000000000000000000000000000006, // WETH on Base
                    tokenOut: USDC,
                    fee: poolFee,
                    recipient: address(this),
                    deadline: block.timestamp + 300,
                    amountIn: amountIn,
                    amountOutMinimum: minUsdcOut,
                    sqrtPriceLimitX96: 0
                })
            );
        } else {
            // Transfer ERC20 from user and Swap to USDC
            IERC20(tokenIn).transferFrom(msg.sender, address(this), amountIn);
            IERC20(tokenIn).approve(address(swapRouter), amountIn);
            
            usdcReceived = swapRouter.exactInputSingle(
                ISwapRouter.ExactInputSingleParams({
                    tokenIn: tokenIn,
                    tokenOut: USDC,
                    fee: poolFee,
                    recipient: address(this),
                    deadline: block.timestamp + 300,
                    amountIn: amountIn,
                    amountOutMinimum: minUsdcOut,
                    sqrtPriceLimitX96: 0
                })
            );
        }

        Match storage m = matches[matchId];
        if (!m.active) {
            m.player1 = msg.sender;
            m.player2 = opponent;
            m.active = true;
        }
        
        m.lockedUsdc += usdcReceived;
        emit MatchStaked(matchId, msg.sender, usdcReceived);
    }

    /**
     * @notice Oracle triggers instant payout to the verified winner.
     * @dev Automatically extracts platform fee directly to the specified platform wallet.
     */
    function executePayout(
        bytes32 matchId,
        address winner,
        bytes calldata signature
    ) external onlyOracle {
        Match storage m = matches[matchId];
        require(m.active && !m.settled, "Match not active or already settled");
        require(winner == m.player1 || winner == m.player2, "Winner must be a player");

        m.settled = true;
        m.active = false;

        uint256 totalPool = m.lockedUsdc;
        uint256 feeAmount = (totalPool * FEE_BPS) / 10000;
        uint256 winnerPayout = totalPool - feeAmount;

        // Execute automated fee transfer
        IERC20(USDC).transfer(FEE_ADDRESS, feeAmount);
        // Execute winner payout
        IERC20(USDC).transfer(winner, winnerPayout);

        emit MatchSettled(matchId, winner, winnerPayout, feeAmount);
    }

    /**
     * @notice Enforce zero-tolerance instant payout adjustment if telemetry detects execution cheats.
     */
    function enforceAntiCheatShutdown(
        bytes32 matchId,
        address cheater,
        bytes calldata signature
    ) external onlyOracle {
        Match storage m = matches[matchId];
        require(m.active && !m.settled, "Match state cannot be adjusted");
        address honestPlayer = (cheater == m.player1) ? m.player2 : m.player1;

        m.settled = true;
        m.active = false;

        uint256 totalPool = m.lockedUsdc;
        uint256 feeAmount = (totalPool * FEE_BPS) / 10000;
        uint256 winnerPayout = totalPool - feeAmount;

        // Punish cheater, award clean player fully minus service fee
        IERC20(USDC).transfer(FEE_ADDRESS, feeAmount);
        IERC20(USDC).transfer(honestPlayer, winnerPayout);

        emit CheatEnforced(matchId, cheater, honestPlayer, winnerPayout);
    }
}`;

                setPing(Math.floor(Math.random() * 5) + 15);
                setFps(Math.floor(Math.random() * 10) + 130);
                setPackLoss(Math.floor(Math.random() * 2));

                                "bg-[#1F2833]/80 border-[#66FCF1]/40 border"
