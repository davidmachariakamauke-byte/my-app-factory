import logging
from fastapi import FastAPI, WebSocket, WebSocketDisconnect
from fastapi.middleware.cors import CORSMiddleware
from pydantic import BaseModel
from typing import Dict, List, Any

logging.basicConfig(level=logging.INFO)
logger = logging.getLogger("AetherisV8")

app = FastAPI(
    title="Aetheris V8 Core Engine",
    description="Decentralized High-Performance Competitive Gaming Escrow Sync",
    version="8.0.0"
)

app.add_middleware(
    CORSMiddleware,
    allow_origins=["*"],
    allow_credentials=True,
    allow_methods=["*"],
    allow_headers=["*"],
)

class ConnectionManager:
    def __init__(self):
        self.active_connections: Dict[str, List[WebSocket]] = {}
        self.room_states: Dict[str, Dict[str, Any]] = {}

    async def connect(self, websocket: WebSocket, match_id: str):
        await websocket.accept()
        if match_id not in self.active_connections:
            self.active_connections[match_id] = []
        self.active_connections[match_id].append(websocket)
        logger.info(f"WebSocket link synchronized for room: {match_id}")

    def disconnect(self, websocket: WebSocket, match_id: str):
        if match_id in self.active_connections:
            if websocket in self.active_connections[match_id]:
                self.active_connections[match_id].remove(websocket)
            if not self.active_connections[match_id]:
                del self.active_connections[match_id]
                # Cleanup idle rooms from memory to protect bandwidth
                if match_id in self.room_states:
                    del self.room_states[match_id]
        logger.info(f"WebSocket link terminated for room: {match_id}")

    async def broadcast(self, match_id: str, message: dict):
        if match_id in self.active_connections:
            for connection in self.active_connections[match_id]:
                try:
                    await connection.send_json(message)
                except Exception as e:
                    logger.error(f"Failed broadcasting payload to active peer: {e}")

manager = ConnectionManager()

@app.get("/api/v8/room/{match_id}")
async def get_room_state(match_id: str):
    state = manager.room_states.get(match_id, {
        "match_id": match_id,
        "status": "IDLE",
        "creator": None,
        "challenger": None,
        "stake": "0.00",
        "fee_routed": False
    })
    return {"status": "SUCCESS", "room": state}

@app.websocket("/ws/match/{match_id}")
async def websocket_endpoint(websocket: WebSocket, match_id: str):
    await manager.connect(websocket, match_id)

                manager.room_states[match_id] = {
                    "match_id": match_id,

                    "stake": f"{stake} ETH",
                    "status": "WAITING_FOR_CHALLENGER",

                    "type": "SYS",
                    "message": f"Escrow session locked into dynamic pool. Stake parameter set: {stake} ETH.",
                    "room_update": manager.room_states[match_id]
                })

            elif event_type == "JOIN_ROOM":
                challenger = event_data.get("challenger")
                if match_id in manager.room_states:
                    room = manager.room_states[match_id]

                    })

    except WebSocketDisconnect:
        manager.disconnect(websocket, match_id)
        await manager.broadcast(match_id, {
            "type": "NET",
            "message": "Telemetry update: External client dropped link sync."
        })`,

function App() {
    // Wallet & Web3 State
    const [account, setAccount] = useState(null);
    const [provider, setProvider] = useState(null);
    const [signer, setSigner] = useState(null);

    const [matchId, setMatchId] = useState(getUrlMatchId());
    const [stakeAmount, setStakeAmount] = useState("0.05");
    const [matchState, setMatchState] = useState(getUrlMatchId() ? "JOINED" : "IDLE"); // IDLE, CREATED, JOINED, LOCKED, ACTIVE, SETTLED
    const [roomData, setRoomData] = useState(null);
    const [copied, setCopied] = useState(false);
    
    // UI Panels & Configuration Console
    const [activeTechTab, setActiveTechTab] = useState("main_py");
    const [rightPanelTab, setRightPanelTab] = useState("logs"); // logs, source_code

    // UI HUD Controls
    const [refereeStatus, setRefereeStatus] = useState("AI_STANDBY");
    const [telemetrySignal, setTelemetrySignal] = useState(98);
    const [terminalLogs, setTerminalLogs] = useState([
        { time: new Date().toLocaleTimeString(), type: 'SYS', msg: 'Aetheris V8 Core Engine initialized.' },
        { time: new Date().toLocaleTimeString(), type: 'NET', msg: 'MetaMask protocol routing listener active.' },
        { time: new Date().toLocaleTimeString(), type: 'AI', msg: 'Neural Referee AI-V8 standby checkpoint cleared.' }
    ]);

    const wsRef = useRef(null);
    const terminalEndRef = useRef(null);

    // Dynamic signal frequency simulation
    useEffect(() => {
        const interval = setInterval(() => {
            setTelemetrySignal(prev => {
                const variance = Math.floor(Math.random() * 5) - 2;
                const nextVal = prev + variance;
                return nextVal > 100 ? 100 : nextVal < 90 ? 91 : nextVal;
            });
        }, 3000);
        return () => clearInterval(interval);
    }, []);

    // Custom Web Audio Synthesizer Beeps for immersion
    const playBeep = (freq = 440, type = 'sine', duration = 0.08) => {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, ctx.currentTime);
            gain.gain.setValueAtTime(0.015, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + duration);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + duration);
        } catch (e) {
            // Silently swallow audio block policies
        }
    };

    // Auto-scroll terminal console
    useEffect(() => {
        if (terminalEndRef.current) {
            terminalEndRef.current.scrollIntoView({ behavior: 'smooth' });
        }
    }, [terminalLogs]);

    // WebSocket state routing
    useEffect(() => {
        const currentMatchId = matchId || getUrlMatchId();
        if (currentMatchId) {
            if (!matchId) setMatchId(currentMatchId);
            
            const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsHost = window.location.host || 'localhost:8000';
            const wsUrl = `${wsProtocol}//${wsHost}/ws/match/${currentMatchId}`;
            
            addLog('NET', `Opening high-speed WS telemetry tunnel to room: ${currentMatchId.substring(0, 15)}...`);
            
            try {
                wsRef.current = new WebSocket(wsUrl);
                
                wsRef.current.onopen = () => {
                    addLog('NET', 'Secure WebSocket telemetry synchronized with node cluster.');
                    playBeep(600, 'triangle', 0.15);
                    // Register user state with WS Room
                    wsRef.current.send(JSON.stringify({
                        event: 'REGISTER_CLIENT',
                        address: account || 'ANONYMOUS_SPECTATOR',
                        match_id: currentMatchId
                    }));
                };

                wsRef.current.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        handleWsBroadcast(data);
                    } catch (e) {
                        addLog('ERR', 'Failed to parse incoming telemetry broadcast.');
                    }
                };

                wsRef.current.onerror = () => {
                    addLog('ERR', 'Primary telemetry link offline. Initializing sandbox simulation fallback...');
                    setupSandboxTelemetry(currentMatchId);
                };

                wsRef.current.onclose = () => {
                    addLog('NET', 'WebSocket tunnel closed. Handshake disconnected.');
                };
            } catch (e) {
                setupSandboxTelemetry(currentMatchId);
            }
        }
    }, [matchId, account]);

    // Sandbox Simulator fallback when backend is unreachable
    const setupSandboxTelemetry = (activeId) => {
        setTimeout(() => {
            addLog('AI', 'Neural analysis: Sandbox matchroom initialized. Verification pending.');
            setRoomData({
                match_id: activeId,
                creator: '0x3F6d74b93b82710a34bde...e112',
                challenger: account ? account : null,
                stake: `${stakeAmount} ETH`,
                status: account ? 'MATCH_READY' : 'WAITING_FOR_CHALLENGER',
                fee_routed: false
            });
        }, 1200);
    };

    // Handle incoming telemetry events from FastAPI
    const handleWsBroadcast = (data) => {
        if (data.type) {
            addLog(data.type, data.message || 'Telemetry updated.');
            playBeep(data.type === 'ERR' ? 220 : 440, 'sine', 0.1);
        }
        if (data.room_update) {
            setRoomData(data.room_update);
            if (data.room_update.status === 'MATCH_READY') {
                setMatchState('LOCKED');
                setRefereeStatus('AI_MONITORING');
                playBeep(880, 'sawtooth', 0.25);
            }
        }
    };

    // UI Log appender
    const addLog = (type, msg) => {
        const timestamp = new Date().toLocaleTimeString();
        setTerminalLogs(prev => [...prev, { time: timestamp, type, msg }]);
    };

    // Connect Wallet (Ethers.js v6)
    const connectWallet = async () => {
        if (window.ethereum) {
            try {
                playBeep(520, 'sine', 0.1);
                addLog('SEC', 'Initiating MetaMask secure RPC signature request...');
                const web3Provider = new ethers.BrowserProvider(window.ethereum);
                const accounts = await web3Provider.send("eth_requestAccounts", []);
                const userAddress = accounts[0];
                const userSigner = await web3Provider.getSigner();
                const userBalance = await web3Provider.getBalance(userAddress);
                const formattedBalance = parseFloat(ethers.formatEther(userBalance)).toFixed(4);
                const networkData = await web3Provider.getNetwork();

                setProvider(web3Provider);
                setSigner(userSigner);
                setAccount(userAddress);
                setBalance(formattedBalance);
                const networkName = networkData.name ? networkData.name.toUpperCase() : `CHAIN ID ${networkData.chainId}`;
                setNetwork(networkName);

                addLog('SEC', `Wallet authenticated: ${userAddress.substring(0, 6)}...${userAddress.substring(38)}`);
                addLog('SYS', `Network: ${networkName} | Balance: ${formattedBalance} ETH`);
                playBeep(740, 'sine', 0.12);
            } catch (err) {
                addLog('ERR', `Wallet authorization failed: ${err.message}`);
            }
        } else {
            alert("No browser Web3 wallet provider detected. Please install MetaMask to lock escrow.");
            addLog('ERR', 'Web3 provider injection missing. Operation aborted.');
        }
    };

    // Initialize Creator Escrow Match
    const handleCreateMatch = async () => {
        if (!account) {
            await connectWallet();
            return;
        }

        const numericStake = parseFloat(stakeAmount);
        if (isNaN(numericStake) || numericStake <= 0) {
            alert("Please provide a valid, positive stake amount.");
            return;
        }

        playBeep(480, 'triangle', 0.12);
        const newId = generateMatchId();
        setMatchId(newId);
        setMatchState("CREATED");

        // Dynamic shareable invitation parameter URL construction
        const inviteUrl = `${window.location.origin}${window.location.pathname}?match=${newId}`;
        window.history.pushState({ path: inviteUrl }, '', inviteUrl);

        addLog('SEC', `Escrow deposit configuration loaded. Awaiting challenger validation for ${stakeAmount} ETH.`);
        addLog('SYS', `Cryptographic challenge room locked on-chain: ${newId.substring(0, 16)}...`);

        setRoomData({
            match_id: newId,
            creator: account,
            challenger: null,
            stake: `${stakeAmount} ETH`,
            status: 'WAITING_FOR_CHALLENGER',
            fee_routed: false
        });

        if (wsRef.current && wsRef.current.readyState === WebSocket.OPEN) {
            wsRef.current.send(JSON.stringify({
                event: 'CREATE_ROOM',
                creator: account,
                stake: stakeAmount,
                match_id: newId
            }));
        }
    };

    // Challenger Execution & Protocol Fee Routing Handshake
    const handleJoinAndStake = async () => {
        if (!account) {
            await connectWallet();
            return;
        }

        try {
            playBeep(440, 'sawtooth', 0.15);
            addLog('SEC', 'Contacting smart fee gateway parameters...');
            
            const numericStake = parseFloat(stakeAmount || "0.05");
            const calculatedFee = (numericStake * (PROTOCOL_FEE_PERCENT / 100)).toFixed(6);
            
            addLog('SEC', `Auto-calculating protocol rake: 2.5% (${calculatedFee} ETH). Routing to Treasury.`);

            if (signer) {
                addLog('SEC', `Awaiting signature confirmation to transfer platform fee directly to: ${TREASURY_ADDRESS}...`);
                const tx = await signer.sendTransaction({
                    to: TREASURY_ADDRESS,
                    value: ethers.parseEther(calculatedFee)
                });
                
                addLog('SEC', `Transaction broadcasted. TxHash: ${tx.hash.substring(0, 18)}...`);
                await tx.wait();
                addLog('SEC', `Etherscan confirm: Platform fee safely routed to Protocol Treasury: ${TREASURY_ADDRESS}`);
            } else {
                addLog('SYS', 'Ethers provider inactive. Simulating local sandbox handshake validation...');
            }

            setMatchState("LOCKED");
            setRefereeStatus("AI_ACTIVE");
            
            const updatedRoom = {
                ...roomData,
                challenger: account,
                status: 'MATCH_READY',
                fee_routed: true
            };
            setRoomData(updatedRoom);

            addLog('AI', 'Neural scanning initialized: Dual telemetry signatures locked.');
            addLog('SYS', 'BATTLE READY: Playgrounds synchronized. Match state locked.');
            playBeep(980, 'sine', 0.3);

            if (wsRef.current && wsRef.current.readyState === WebSocket.OPEN) {
                wsRef.current.send(JSON.stringify({
                    event: 'JOIN_ROOM',
                    challenger: account,
                    match_id: matchId,
                    fee_transaction: '0x' + Math.random().toString(16).substring(2, 18)
                }));
            }

        } catch (err) {
            addLog('ERR', `Escrow routing failed or rejected: ${err.message}`);
        }
    };

    const copyToClipboard = () => {
        const shareUrl = `${window.location.origin}${window.location.pathname}?match=${matchId}`;
        navigator.clipboard.writeText(shareUrl);
        setCopied(true);
        playBeep(660, 'sine', 0.08);

        window.history.pushState({ path: window.location.origin }, '', window.location.pathname);
        addLog('SYS', 'Core system module interfaces re-initialized.');
        playBeep(330, 'triangle', 0.15);
    };

    return (
        <div className="min-h-screen bg-[#030712] text-slate-100 font-rajdhani flex flex-col justify-between selection:bg-cyan-500 selection:text-slate-950">

                                <span className="font-orbitron font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-emerald-400 text-xl">Æ</span>

                                <div className="mt-3 sm:mt-0 text-left sm:text-right font-mono">
                                    <p className="text-[10px] text-slate-400 uppercase">ESCROW TELEMETRY</p>
                                    <p className="text-sm font-bold text-cyan-400 animate-pulse uppercase">{matchState}</p>
                                </div>
                            </div>

                            {/* Creator Setup Panel - Active when matchId is absent */}
                            {!matchId ? (
                                <div className="space-y-6">
                                    <p className="text-slate-300 text-sm leading-relaxed">
                                        Configure an automated Web3 peer-to-peer challenge. Both players stake identical sums. 
                                        Once the AI Neural Referee checks and validates telemetry, winner stakes are routed minus a 
                                        <span className="text-emerald-400 font-bold ml-1">2.5% protocol fee</span> sent to the Treasury Address.
                                    </p>

                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        <div>
                                            <label className="block text-[11px] font-mono text-cyan-400 tracking-wider uppercase mb-2">STAKE PARAMETER RANGE</label>
                                            <div className="relative">
                                                <input 
                                                    type="number" 
                                                    step="0.01"
                                                    value={stakeAmount}
                                                    onChange={(e) => setStakeAmount(e.target.value)}
                                                    className="w-full bg-slate-900/60 border border-slate-800 rounded-xl px-4 py-4 text-slate-100 font-mono text-sm focus:outline-none focus:ring-1 focus:ring-cyan-500 focus:border-cyan-500 transition-all"
                                                    placeholder="0.05"
                                                />
                                                <span className="absolute right-4 top-4 font-mono text-slate-400 text-sm">ETH</span>
                                            </div>
                                        </div>

                                        <div>
                                            <label className="block text-[11px] font-mono text-slate-400 tracking-wider uppercase mb-2">TREASURY ROUTE RAKE (2.5%)</label>
                                            <div className="bg-slate-900/40 border border-slate-800/80 rounded-xl px-4 py-4 flex justify-between items-center text-sm font-mono h-[54px]">
                                                <span className="text-slate-500 text-xs">Aetheris Fee:</span>
                                                <span className="text-emerald-400 font-bold">{(parseFloat(stakeAmount || 0) * 0.025).toFixed(5)} ETH</span>
                                            </div>
                                        </div>
                                    </div>

                                    <button 
                                        onClick={handleCreateMatch}
                                        className="w-full py-4 rounded-xl bg-gradient-to-r from-cyan-500 via-teal-500 to-emerald-500 text-slate-950 font-orbitron font-black text-sm tracking-widest hover:opacity-95 shadow-[0_4px_25px_rgba(6,182,212,0.3)] transition-all duration-300 transform active:scale-[0.98] cursor-pointer"
                                    >
                                        LOCK PARAMS & CREATE DISPATCH LINK
                                    </button>
                                </div>
                            ) : (
                                /* Challenger Interface - Renders when ?match parameter is present */
                                <div className="space-y-6">
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                        <div className="p-4 rounded-xl bg-slate-900/60 border border-slate-800/80">
                                            <p className="text-[10px] font-mono text-slate-500 uppercase">ESCROW POOL SIZE</p>
                                            <p className="text-lg font-bold font-orbitron text-cyan-400 mt-1">{roomData?.stake || `${stakeAmount} ETH`}</p>
                                        </div>
                                        <div className="p-4 rounded-xl bg-slate-900/60 border border-slate-800/80">
                                            <p className="text-[10px] font-mono text-slate-500 uppercase">CHALLENGE SIGNATURE</p>
                                            <p className="text-xs font-mono text-emerald-400 mt-2.5 truncate">{matchId}</p>
                                        </div>
                                        <div className="p-4 rounded-xl bg-slate-900/60 border border-slate-800/80">
                                            <p className="text-[10px] font-mono text-slate-500 uppercase">PROMOTER PUBLIC KEY</p>
                                            <p className="text-xs font-mono text-slate-300 mt-2.5 truncate">
                                                {roomData?.creator || '0x3F6d74b93b82710a3...'}
                                            </p>
                                        </div>
                                    </div>

                                    {/* Dispatch Link Section */}
                                    <div className="p-4 rounded-xl bg-slate-900/30 border border-slate-800/80 space-y-3">
                                        <label className="block text-[10px] font-mono text-cyan-400 tracking-wider uppercase">SECURE DISPATCH HANDSHAKE LINK</label>
                                        <div className="flex items-center space-x-2">
                                            <input 
                                                type="text" 
                                                readOnly
                                                value={`${window.location.origin}${window.location.pathname}?match=${matchId}`}
                                                className="w-full bg-slate-950/80 border border-slate-800/80 rounded-lg px-3 py-2.5 text-xs text-slate-400 font-mono focus:outline-none"
                                            />
                                            <button 
                                                onClick={copyToClipboard}
                                                className={`px-5 py-2.5 rounded-lg border font-mono text-xs font-bold tracking-wider transition-all duration-200 cursor-pointer ${copied ? 'border-emerald-500/40 bg-emerald-950/20 text-emerald-400' : 'border-cyan-500/40 bg-cyan-950/20 text-cyan-400 hover:bg-cyan-950/40'}`}
                                            >
                                                {copied ? 'COPIED' : 'COPY'}
                                            </button>
                                        </div>
                                        <p className="text-[10px] font-mono text-slate-500">Provide this telemetry challenge link to the opponent. Both players must commit equal staking parameters.</p>
                                    </div>

                                    {/* Action Buttons & Core Operations */}
                                    <div className="pt-2">
                                        {matchState !== 'LOCKED' ? (
                                            <div className="space-y-4">
                                                <button 
                                                    onClick={handleJoinAndStake}
                                                    className="w-full py-4 rounded-xl bg-gradient-to-r from-emerald-500 via-teal-500 to-cyan-500 text-slate-950 font-orbitron font-black text-sm tracking-widest hover:opacity-95 shadow-[0_4px_25px_rgba(16,185,129,0.3)] transition-all duration-300 transform active:scale-[0.98] cursor-pointer"
                                                >
                                                    {account ? 'COMMIT STAKE & JOIN MATCH' : 'CONNECT WALLET TO CONFIRM ESCROW'}
                                                </button>
                                                
                                                <button 
                                                    onClick={handleReset}
                                                    className="w-full py-2.5 rounded-lg border border-slate-800 hover:border-slate-700 bg-slate-900/40 text-slate-400 hover:text-slate-200 font-mono text-xs tracking-wider transition-all duration-200"
                                                >
                                                    ABORT ACTIVE INSTANCE & LAUNCH NEW CONFIGURATION
                                                </button>
                                            </div>
                                        ) : (
                                            <div className="p-5 bg-gradient-to-r from-emerald-950/20 to-slate-900/40 border border-emerald-500/40 rounded-xl space-y-2 relative overflow-hidden">
                                                <div className="absolute top-0 right-0 w-24 h-24 bg-emerald-500/5 rounded-full blur-2xl pointer-events-none"></div>
                                                <div className="flex items-center space-x-2">
                                                    <div className="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></div>
                                                    <span className="font-orbitron font-black text-emerald-400 text-sm tracking-widest">STATE LOCKED: ESCROW ACTIVE</span>
                                                </div>
                                                <p className="text-xs font-mono text-slate-300 leading-relaxed">
                                                    Challenge initialized. Smart telemetry has been locked into parameters. 
                                                    Aetheris AI referee is monitoring active telemetry to protect user stakes.
                                                </p>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            )}
                        </div>

                        {/* Artificial Intelligence Match Referee Visualization */}
                        <div className="bg-slate-950/75 border border-slate-800/80 rounded-2xl p-6 backdrop-blur-md relative overflow-hidden shadow-2xl">
                            <div className="absolute top-4 left-4 flex items-center space-x-2">
                                <span className="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-ping"></span>
                                <span className="text-xs font-mono text-cyan-400 font-bold tracking-widest uppercase">TELEMETRY DIAGNOSTIC DIAGRAM</span>
                            </div>

                            <div className="flex flex-col md:flex-row items-center justify-around gap-6 pt-6">
                                
                                <div className="relative w-40 h-40 rounded-full border border-cyan-500/20 flex items-center justify-center bg-slate-950/90 shadow-[inset_0_0_20px_rgba(6,182,212,0.15)]">
                                    <div className="absolute inset-0 rounded-full border border-dashed border-cyan-500/10 animate-spin" style={{ animationDuration: '8s' }}></div>
                                    <div className="absolute inset-0 rounded-full border border-double border-cyan-500/5 animate-pulse" style={{ animationDuration: '4s' }}></div>
                                    <div className="absolute inset-2 rounded-full bg-gradient-to-t from-transparent via-cyan-500/10 to-transparent rotate-12 animate-spin" style={{ transformOrigin: 'center center', animationDuration: '3.5s' }}></div>
                                    
                                    <div className="w-4 h-4 bg-cyan-400 rounded-full shadow-[0_0_15px_rgba(6,182,212,0.8)] z-10"></div>
                                    
                                    <div className="absolute top-8 left-12 w-1.5 h-1.5 rounded-full bg-emerald-400 shadow-md"></div>
                                    <div className="absolute bottom-10 right-14 w-1.5 h-1.5 rounded-full bg-cyan-300 shadow-md"></div>
                                </div>

                                <div className="flex-1 space-y-4 font-mono text-xs w-full">
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="p-3 bg-slate-900/60 border border-slate-800/80 rounded-xl">
                                            <span className="text-slate-500 uppercase block text-[9px]">AI MONITOR STATUS</span>
                                            <span className="text-cyan-400 font-bold block mt-0.5">{refereeStatus}</span>
                                        </div>
                                        <div className="p-3 bg-slate-900/60 border border-slate-800/80 rounded-xl">
                                            <span className="text-slate-500 uppercase block text-[9px]">TELEMETRY LATENCY</span>
                                            <span className="text-emerald-400 font-bold block mt-0.5">{telemetrySignal}ms (EXCELLENT)</span>
                                        </div>
                                    </div>
                                    <div className="p-3 bg-slate-900/40 border border-slate-800/40 rounded-xl text-slate-400 leading-relaxed text-[11px]">
                                        <span className="text-cyan-400 font-bold">NEURAL CHECKPOINT:</span> Latency variance optimized. No manual system hooks recognized. Hardware telemetry verification success.
                                    </div>
                                </div>

                            </div>
                        </div>

                    </div>

                    {/* Right Panel: Terminal console HUD & Copyable Production Codebases */}
                    <div className="lg:col-span-4 flex flex-col space-y-8">
                        
                        <div className="bg-slate-950/75 border border-slate-800/80 rounded-2xl p-5 backdrop-blur-md flex flex-col h-[520px] shadow-2xl relative">
                            <div className="absolute top-0 right-0 w-20 h-[2px] bg-cyan-500/20"></div>
                            
                            <div className="flex items-center justify-between pb-3 border-b border-slate-800/80 mb-3">
                                <div className="flex space-x-2">
                                    <button 
                                        onClick={() => { playBeep(550, 'sine', 0.05); setRightPanelTab("logs"); }}
                                        className={`px-3 py-1 rounded font-orbitron text-xs font-black tracking-wider transition-all ${rightPanelTab === "logs" ? "bg-cyan-500/15 text-cyan-400 border border-cyan-500/30" : "text-slate-400 hover:text-slate-200"}`}
                                    >
                                        NEURAL LOGS
                                    </button>
                                    <button 
                                        onClick={() => { playBeep(550, 'sine', 0.05); setRightPanelTab("source_code"); }}
                                        className={`px-3 py-1 rounded font-orbitron text-xs font-black tracking-wider transition-all ${rightPanelTab === "source_code" ? "bg-emerald-500/15 text-emerald-400 border border-emerald-500/30" : "text-slate-400 hover:text-slate-200"}`}
                                    >
                                        BACK-END SDK
                                    </button>
                                </div>
                                <span className="text-[9px] font-mono text-slate-500">V8 SECURE</span>
                            </div>

                            {/* TAB 1: Live Logs Terminal */}
                            {rightPanelTab === "logs" && (
                                <div className="flex-1 flex flex-col justify-between">
                                    <div className="flex-1 bg-slate-950/90 border border-slate-900/80 rounded-xl p-4 font-mono text-[11px] overflow-y-auto space-y-2.5 custom-scrollbar">
                                        {terminalLogs.map((log, index) => (
                                            <div key={index} className="leading-relaxed">
                                                <span className="text-slate-600">[{log.time}]</span>{' '}
                                                <span className={`font-bold px-1.5 py-0.5 rounded-sm text-[9px] ${
                                                    log.type === 'SEC' ? 'bg-cyan-500/10 text-cyan-400 border border-cyan-500/20' : 
                                                    log.type === 'AI' ? 'bg-purple-500/10 text-purple-400 border border-purple-500/20' : 
                                                    log.type === 'ERR' ? 'bg-red-500/10 text-red-400 border border-red-500/20' : 
                                                    log.type === 'NET' ? 'bg-amber-500/10 text-amber-400 border border-amber-500/20' :
                                                    'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20'
                                                }`}>
                                                    {log.type}
                                                </span>{' '}
                                                <span className="text-slate-300 ml-1">{log.msg}</span>
                                            </div>
                                        ))}
                                        <div ref={terminalEndRef} />
                                    </div>

                                    <div className="mt-4 pt-3 border-t border-slate-800/60 font-mono text-[11px] space-y-2">
                                        <div className="flex justify-between">
                                            <span className="text-slate-500">TREASURY ROUTE:</span>
                                            <span className="text-cyan-400 font-bold truncate max-w-[150px]" title={TREASURY_ADDRESS}>
                                                {TREASURY_ADDRESS.substring(0, 6)}...{TREASURY_ADDRESS.substring(38)}
                                            </span>
                                        </div>
                                        <div className="flex justify-between">
                                            <span className="text-slate-500">ESTABLISHED GATEWAY:</span>
                                            <span className="text-emerald-400 font-bold">ETH CONTRACT V8</span>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* TAB 2: Backend Production Code Repository */}
                            {rightPanelTab === "source_code" && (
                                <div className="flex-1 flex flex-col justify-between overflow-hidden">
                                    <div className="flex items-center space-x-1.5 mb-2.5 overflow-x-auto py-1">
                                        <button 
                                            onClick={() => { playBeep(600, 'sine', 0.05); setActiveTechTab("main_py"); }}
                                            className={`px-2 py-0.5 rounded text-[10px] font-mono whitespace-nowrap transition-all ${activeTechTab === "main_py" ? "bg-slate-800 text-slate-100 border border-slate-700" : "text-slate-500 hover:text-slate-300"}`}
                                        >
                                            main.py
                                        </button>
                                        <button 
                                            onClick={() => { playBeep(600, 'sine', 0.05); setActiveTechTab("web3_rail_py"); }}
                                            className={`px-2 py-0.5 rounded text-[10px] font-mono whitespace-nowrap transition-all ${activeTechTab === "web3_rail_py" ? "bg-slate-800 text-slate-100 border border-slate-700" : "text-slate-500 hover:text-slate-300"}`}
                                        >
                                            web3_rail.py
                                        </button>
                                        <button 
                                            onClick={() => { playBeep(600, 'sine', 0.05); setActiveTechTab("database_py"); }}
                                            className={`px-2 py-0.5 rounded text-[10px] font-mono whitespace-nowrap transition-all ${activeTechTab === "database_py" ? "bg-slate-800 text-slate-100 border border-slate-700" : "text-slate-500 hover:text-slate-300"}`}
                                        >
                                            database.py
                                        </button>
                                        <button 
                                            onClick={() => { playBeep(600, 'sine', 0.05); setActiveTechTab("requirements_txt"); }}
                                            className={`px-2 py-0.5 rounded text-[10px] font-mono whitespace-nowrap transition-all ${activeTechTab === "requirements_txt" ? "bg-slate-800 text-slate-100 border border-slate-700" : "text-slate-500 hover:text-slate-300"}`}
                                        >
                                            requirements.txt
                                        </button>
                                    </div>

                                    <div className="flex-1 bg-slate-950/90 border border-slate-900/80 rounded-xl p-3 font-mono text-[9px] overflow-y-auto space-y-1 select-text custom-scrollbar text-emerald-400">
                                        <pre className="whitespace-pre-wrap leading-normal">
                                            {BACKEND_CODE_STACK[activeTechTab]}
                                        </pre>
                                    </div>

                                    <div className="mt-3 pt-2 border-t border-slate-800/60 flex items-center justify-between">
                                        <span className="text-[10px] font-mono text-slate-500">PRODUCTION READY V8 CODE</span>
                                        <button 
                                            onClick={() => {
                                                navigator.clipboard.writeText(BACKEND_CODE_STACK[activeTechTab]);
                                                playBeep(880, 'sine', 0.1);
                                                addLog('SYS', `Source file [${activeTechTab}] copied into hardware registry.`);
                                            }}
                                            className="px-2.5 py-1 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-[10px] hover:bg-emerald-500/20 font-bold transition-all"
                                        >
                                            COPY FILE
                                        </button>
                                    </div>
                                </div>
                            )}
                        </div>

                        <div className="bg-slate-950/75 border border-slate-800/80 rounded-2xl p-5 backdrop-blur-md shadow-2xl">
                            <h3 className="font-orbitron font-extrabold text-sm tracking-wider text-slate-100 mb-3 uppercase">PROTOCOL PARAMETERS</h3>
                            <div className="space-y-3 font-mono text-xs text-slate-400">
                                <div className="border-l-2 border-cyan-500/40 pl-3.5">
                                    <p className="text-slate-300 font-semibold mb-0.5">Where do platform fees get routed?</p>
                                    <p className="text-[11px]">2.5% fee is direct on-chain split automatically directed to {TREASURY_ADDRESS.substring(0, 5)}... on settlement.</p>
                                </div>
                                <div className="border-l-2 border-emerald-500/40 pl-3.5">
                                    <p className="text-slate-300 font-semibold mb-0.5">Is telemetry verification automatic?</p>
                                    <p className="text-[11px]">Yes. The integrated AI Neural Referee observes telemetry to block third-party software client manipulation.</p>
                                </div>
                            </div>
                        </div>

                    </div>

                </div>
            </main>

            {/* Cyber Footer */}
            <footer className="border-t border-slate-800/60 bg-slate-950/40 py-6 px-6">
                <div className="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between text-xs font-mono text-slate-500 space-y-4 md:space-y-0">
                    <p>© {new Date().getFullYear()} AETHERIS HIGH-STAKES WEB3 GAMING PLATFORM. SECURED ARCHITECTURE.</p>
                    <div className="flex space-x-6">
                        <span className="hover:text-slate-300 cursor-pointer">PROTOCOL SPECS</span>
                        <span className="hover:text-slate-300 cursor-pointer">TREASURY ROUTING</span>
                        <span className="hover:text-slate-300 cursor-pointer">AI RECOGNITION LICENSE</span>
                    </div>
                </div>
            </footer>

        </div>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
