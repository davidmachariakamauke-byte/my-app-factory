name: Universal AI Factory

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pages: write

jobs:
  run-factory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Run Gemini AI Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_BODY: ${{ github.event.issue.body || github.event.comment.body }}
        run: node scripts/generate.js

      - name: Render Video Tutorial
        run: npx remotion render src/TutorialComposition.jsx Tutorial out/tutorial.mp4

      - name: Commit App & Video
        run: |
          git config user.name "AI App Factory"
          git config user.email "factory@github.local"
          git add .
          git commit -m "Auto-generated app & video for Issue #${{ github.event.issue.number }}" || exit 0
          git push

      - name: Reply to Issue
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.issue.number;
            
            github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: `🚀 **App and Tutorial Video Created!**\n\nYour app code and video tutorial have been compiled and saved directly into your repository.`
            });
