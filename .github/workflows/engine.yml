name: Universal AI Factory

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pages: write

jobs:
  run-factory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Gemini SDK
        run: npm install @google/genai

      - name: Run Gemini Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_BODY: ${{ github.event.issue.body || github.event.comment.body }}
        run: node scripts/generate.js

      - name: Commit & Deploy
        run: |
          git config user.name "AI App Factory"
          git config user.email "factory@github.local"
          git add index.html
          git commit -m "Generated KaziConnect App for Issue #${{ github.event.issue.number }}" || exit 0
          git push

      - name: Reply to Issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "🚀 **App Published!**\n\nYour app has been built and updated directly on GitHub Pages."
            });
